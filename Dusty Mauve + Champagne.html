<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Melodies - Spotify Widget</title>
    
    <!-- STRICTLY ONLY SAIL FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sail&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Palette & Notion Blending */
            --bg-notion: #191919;           /* Blends seamlessly with Notion 🖤 */
            --bg-main: #171216;             /* Background */
            --glass-card: #21191F;          /* Glass Container */
            --text-primary: #FFF9F6;        /* Primary Text */
            --text-secondary: #BCA5AE;      /* Secondary Text */
            --accent: #B8899A;              /* Accent */
            --accent-secondary: #D7B78A;    /* Secondary Accent */
            --glow: #E8C8D3;                /* Glow */
            --border: #6D505C;              /* Border */
            --border-alpha: rgba(109, 80, 92, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sail', cursive !important;
        }

        body {
            background-color: var(--bg-notion);
            color: var(--text-primary);
            display: flex;
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 16px; 
            overflow: hidden; 
            position: relative;
        }

        /* 🌸 Ultra-Smooth Ambient Dynamic Floating Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.42;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 14s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .orb-1 {
            width: 310px;
            height: 310px;
            background: var(--glow);
            top: 2%;
            left: 5%;
        }

        .orb-2 {
            width: 270px;
            height: 270px;
            background: var(--accent);
            bottom: 2%;
            right: 5%;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 180px;
            height: 180px;
            background: var(--accent-secondary);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.25;
            animation: floatOrbCenter 10s infinite alternate ease-in-out;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(45px, 55px) scale(1.25) rotate(180deg); }
            100% { transform: translate(-35px, 35px) scale(0.85) rotate(360deg); }
        }

        @keyframes floatOrbCenter {
            0% { transform: translate(-50%, -50%) scale(0.8); }
            100% { transform: translate(-50%, -50%) scale(1.3); }
        }

        /* ✨ High-Frequency Breathing Title Glow */
        @keyframes titleBreathing {
            0% { text-shadow: 0 0 10px var(--glow), 0 0 20px var(--accent); }
            50% { text-shadow: 0 0 18px var(--glow), 0 0 32px var(--accent-secondary); }
            100% { text-shadow: 0 0 10px var(--glow), 0 0 20px var(--accent); }
        }

        /* 🔮 Multi-Layer Dynamic Floating Container & Glowing Pulsations */
        @keyframes containerGlow {
            0% {
                border-color: rgba(109, 80, 92, 0.55);
                box-shadow: 0 14px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(232, 200, 211, 0.22);
            }
            50% {
                border-color: rgba(232, 200, 211, 0.9);
                box-shadow: 0 22px 55px rgba(0, 0, 0, 0.92), 0 0 40px rgba(232, 200, 211, 0.5);
            }
            100% {
                border-color: rgba(109, 80, 92, 0.55);
                box-shadow: 0 14px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(232, 200, 211, 0.22);
            }
        }

        @keyframes floatCard {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(0.4deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .spotify-container {
            width: 100%;
            max-width: 340px; 
            background: linear-gradient(145deg, rgba(23, 18, 22, 0.95), rgba(33, 25, 31, 0.92));
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1.5px solid var(--border);
            border-radius: 26px;
            padding: 18px; 
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            animation: 
                containerGlow 5s infinite ease-in-out,
                floatCard 6s infinite ease-in-out;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 💫 Continuous Shimmering Light Sweep Overlay Animation */
        .spotify-container::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                135deg,
                transparent 40%,
                rgba(232, 200, 211, 0.18) 50%,
                transparent 60%
            );
            transform: rotate(25deg);
            animation: shineSweep 5.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        @keyframes shineSweep {
            0% { transform: translateY(-85%) rotate(25deg); }
            100% { transform: translateY(85%) rotate(25deg); }
        }

        /* 🎶 Widget Header */
        .spotify-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-alpha);
            z-index: 1;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spotify-title {
            font-size: 1.55rem; 
            color: var(--text-primary);
            animation: titleBreathing 4s infinite ease-in-out;
            letter-spacing: 0.5px;
            font-weight: normal;
        }

        /* 🎧 Enhanced 4-Bar Equalizer Animation */
        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 18px;
        }

        .eq-bar {
            width: 3px;
            background: linear-gradient(180deg, var(--glow), var(--accent));
            border-radius: 3px;
            box-shadow: 0 0 10px var(--glow);
            animation: bounceEq 1s infinite ease-in-out alternate;
        }

        .eq-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 95%; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 60%; animation-delay: 0.5s; }
        .eq-bar:nth-child(4) { height: 80%; animation-delay: 0.2s; }

        @keyframes bounceEq {
            0% { height: 20%; transform: scaleY(0.8); }
            100% { height: 100%; transform: scaleY(1.1); }
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-btn {
            background: rgba(33, 25, 31, 0.7);
            border: 1px solid var(--border-alpha);
            color: var(--text-primary);
            font-size: 1rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            outline: none;
        }

        .settings-btn:hover {
            background: var(--accent);
            color: var(--bg-main);
            border-color: var(--glow);
            transform: rotate(180deg) scale(1.22);
            box-shadow: 0 0 20px var(--glow);
        }

        /* 🌺 Double Pulsing Status Ripple Dot */
        .pulse-dot-container {
            position: relative;
            width: 12px;
            height: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spotify-dot {
            width: 8px; 
            height: 8px;
            border-radius: 50%;
            background: var(--accent-secondary);
            box-shadow: 0 0 12px var(--glow);
            z-index: 1;
            animation: pulseCore 2s infinite ease-in-out alternate;
        }

        @keyframes pulseCore {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.25); background: var(--glow); }
        }

        .pulse-ripple {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1.5px solid var(--glow);
            animation: ripple 2.2s infinite cubic-bezier(0, 0.2, 0.8, 1);
        }

        .pulse-ripple-delay {
            animation-delay: 1.1s;
        }

        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        /* ⚙️ Interactive Dropdown Panel */
        .settings-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(33, 25, 31, 0.94);
            padding: 0 14px;
            border-radius: 18px;
            border: 0px solid var(--border-alpha);
            transition: all 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(-12px) scale(0.98);
            z-index: 2;
        }

        .settings-panel.active {
            max-height: 340px;
            opacity: 1;
            padding: 14px;
            border-width: 1px;
            transform: translateY(0) scale(1);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.65), 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .preset-label {
            font-size: 1rem;
            color: var(--accent-secondary);
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(215, 183, 138, 0.4);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .preset-btn {
            background: rgba(23, 18, 22, 0.85);
            border: 1px solid var(--border-alpha);
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            text-align: center;
        }

        .preset-btn:hover {
            background: var(--glass-card);
            color: var(--text-primary);
            border-color: var(--accent-secondary);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5), 0 0 14px rgba(215, 183, 138, 0.4);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-alpha), transparent);
            margin: 2px 0;
        }

        .settings-panel input {
            width: 100%;
            background: rgba(23, 18, 22, 0.9);
            border: 1px solid var(--border-alpha);
            border-radius: 10px;
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.35s ease;
        }

        .settings-panel input:focus {
            border-color: var(--glow);
            box-shadow: 0 0 14px rgba(232, 200, 211, 0.45);
            background: var(--bg-main);
        }

        .settings-panel input::placeholder {
            color: var(--text-secondary);
            opacity: 0.65;
        }

        .apply-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border: none;
            color: var(--bg-main);
            font-weight: bold;
            padding: 9px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }

        .apply-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--glow);
            filter: brightness(1.15);
        }

        /* 🖼️ Embedded Spotify Frame Wrapper */
        .iframe-wrapper {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: var(--bg-main);
            border: 1px solid var(--border-alpha);
            z-index: 1;
            transition: all 0.45s ease;
            box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.9);
        }

        .iframe-wrapper:hover {
            border-color: var(--border);
            box-shadow: 0 0 22px rgba(109, 80, 92, 0.55);
        }

        iframe {
            width: 100%;
            height: 640px; 
            border: none;
            display: block;
            filter: contrast(102%);
        }
    </style>
</head>
<body>

    <!-- Dynamic Background Ambient Floating Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <div class="spotify-container">
        
        <!-- Header Section -->
        <div class="spotify-header">
            <div class="header-title-group">
                <div class="spotify-title">Aura Melodies ✨</div>
                <div class="equalizer">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
            </div>
            <div class="header-controls">
                <button class="settings-btn" onclick="toggleSettings()" title="Choose Playlist">⚙️</button>
                <div class="pulse-dot-container">
                    <div class="pulse-ripple"></div>
                    <div class="pulse-ripple pulse-ripple-delay"></div>
                    <div class="spotify-dot"></div>
                </div>
            </div>
        </div>

        <!-- Interactive Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="preset-label">Quick Vibe Presets:</div>
            <div class="preset-grid">
                <button class="preset-btn" onclick="setPreset('37i9dQZF1DXcBWIGoYBM5M')">Today's Top ⚡</button>
                <button class="preset-btn" onclick="setPreset('37i9dQZF1DWZeKCadgRdKQ')">Lo-Fi Beats ☕</button>
                <button class="preset-btn" onclick="setPreset('37i9dQZF1DX8Uebhn9wzrS')">Soft Piano 🎹</button>
                <button class="preset-btn" onclick="setPreset('37i9dQZF1DX4WYTNICININ')">Night Drive 🌙</button>
            </div>
            <div class="divider"></div>
            <div class="preset-label">Or Paste Playlist Link:</div>
            <input type="text" id="playlistInput" placeholder="Paste Spotify Playlist URL...">
            <button class="apply-btn" onclick="saveCustomPlaylist()">Apply Custom Link</button>
        </div>

        <!-- Embedded Spotify Player -->
        <div class="iframe-wrapper">
            <iframe id="spotifyIframe" src="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
            </iframe>
        </div>

    </div>

    <script>
        const defaultPlaylistId = "37i9dQZF1DXcBWIGoYBM5M";

        function getStoredPlaylistId() {
            return localStorage.getItem('custom_spotify_playlist_id') || defaultPlaylistId;
        }

        function updateIframeSource() {
            const playlistId = getStoredPlaylistId();
            const iframe = document.getElementById('spotifyIframe');
            iframe.src = `https://open.spotify.com/embed/playlist/${playlistId}?utm_name=generator&theme=0`;
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('active');
        }

        function setPreset(playlistId) {
            localStorage.setItem('custom_spotify_playlist_id', playlistId);
            updateIframeSource();
            toggleSettings();
        }

        function saveCustomPlaylist() {
            const input = document.getElementById('playlistInput').value.trim();
            if (!input) return;

            const match = input.match(/playlist\/([a-zA-Z0-9]+)/);
            let playlistId = match ? match[1] : input;

            localStorage.setItem('custom_spotify_playlist_id', playlistId);
            updateIframeSource();
            toggleSettings();
            document.getElementById('playlistInput').value = '';
        }

        // Initialize widget on load
        updateIframeSource();
    </script>
</body>
</html>
