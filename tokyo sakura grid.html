<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Vibrant Skill Vector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Upgraded Vibrant Palette */
            --notion-bg: #191919;
            --dove: #FCEFFA;
            --rose-garden: #D09DB8;
            --rose-glow: #F3B5D6; /* Brighter accent for glowing */
            --mulled-wine: #7A4E7E; /* Lightened for contrast */
            --vanilla-pod: #423048;
            --ganache: #2B1F21;
            --glass-border: rgba(243, 181, 214, 0.4);
            
            /* Glow Effects */
            --neon-shadow: 0 0 15px rgba(243, 181, 214, 0.6), 0 0 30px rgba(122, 78, 126, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--notion-bg);
            color: var(--dove);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            overflow-x: hidden;
        }

        /* Outer Container */
        .bento-container {
            width: 100%;
            max-width: 960px;
            background: var(--ganache);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.9), inset 0 2px 5px rgba(252, 239, 250, 0.15);
            display: grid;
            grid-template-columns: 1fr 1fr 1.3fr;
            grid-template-rows: auto auto auto;
            gap: 18px;
            position: relative;
        }

        /* Common Bento Card Style with Entrance Animation */
        .bento-card {
            background: linear-gradient(145deg, var(--vanilla-pod), #36263A);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: slideInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
        }

        /* Staggered Boot-up Animations */
        .bento-card:nth-child(1) { animation-delay: 0.1s; }
        .bento-card:nth-child(2) { animation-delay: 0.25s; }
        .bento-card:nth-child(3) { animation-delay: 0.4s; }
        .bento-card:nth-child(4) { animation-delay: 0.55s; }
        .bento-card:nth-child(5) { animation-delay: 0.7s; }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .bento-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), var(--neon-shadow);
            border-color: var(--rose-glow);
            z-index: 10;
        }

        /* CARD 1: Interactive Control Slider */
        .card-controls {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--rose-glow);
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(243, 181, 214, 0.5);
            animation: pulseText 3s infinite alternate;
        }

        @keyframes pulseText {
            from { opacity: 0.8; text-shadow: 0 0 5px rgba(243, 181, 214, 0.3); }
            to { opacity: 1; text-shadow: 0 0 15px rgba(243, 181, 214, 0.8); }
        }

        select {
            width: 100%;
            background: rgba(43, 31, 33, 0.8);
            color: var(--dove);
            border: 1px solid var(--mulled-wine);
            padding: 10px 12px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus, select:hover {
            border-color: var(--rose-glow);
            box-shadow: 0 0 15px rgba(243, 181, 214, 0.3);
        }

        .slider-group { margin-top: 15px; }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 8px;
            color: var(--dove);
            font-weight: 600;
        }

        #sliderValDisplay {
            color: var(--rose-glow);
            text-shadow: 0 0 8px var(--rose-glow);
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(122, 78, 126, 0.4);
            height: 8px;
            border-radius: 6px;
            outline: none;
            overflow: hidden;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--dove);
            border: 4px solid var(--rose-glow);
            cursor: pointer;
            box-shadow: -400px 0 0 390px var(--mulled-wine), 0 0 15px var(--rose-glow);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* CARD 2: Mastery Index Metric */
        .card-metric {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .metric-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--dove);
            line-height: 1;
            margin: 5px 0;
            text-shadow: 0 0 25px rgba(252, 239, 250, 0.6);
            transition: transform 0.3s ease, text-shadow 0.3s ease;
            cursor: default;
        }

        .card-metric:hover .metric-value {
            transform: scale(1.1);
            text-shadow: 0 0 40px var(--rose-glow);
            color: var(--rose-glow);
        }

        .metric-ring {
            position: absolute;
            width: 115px;
            height: 115px;
            border-radius: 50%;
            border: 3px dashed var(--mulled-wine);
            border-top: 3px solid var(--rose-glow);
            animation: rotateRing 10s linear infinite;
            filter: drop-shadow(0 0 8px var(--rose-glow));
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* CARD 3: Quick Filter Status Pills */
        .card-quick {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, rgba(85, 55, 88, 0.4), transparent);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--ganache);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--rose-glow);
            font-size: 0.8rem;
            color: var(--dove);
            box-shadow: 0 0 15px rgba(243, 181, 214, 0.2);
            transition: all 0.3s ease;
        }

        .status-pill:hover {
            box-shadow: var(--neon-shadow);
            transform: scale(1.05);
        }

        .pill-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00FF88; /* Vibrant accent override */
            box-shadow: 0 0 12px #00FF88;
            animation: blinkDot 1.5s infinite;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* CARD 4: Aesthetic Visual Image Card + UPLOAD FEATURE */
        .card-image {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
            height: 170px;
            padding: 0;
            background-color: var(--ganache);
            background-image: url('https://images.unsplash.com/photo-1528164344705-47542687990d?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            transition: background-image 0.5s ease-in-out;
        }

        .image-overlay {
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(to top, rgba(43, 31, 33, 0.95), transparent);
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            animation: breatheLayer 4s infinite alternate;
        }

        @keyframes breatheLayer {
            from { padding-bottom: 15px; }
            to { padding-bottom: 20px; }
        }

        .image-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--dove);
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            outline: none;
        }

        .image-sub {
            font-size: 0.75rem;
            color: var(--rose-glow);
            outline: none;
        }

        .live-badge {
            font-size: 0.7rem;
            background: rgba(243, 181, 214, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid var(--rose-glow);
            box-shadow: 0 0 10px rgba(243, 181, 214, 0.4);
            animation: pulseText 2s infinite alternate;
        }

        /* Upload Button Overlay */
        .upload-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(43, 31, 33, 0.8);
            color: var(--dove);
            border: 1px solid var(--rose-glow);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 5;
        }

        .card-image:hover .upload-btn {
            opacity: 1;
            transform: translateY(0);
        }
        .upload-btn:hover { background: var(--rose-glow); color: var(--ganache); }

        /* CARD 5: Main 5-Layer Polygon Radar & Chart Module */
        .card-chart {
            grid-column: 3 / 4;
            grid-row: 1 / 4;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: radial-gradient(circle at center, #4A334E, var(--ganache));
        }

        .chart-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .view-btn {
            background: rgba(122, 78, 126, 0.3);
            border: 1px solid var(--rose-glow);
            color: var(--rose-glow);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(243, 181, 214, 0.2);
        }

        .view-btn:hover {
            background: var(--rose-glow);
            color: var(--ganache);
            box-shadow: 0 0 20px var(--rose-glow);
            transform: scale(1.05);
        }

        /* SVG Radar styling */
        svg.radar-svg {
            width: 100%;
            max-width: 290px;
            height: 290px;
            overflow: visible;
        }

        .radar-grid {
            fill: none;
            stroke: var(--mulled-wine);
            stroke-width: 1.5;
            opacity: 0.8;
        }

        .radar-grid-5 {
            stroke: var(--rose-glow);
            stroke-width: 2;
            opacity: 1;
            filter: drop-shadow(0 0 5px var(--rose-glow));
        }

        .radar-axis {
            stroke: rgba(243, 181, 214, 0.25);
            stroke-width: 1.5;
            stroke-dasharray: 4;
        }

        /* Glowy Animated Polygon */
        .radar-polygon {
            fill: rgba(243, 181, 214, 0.45);
            stroke: var(--rose-glow);
            stroke-width: 3;
            filter: drop-shadow(0 0 15px var(--rose-glow));
            mix-blend-mode: screen;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy expansion */
        }

        .radar-node {
            fill: var(--dove);
            stroke: var(--rose-glow);
            stroke-width: 2.5;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), fill 0.3s ease, filter 0.3s ease;
        }

        .radar-node:hover {
            transform: scale(2);
            fill: #FFF;
            filter: drop-shadow(0 0 10px #FFF);
        }

        .axis-label {
            font-size: 0.75rem;
            fill: var(--dove);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        /* Alternative Line Chart View */
        .line-chart-container {
            width: 100%;
            height: 280px;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            gap: 15px;
            padding: 10px 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bar-name {
            width: 95px;
            font-size: 0.75rem;
            color: var(--dove);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-track {
            flex-grow: 1;
            height: 10px;
            background: rgba(43, 31, 33, 0.8);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--mulled-wine);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--mulled-wine), var(--rose-glow));
            border-radius: 10px;
            width: 0%; /* Animates via JS */
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 10px var(--rose-glow);
        }

        .bar-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--rose-glow);
            font-weight: 700;
            width: 35px;
            text-align: right;
            text-shadow: 0 0 8px var(--rose-glow);
        }

        /* Hover Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(43, 31, 33, 0.9);
            border: 1px solid var(--rose-glow);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--dove);
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), 0 0 15px rgba(243, 181, 214, 0.3);
            z-index: 100;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div class="bento-container">
        
        <!-- CARD 1: Interactive Control Slider -->
        <div class="bento-card card-controls">
            <div>
                <div class="card-label">⚡ Skill Calibrator</div>
                <select id="skillSelect" onchange="syncSliderWithValue()">
                    <option value="0">Academic Writing</option>
                    <option value="1">Public Speaking</option>
                    <option value="2">IELTS Academic</option>
                    <option value="3">Python Programming</option>
                    <option value="4">SQL & Databases</option>
                </select>
            </div>
            
            <div class="slider-group">
                <div class="slider-header">
                    <span>Proficiency</span>
                    <span id="sliderValDisplay">90%</span>
                </div>
                <input type="range" id="skillSlider" min="0" max="100" value="90" oninput="updateSkillFromSlider(this.value)">
            </div>
        </div>

        <!-- CARD 2: Overall Mastery Meter -->
        <div class="bento-card card-metric">
            <div class="metric-ring"></div>
            <div class="card-label" style="text-shadow: none; animation: none;">Mastery Index</div>
            <div class="metric-value" id="averageScore">0%</div>
            <div style="font-size: 0.7rem; color: var(--rose-garden); font-weight: 600; letter-spacing: 1px;">GLOBAL VECTOR AVG</div>
        </div>

        <!-- CARD 3: Quick Status & Focus -->
        <div class="bento-card card-quick">
            <div class="status-pill">
                <div class="pill-dot"></div>
                <span style="font-weight: 600; letter-spacing: 0.5px;">Focus: Academic</span>
            </div>
            <div style="font-size: 0.8rem; color: var(--rose-glow); font-family: 'JetBrains Mono', monospace; font-weight: 700; text-shadow: 0 0 8px var(--rose-glow);">
                5 VECTOR NODES
            </div>
        </div>

        <!-- CARD 4: Aesthetic Cherry Blossom Visual Card + IMAGE UPLOADER -->
        <div class="bento-card card-image" id="imageCard">
            <!-- Hidden File Input -->
            <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            <!-- Upload Trigger Button -->
            <button class="upload-btn" onclick="document.getElementById('imageUpload').click()">📷 Embed Image</button>

            <div class="image-overlay">
                <div>
                    <div class="image-title" contenteditable="true" spellcheck="false">Tokyo Sakura Grid</div>
                    <div class="image-sub" contenteditable="true" spellcheck="false">Skills & Certifications HUD • 2026</div>
                </div>
                <span class="live-badge">LIVE</span>
            </div>
        </div>

        <!-- CARD 5: 5-Layer Polygon Radar & Bar Chart Module -->
        <div class="bento-card card-chart">
            <div class="chart-header">
                <div class="card-label" style="margin: 0; animation: pulseText 2s infinite alternate;">🌐 Skill Radar</div>
                <button class="view-btn" onclick="toggleChartView()" id="toggleBtn">Switch to Bar Graph</button>
            </div>

            <!-- Radar View -->
            <svg class="radar-svg" id="radarSvg" viewBox="0 0 320 320">
                <!-- 5 Concentric Pentagonal Layers -->
                <polygon class="radar-grid" points="" id="grid-1" />
                <polygon class="radar-grid" points="" id="grid-2" />
                <polygon class="radar-grid" points="" id="grid-3" />
                <polygon class="radar-grid" points="" id="grid-4" />
                <polygon class="radar-grid radar-grid-5" points="" id="grid-5" />

                <!-- 5 Radial Axes -->
                <g id="axesGroup"></g>

                <!-- Animated Data Polygon -->
                <polygon class="radar-polygon" id="dataPolygon" points="" />

                <!-- Nodes -->
                <g id="nodesGroup"></g>

                <!-- Labels -->
                <g id="labelsGroup"></g>
            </svg>

            <!-- Bar Chart View (Hidden by default) -->
            <div class="line-chart-container" id="barChartContainer">
                <!-- Injected via JS -->
            </div>
        </div>

    </div>

    <!-- Floating Tooltip -->
    <div class="tooltip" id="tooltip"></div>

    <script>
        const skillsData = [
            { name: "Academic Writing", val: 90, type: "Skill" },
            { name: "Public Speaking", val: 80, type: "Skill" },
            { name: "IELTS Academic", val: 65, type: "Certification" },
            { name: "Python Coding", val: 55, type: "Skill" },
            { name: "SQL & Databases", val: 30, type: "Skill" }
        ];

        const cx = 160;
        const cy = 160;
        const maxRadius = 110;
        const totalAxes = skillsData.length;
        let isRadarView = true;

        // Custom Image Upload Handler
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const card = document.getElementById('imageCard');
                    card.style.backgroundImage = `url(${e.target.result})`;
                }
                reader.readAsDataURL(file);
            }
        }

        // Polar to Cartesian Geometry
        function getAngle(index) { return (-Math.PI / 2) + (index * (2 * Math.PI / totalAxes)); }
        
        function getCoordinates(index, valuePercent) {
            const angle = getAngle(index);
            const r = (valuePercent / 100) * maxRadius;
            return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
        }

        // Draw the neon grid background
        function drawGridLayers() {
            for (let level = 1; level <= 5; level++) {
                const percent = level * 20;
                let pointsStr = "";
                for (let i = 0; i < totalAxes; i++) {
                    const coords = getCoordinates(i, percent);
                    pointsStr += `${coords.x},${coords.y} `;
                }
                document.getElementById(`grid-${level}`).setAttribute("points", pointsStr.trim());
            }

            const axesGroup = document.getElementById("axesGroup");
            axesGroup.innerHTML = "";
            for (let i = 0; i < totalAxes; i++) {
                const outer = getCoordinates(i, 100);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", cx); line.setAttribute("y1", cy);
                line.setAttribute("x2", outer.x); line.setAttribute("y2", outer.y);
                line.setAttribute("class", "radar-axis");
                axesGroup.appendChild(line);
            }
        }

        // Update Radar with Zero-to-Max Boot Animation
        function updateRadar(animateFromZero = false) {
            let dataPointsStr = "";
            const nodesGroup = document.getElementById("nodesGroup");
            const labelsGroup = document.getElementById("labelsGroup");
            nodesGroup.innerHTML = "";
            labelsGroup.innerHTML = "";

            skillsData.forEach((skill, i) => {
                // Determine if starting from 0 for intro animation
                const startVal = animateFromZero ? 0 : skill.val;
                const coords = getCoordinates(i, startVal);
                const targetCoords = getCoordinates(i, skill.val);
                
                dataPointsStr += `${targetCoords.x},${targetCoords.y} `;

                // Node Circle
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", targetCoords.x);
                circle.setAttribute("cy", targetCoords.y);
                circle.setAttribute("r", "6");
                circle.setAttribute("class", "radar-node");
                
                circle.addEventListener("mouseenter", (e) => showTooltip(e, `${skill.name}: ${skill.val}%`));
                circle.addEventListener("mouseleave", hideTooltip);
                nodesGroup.appendChild(circle);

                // Labels
                const labelCoords = getCoordinates(i, 125);
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", labelCoords.x);
                text.setAttribute("y", labelCoords.y);
                text.setAttribute("class", "axis-label");
                text.textContent = skill.name.split(" ")[0]; // First word
                labelsGroup.appendChild(text);
            });

            const poly = document.getElementById("dataPolygon");
            if (animateFromZero) {
                // Set to center first
                let zeroPointsStr = "";
                for(let i=0; i<totalAxes; i++) { zeroPointsStr += `${cx},${cy} `; }
                poly.setAttribute("points", zeroPointsStr.trim());
                
                // Trigger CSS transition
                setTimeout(() => {
                    poly.setAttribute("points", dataPointsStr.trim());
                }, 100);
            } else {
                poly.setAttribute("points", dataPointsStr.trim());
            }

            updateAverageScore(animateFromZero);
            renderBarChart();
        }

        function renderBarChart() {
            const container = document.getElementById("barChartContainer");
            container.innerHTML = "";

            skillsData.forEach((skill) => {
                const row = document.createElement("div");
                row.className = "bar-row";
                row.innerHTML = `
                    <div class="bar-name">${skill.name}</div>
                    <div class="bar-track">
                        <div class="bar-fill" id="bar-${skill.name.replace(/\s+/g, '')}" style="width: 0%;"></div>
                    </div>
                    <div class="bar-val">${skill.val}%</div>
                `;
                container.appendChild(row);
                
                // Animate bar fill
                setTimeout(() => {
                    document.getElementById(`bar-${skill.name.replace(/\s+/g, '')}`).style.width = `${skill.val}%`;
                }, 50);
            });
        }

        // Animate Average Score Counter
        function updateAverageScore(animate = false) {
            const total = skillsData.reduce((acc, curr) => acc + curr.val, 0);
            const targetAvg = Math.round(total / skillsData.length);
            const scoreEl = document.getElementById("averageScore");

            if (animate) {
                let current = 0;
                const interval = setInterval(() => {
                    if (current >= targetAvg) {
                        clearInterval(interval);
                        scoreEl.innerText = `${targetAvg}%`;
                    } else {
                        current += 2;
                        scoreEl.innerText = `${current}%`;
                    }
                }, 30);
            } else {
                scoreEl.innerText = `${targetAvg}%`;
            }
        }

        // Sliders & Controls
        function syncSliderWithValue() {
            const idx = document.getElementById("skillSelect").value;
            const currentVal = skillsData[idx].val;
            document.getElementById("skillSlider").value = currentVal;
            document.getElementById("sliderValDisplay").innerText = `${currentVal}%`;
        }

        function updateSkillFromSlider(newVal) {
            const idx = document.getElementById("skillSelect").value;
            skillsData[idx].val = parseInt(newVal);
            document.getElementById("sliderValDisplay").innerText = `${newVal}%`;
            updateRadar(false);
        }

        // View Toggler
        function toggleChartView() {
            isRadarView = !isRadarView;
            const svg = document.getElementById("radarSvg");
            const bar = document.getElementById("barChartContainer");
            const btn = document.getElementById("toggleBtn");

            if (isRadarView) {
                svg.style.display = "block";
                bar.style.display = "none";
                btn.innerText = "Switch to Bar Graph";
            } else {
                svg.style.display = "none";
                bar.style.display = "flex";
                btn.innerText = "Switch to Radar";
                renderBarChart(); // Re-trigger bar animation
            }
        }

        // Tooltip Engine
        const tooltip = document.getElementById("tooltip");
        function showTooltip(evt, text) {
            tooltip.innerText = text;
            tooltip.style.opacity = "1";
            tooltip.style.transform = "translateY(0)";
            tooltip.style.left = `${evt.pageX + 15}px`;
            tooltip.style.top = `${evt.pageY - 30}px`;
        }

        function hideTooltip() {
            tooltip.style.opacity = "0";
            tooltip.style.transform = "translateY(10px)";
        }

        // Boot sequence on load
        window.onload = () => {
            drawGridLayers();
            updateRadar(true); // true = run entrance animation
            syncSliderWithValue();
        };
    </script>
</body>
</html>
