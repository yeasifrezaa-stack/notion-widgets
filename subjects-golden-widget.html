<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subjects — Golden Glass Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sail&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#1a1815;
    --glass-fill: rgba(10,9,7,0.55);
    --glass-fill-strong: rgba(10,9,7,0.72);
    --border-soft: rgba(212,161,92,0.18);
    --border-strong: rgba(243,200,119,0.5);
    --gold-dim:#7a5f37;
    --gold:#d4a15c;
    --gold-bright:#f3c877;
    --gold-glow: rgba(243,200,119,0.45);
    --text:#f1e8d8;
    --text-muted:#a89b86;
    --text-faint:#6d6455;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Sail', cursive;
    --ease: cubic-bezier(.22,1,.36,1);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 760px 440px at 15% -8%, rgba(243,200,119,0.08), transparent 60%),
      radial-gradient(ellipse 620px 520px at 105% 112%, rgba(243,200,119,0.06), transparent 55%),
      var(--bg-page);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 18px;
    font-family: var(--font-display);
    color: var(--text);
  }

  .board{
    position:relative;
    width:100%;
    max-width:920px;
    border-radius: var(--radius-lg);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.005)),
      var(--glass-fill);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border:1px solid var(--border-soft);
    box-shadow:
      0 30px 70px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.05);
    padding:28px 26px 22px;
    overflow:hidden;
  }

  .ambient-glow{
    position:absolute;
    width:420px; height:420px;
    top:-180px; right:-160px;
    background: radial-gradient(circle, var(--gold-glow), transparent 70%);
    filter: blur(10px);
    opacity:.55;
    animation: breathe 9s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{ opacity:.35; transform:scale(1); }
    50%{ opacity:.6; transform:scale(1.08); }
  }

  .board-header{
    position:relative;
    z-index:1;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }

  .title-wrap h1{
    margin:0;
    font-size:2rem;
    font-weight:400;
    letter-spacing:.02em;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter: drop-shadow(0 0 14px rgba(243,200,119,0.25));
  }
  .title-wrap .subtitle{
    margin:4px 0 0;
    font-size:.95rem;
    color: var(--text-muted);
    letter-spacing:.01em;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .icon-btn{
    width:32px; height:32px;
    border-radius:10px;
    border:1px solid var(--border-soft);
    background: rgba(255,255,255,0.02);
    color: var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    transition: all .3s var(--ease);
  }
  .icon-btn:hover{
    color: var(--gold-bright);
    border-color: var(--border-strong);
    box-shadow: 0 0 12px rgba(243,200,119,0.2);
  }
  .new-pill{
    font-family: var(--font-display);
    font-size:.95rem;
    padding:6px 16px;
    border-radius:999px;
    border:1px solid var(--border-strong);
    background: linear-gradient(180deg, rgba(243,200,119,0.16), rgba(212,161,92,0.06));
    color: var(--gold-bright);
    letter-spacing:.02em;
  }

  .table{ position:relative; z-index:1; }

  .row-cols{
    display:grid;
    grid-template-columns: 1.7fr 1fr 0.95fr 1.6fr 0.85fr 0.6fr;
    gap:12px;
    align-items:center;
  }

  .row-head{
    padding: 0 18px 10px;
    font-size:.8rem;
    letter-spacing:.03em;
    color: var(--text-faint);
  }
  .row-head .cell{ text-align:left; }
  .row-head .cell-tick{ text-align:center; }

  .row{
    padding:14px 18px;
    margin-bottom:10px;
    border-radius: var(--radius-md);
    border:1px solid var(--border-soft);
    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
  }
  .row:hover{
    transform: translateY(-3px);
    border-color: var(--border-strong);
    box-shadow: 0 14px 32px rgba(0,0,0,0.45), 0 0 22px rgba(243,200,119,0.12);
  }
  .row.flash{ animation: rowFlash .6s var(--ease); }
  @keyframes rowFlash{
    0%{ box-shadow:0 6px 18px rgba(0,0,0,0.35); border-color:var(--border-soft); }
    35%{ box-shadow:0 0 26px 2px var(--gold-glow); border-color:var(--border-strong); }
    100%{ box-shadow:0 6px 18px rgba(0,0,0,0.35); border-color:var(--border-soft); }
  }

  .subject-badge{
    width:28px; height:28px;
    border-radius:9px;
    display:inline-flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, var(--gold-bright), var(--gold-dim));
    color:#241b0f;
    font-size:.9rem;
    margin-right:10px;
    flex-shrink:0;
  }
  .cell-subject{ display:flex; align-items:center; }
  .subject-name{ font-size:1.08rem; letter-spacing:.01em; }

  /* Confidence pill */
  .conf-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:5px 11px;
    border-radius:999px;
    border:1px solid var(--border-soft);
    font-size:.88rem;
    transition: all .3s var(--ease);
  }
  .dots{ display:inline-flex; gap:3px; }
  .dots i{
    width:5px; height:5px; border-radius:50%;
    background: rgba(255,255,255,0.08);
    display:inline-block;
  }

  .conf-pill.tier-high{
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    border-color: var(--border-strong);
    color:#241b0f;
    box-shadow: 0 0 14px var(--gold-glow);
  }
  .conf-pill.tier-high .dots i{ background:#2a2013; }

  .conf-pill.tier-medium{
    background: rgba(212,161,92,0.1);
    border-color: rgba(212,161,92,0.4);
    color: var(--gold-bright);
  }
  .conf-pill.tier-medium .dots i:nth-child(1),
  .conf-pill.tier-medium .dots i:nth-child(2){ background: var(--gold-bright); }

  .conf-pill.tier-low{
    background: rgba(122,95,55,0.08);
    border-color: rgba(122,95,55,0.35);
    color: var(--text-muted);
  }
  .conf-pill.tier-low .dots i:nth-child(1){ background: var(--gold-dim); }

  /* Grade select */
  .select-wrap{ position:relative; display:inline-flex; align-items:center; }
  .grade-select{
    appearance:none;
    -webkit-appearance:none;
    font-family: var(--font-display);
    font-size:1rem;
    color: var(--gold-bright);
    background: rgba(255,255,255,0.02);
    border:1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding:6px 28px 6px 12px;
    cursor:pointer;
    transition: all .3s var(--ease);
  }
  .grade-select:hover{ border-color: var(--border-strong); }
  .grade-select:focus-visible{
    outline:none;
    border-color: var(--border-strong);
    box-shadow: 0 0 0 3px rgba(243,200,119,0.18);
  }
  .grade-select option{ background:#1c1a16; color:var(--text); font-family: sans-serif; }
  .select-wrap .chev{
    position:absolute; right:9px; pointer-events:none;
    color: var(--text-faint);
  }

  /* Completion bar */
  .cell-completion{ display:flex; align-items:center; gap:10px; }
  .bar-track{
    flex:1;
    height:6px;
    border-radius:999px;
    background: rgba(255,255,255,0.06);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:999px;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright));
    box-shadow: 0 0 10px var(--gold-glow);
    transition: width .6s var(--ease);
  }
  .bar-num{
    font-size:.9rem;
    color: var(--text-muted);
    min-width:34px;
    text-align:right;
  }

  /* Target pill */
  .target-pill{
    display:inline-block;
    font-size:.9rem;
    padding:5px 11px;
    border-radius:999px;
    border:1px solid var(--border-soft);
    color: var(--gold-bright);
    background: rgba(243,200,119,0.04);
  }

  /* Tick box */
  .cell-tick{ display:flex; justify-content:center; }
  .tick-box{
    width:30px; height:30px;
    border-radius:9px;
    border:1.5px solid rgba(212,161,92,0.25);
    background: rgba(255,255,255,0.02);
    display:flex; align-items:center; justify-content:center;
    transition: all .4s var(--ease);
  }
  .tick-box .tick-icon{
    width:16px; height:16px;
    color:#1c150c;
    opacity:0;
    transform: scale(.4) rotate(-12deg);
    transition: all .35s var(--ease);
  }
  .tick-box.met{
    border-color: var(--gold-bright);
    background: linear-gradient(145deg, var(--gold-bright), var(--gold));
    box-shadow: 0 0 16px 1px var(--gold-glow);
  }
  .tick-box.met .tick-icon{ opacity:1; transform: scale(1) rotate(0deg); }
  .tick-box.pulse{ animation: tickPulse .7s var(--ease); }
  @keyframes tickPulse{
    0%{ box-shadow:0 0 0 0 var(--gold-glow); }
    45%{ box-shadow:0 0 0 9px rgba(243,200,119,0); }
    100%{ box-shadow:0 0 16px 1px var(--gold-glow); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:680px){
    .board{ padding:22px 16px 18px; }
    .row-head{ display:none; }
    .row-cols{ grid-template-columns:1fr; gap:10px; }
    .row .cell{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .row .cell[data-label]::before{
      content:attr(data-label);
      font-size:.72rem;
      letter-spacing:.02em;
      color: var(--text-faint);
      flex:0 0 auto;
    }
    .cell-subject{ border-bottom:1px dashed var(--border-soft); padding-bottom:8px; margin-bottom:2px; }
    .cell-subject::before{ display:none; }
    .cell-completion .bar-track{ max-width:120px; }
  }
</style>
</head>

<script>
  var GRADE_SCALE = ['F','D','C-','C','C+','B-','B','B+','A-','A','A*']; // low -> high
  var DISPLAY_ORDER = GRADE_SCALE.slice().reverse(); // high -> low, for the dropdown

  function idx(g){ return GRADE_SCALE.indexOf(g); }
  function tierOf(i){ return i >= 8 ? 'high' : (i >= 5 ? 'medium' : 'low'); }
  function tierLabel(t){ return t === 'high' ? 'High' : (t === 'medium' ? 'Medium' : 'Low'); }
  function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

  function initRow(row){
    var select = row.querySelector('.grade-select');
    var current = select.getAttribute('data-current');

    DISPLAY_ORDER.forEach(function(g){
      var opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      if (g === current) opt.selected = true;
      select.appendChild(opt);
    });

    var target = row.getAttribute('data-target');
    var offset = parseFloat(row.getAttribute('data-offset'));

    function paint(initial){
      var i = idx(select.value);
      var tier = tierOf(i);

      var pill = row.querySelector('.conf-pill');
      pill.className = 'conf-pill tier-' + tier;
      pill.querySelector('.conf-label').textContent = tierLabel(tier);

      var completion = clamp(Math.round((i / 10) * 100 + offset), 0, 100);
      row.querySelector('.bar-fill').style.width = completion + '%';
      row.querySelector('.bar-num').textContent = completion + '%';

      var matched = i >= idx(target);
      var tick = row.querySelector('.tick-box');
      var wasMatched = tick.classList.contains('met');
      tick.classList.toggle('met', matched);
      tick.setAttribute('aria-label', matched ? 'Target grade achieved' : 'Target grade not yet achieved');

      if (!initial){
        row.classList.remove('flash');
        void row.offsetWidth;
        row.classList.add('flash');

        if (matched && !wasMatched){
          tick.classList.remove('pulse');
          void tick.offsetWidth;
          tick.classList.add('pulse');
        }
      }
    }

    select.addEventListener('change', function(){ paint(false); });
    paint(true);
  }

  document.querySelectorAll('.row[data-target]').forEach(initRow);
</script>
</body>
</html>
