<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Glow Command Widget - Dynamic Sub-Metrics</title>
  <style>
    :root {
      --bg-color: #202020;          /* Lead */
      --card-bg: #313131;           /* Off Black */
      --card-border: #494949;       /* Pig Iron */
      --text-main: #B9B9B9;         /* Covered in Platinum */
      --text-muted: #707070;        /* Dugong */
      --accent: #909090;            /* Tin */
      --accent-glow: rgba(185, 185, 185, 0.35);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-stack); }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* --- INTENSE GLOWING AMBIENT ANIMATION --- */
    .ambient-glow {
      position: absolute;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(185,185,185,0.25) 0%, rgba(112,112,112,0.12) 65%, transparent 100%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulseGlow 5s ease-in-out infinite alternate, rotateGlow 20s linear infinite;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.35); opacity: 1; }
    }

    @keyframes rotateGlow {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(360deg); }
    }

    /* --- WIDGET CONTAINER --- */
    .carousel-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 980px;
      height: 630px;
      background: var(--card-bg);
      border-radius: 22px;
      border: 1px solid var(--card-border);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(185, 185, 185, 0.15), inset 0 1px 0 rgba(185, 185, 185, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: containerFloat 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes containerFloat {
      from { opacity: 0; transform: translateY(25px) scale(0.97); }
      to { opacity: 1; transform: translateY(0); scale(1); }
    }

    /* --- HEADER FILTER BAR --- */
    .widget-header {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.25);
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-tab {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .filter-tab.active, .filter-tab:hover {
      background: rgba(185, 185, 185, 0.18);
      color: var(--text-main);
      border-color: var(--text-main);
      box-shadow: 0 0 15px rgba(185, 185, 185, 0.35);
      transform: translateY(-1px);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* --- SLIDES STAGE --- */
    .stage-viewport {
      position: relative;
      width: 100%;
      flex-grow: 1;
      overflow: hidden;
    }

    .slides-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slide {
      min-width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1.1fr 1.2fr;
    }

    /* Image Side with Zoom Animation */
    .slide-image-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-right: 1px solid var(--card-border);
    }

    .slide-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1);
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      filter: brightness(0.85) contrast(1.05);
    }

    .slide.active-slide .slide-image {
      transform: scale(1.06);
    }

    .image-overlay-badge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(32, 32, 32, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-main);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    /* Content Side */
    .slide-content {
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: contentFade 0.5s ease forwards;
    }

    @keyframes contentFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.73rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .project-title {
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 4px;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .importance-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      width: max-content;
      color: var(--text-main);
    }

    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot.high { background-color: #B9B9B9; box-shadow: 0 0 10px #B9B9B9; }
    .dot.medium { background-color: #909090; box-shadow: 0 0 8px #909090; }
    .dot.low { background-color: #707070; }

    .project-description {
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Sub-Metrics Breakdown Grid */
    .submetrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .submetric-box {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .submetric-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
    .submetric-value { font-size: 0.78rem; font-weight: 700; color: var(--text-main); }

    /* Productivity Dynamic Bar Layer */
    .productivity-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }

    .prod-header { display: flex; justify-content: space-between; align-items: center; }
    .prod-label { font-size: 0.72rem; color: var(--text-muted); }
    .prod-value { font-size: 0.82rem; font-weight: 700; color: var(--text-main); }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--text-main);
      border-radius: 3px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 10px var(--text-main);
    }

    /* Meta Details Grid */
    .meta-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
    }

    .meta-label { color: var(--text-muted); width: 65px; flex-shrink: 0; }
    .skills-container { display: flex; flex-wrap: wrap; gap: 5px; }

    .skill-pill, .category-pill {
      border: 1px solid var(--card-border);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.68rem;
      background: rgba(0, 0, 0, 0.25);
      color: var(--text-main);
    }
    .category-pill { background: rgba(185, 185, 185, 0.15); border-color: var(--accent); color: var(--text-main); }

    /* --- SPECIAL AI PANEL (FULL INTEGRATED ASSISTANT) --- */
    .ai-panel-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 24px;
      background: var(--card-bg);
      animation: fadeInAI 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInAI {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .ai-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .ai-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--text-main), var(--text-muted));
      display: flex; justify-content: center; align-items: center;
      font-weight: bold; color: var(--bg-color); font-size: 0.9rem;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .ai-chat-box {
      flex-grow: 1;
      background: rgba(32, 32, 32, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 270px;
      margin-bottom: 12px;
      scroll-behavior: smooth;
    }

    .ai-message {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.6;
      max-width: 88%;
      word-wrap: break-word;
    }

    .ai-message.bot {
      background: rgba(73, 73, 73, 0.5);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      align-self: flex-start;
    }

    .ai-message.user {
      background: rgba(185, 185, 185, 0.2);
      border: 1px solid var(--text-main);
      color: var(--text-main);
      align-self: flex-end;
    }

    .ai-input-row {
      display: flex;
      gap: 8px;
    }

    .ai-input-row input {
      flex-grow: 1;
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .ai-input-row input:focus { outline: none; border-color: var(--text-main); }

    .ai-send-btn {
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* --- FOOTER CONTROLS --- */
    .widget-footer {
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.25);
    }

    .carousel-indicators { display: flex; gap: 6px; }

    .indicator-bar {
      width: 24px;
      height: 3px;
      background: var(--card-border);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .indicator-bar.active {
      width: 48px;
      background: var(--text-main);
      box-shadow: 0 0 15px var(--text-main);
    }

    .nav-buttons { display: flex; gap: 8px; }

    .icon-btn {
      background: rgba(185, 185, 185, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; transition: all 0.25s ease;
    }

    .icon-btn:hover {
      background: rgba(185, 185, 185, 0.2);
      border-color: var(--text-main);
      transform: translateY(-2px);
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(32, 32, 32, 0.9);
      backdrop-filter: blur(12px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      width: 90%; max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.95);
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }

    .form-group label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group textarea, .form-group select {
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none;
      border-color: var(--text-main);
    }

    @media (max-width: 768px) {
      .slide { grid-template-columns: 1fr; grid-template-rows: 180px 1fr; }
      .carousel-container { height: auto; min-height: 700px; }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="carousel-container">
    <!-- Header with Filter Tabs & Customization Controls -->
    <header class="widget-header">
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" onclick="filterProjects('All', this)">All 🌐</button>
        <button class="filter-tab" onclick="filterProjects('Leadership', this)">Leadership</button>
        <button class="filter-tab" onclick="filterProjects('Research', this)">Research</button>
        <button class="filter-tab" onclick="filterProjects('Programming', this)">Programming</button>
        <button class="filter-tab" onclick="jumpToAI(this)" style="border-color: var(--text-main); color: var(--text-main);">✨ AI Guide</button>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openEditCurrentModal()" title="Edit Active Item & Sub-Metrics">✏️</button>
        <button class="icon-btn" onclick="openAddNewModal()" title="Add New Item">➕</button>
      </div>
    </header>

    <!-- Slides Stage -->
    <div class="stage-viewport">
      <div class="slides-wrapper" id="slider"></div>
    </div>

    <!-- Footer Controls & Indicators -->
    <footer class="widget-footer">
      <div class="carousel-indicators" id="indicators"></div>
      <div class="nav-buttons">
        <button class="icon-btn" onclick="moveSlide(-1)" title="Previous">❮</button>
        <button class="icon-btn" onclick="moveSlide(1)" title="Next">❯</button>
      </div>
    </footer>
  </div>

  <!-- UNIVERSAL CUSTOMIZE / EDIT / ADD MODAL -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 8px;">
        <h2 id="modalTitleText" style="font-size: 1.1rem; color: var(--text-main);">Customize Item</h2>
        <button class="icon-btn" onclick="closeCustomModal()">✕</button>
      </div>
      <div class="form-group">
        <label>Project Title</label>
        <input type="text" id="editTitle" placeholder="e.g. Quantum Computing Interface">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="form-group">
          <label>Category</label>
          <select id="editCategory">
            <option value="Leadership">Leadership</option>
            <option value="Research">Research</option>
            <option value="Programming">Programming</option>
          </select>
        </div>
        <div class="form-group">
          <label>Importance</label>
          <select id="editImportance">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="form-group">
          <label>Your Role</label>
          <input type="text" id="editRole" placeholder="e.g. Lead Developer">
        </div>
        <div class="form-group">
          <label>Completion Date</label>
          <input type="text" id="editDate" placeholder="e.g. August 2026">
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="editDesc" rows="2" placeholder="Enter project breakdown..."></textarea>
      </div>

      <!-- SUB-METRICS SECTION FOR ACCURATE PERCENTAGE CALCULATIONS -->
      <div style="border-top: 1px solid var(--card-border); padding-top: 8px; margin-top: 4px;">
        <p style="font-size: 0.75rem; color: var(--text-main); font-weight: 700; margin-bottom: 6px;">📊 Sub-Metrics (Drives Dynamic Percentage)</p>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div class="form-group">
            <label>Efficiency Rating</label>
            <select id="subEfficiency">
              <option value="High">⚡ High Efficiency (+35%)</option>
              <option value="Medium">⚖️ Medium Efficiency (+25%)</option>
              <option value="Low">🐢 Low Efficiency (+10%)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Hours Spent (Max 25 pts)</label>
            <input type="number" id="subHours" placeholder="e.g. 15" min="0" max="25">
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;">
          <div class="form-group">
            <label>Milestone Achieved?</label>
            <select id="subMilestone">
              <option value="yes">✅ Yes (+20 pts)</option>
              <option value="no">❌ No (0 pts)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quality Score (1 - 10)</label>
            <input type="number" id="subQuality" placeholder="e.g. 9" min="1" max="10">
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-top: 4px;">
        <label>Cover Image URL</label>
        <input type="text" id="editImage" placeholder="https://images.unsplash.com/...">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px;">
        <button class="filter-tab" onclick="closeCustomModal()">Cancel</button>
        <button class="ai-send-btn" id="modalSaveBtn" onclick="saveCustomChanges()" style="padding: 9px 16px;">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const baseProjects = [
      {
        title: "Student Council Fundraiser", category: "Leadership", date: "August 1, 2025",
        importance: "High", role: "Events Coordinator",
        description: "Organized fundraiser and event coordination for the annual gala, managing logistics and leading volunteer squads.",
        subEfficiency: "High", subHours: 16, subMilestone: "yes", subQuality: 9,
        skills: "Leadership, Event Planning, Budgeting",
        image: "https://images.unsplash.com/photo-1540317580384-e5d43616b9aa?q=80&w=800&auto=format&fit=crop"
      },
      {
        title: "Physics Research Paper", category: "Research", date: "June 15, 2026",
        importance: "Medium", role: "Author",
        description: "Independent study comparing theoretical models with practical datasets and empirical validations.",
        subEfficiency: "Medium", subHours: 12, subMilestone: "yes", subQuality: 8,
        skills: "Research, Data Analysis",
        image: "https://images.unsplash.com/photo-1636466497217-26a8cbeaf0aa?q=80&w=800&auto=format&fit=crop"
      },
      {
        title: "National Coding Hackathon", category: "Programming", date: "August 1, 2026",
        importance: "High", role: "Solo Developer",
        description: "A fast utility budgeting tool built during a 48-hour competitive sprint emphasizing clean logic and responsive UI.",
        subEfficiency: "High", subHours: 20, subMilestone: "yes", subQuality: 10,
        skills: "Python, UI Design",
        image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=800&auto=format&fit=crop"
      }
    ];

    let portfolioData = [...baseProjects];
    let activeFilter = 'All';
    let currentIndex = 0;
    let isAiPanelActive = false;
    let modalMode = 'edit';

    // CALCULATE DYNAMIC PERCENTAGE BASED ON SUB-METRICS
    function calculateDynamicPercentage(item) {
      let score = 0;
      // Efficiency weight (max 35%)
      if (item.subEfficiency === 'High') score += 35;
      else if (item.subEfficiency === 'Medium') score += 25;
      else score += 10;

      // Hours spent weight (capped at 25%)
      let hrs = parseFloat(item.subHours) || 0;
      score += Math.min(25, hrs * 1.25);

      // Milestone weight (20%)
      if (item.subMilestone === 'yes') score += 20;

      // Quality score weight (max 20%)
      let q = parseFloat(item.subQuality) || 5;
      score += (q / 10) * 20;

      return Math.min(100, Math.max(10, Math.round(score)));
    }

    function getFilteredData() {
      if (isAiPanelActive) return [{ isAI: true }];
      if (activeFilter === 'All') return portfolioData;
      return portfolioData.filter(p => p.category.toLowerCase() === activeFilter.toLowerCase());
    }

    function renderWidget() {
      const slider = document.getElementById('slider');
      const indicators = document.getElementById('indicators');
      slider.innerHTML = '';
      indicators.innerHTML = '';

      const data = getFilteredData();
      if (currentIndex >= data.length) currentIndex = 0;

      data.forEach((item, idx) => {
        const bar = document.createElement('div');
        bar.className = `indicator-bar ${idx === currentIndex ? 'active' : ''}`;
        bar.onclick = () => { currentIndex = idx; updateSlidePosition(); };
        indicators.appendChild(bar);

        if (item.isAI) {
          const aiHTML = `
            <div class="slide ${idx === currentIndex ? 'active-slide' : ''}" style="grid-template-columns: 1fr;">
              <div class="ai-panel-container">
                <div class="ai-header-info">
                  <div class="ai-avatar">AI</div>
                  <div>
                    <h4 style="font-size: 0.95rem; color: var(--text-main);">✨ Dynamic Sub-Metric Assistant</h4>
                    <p style="font-size: 0.75rem; color: var(--text-muted);">Ask me anything about your completion percentages, sub-metrics, or code logic!</p>
                  </div>
                </div>
                <div class="ai-chat-box" id="aiChatBox">
                  <div class="ai-message bot">Hello! 🤖 I am your custom assistant. Every section now features precise sub-metrics (Efficiency, Time, Milestone, Quality) that dynamically drive your completion percentage up and down! How can I help you today?</div>
                </div>
                <div class="ai-input-row">
                  <input type="text" id="aiUserInput" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') sendAiMessage()">
                  <button class="ai-send-btn" onclick="sendAiMessage()">Send</button>
                </div>
              </div>
            </div>
          `;
          slider.insertAdjacentHTML('beforeend', aiHTML);
        } else {
          const skillsHTML = item.skills.split(',').map(s => `<span class="skill-pill">${s.trim()}</span>`).join('');
          const impClass = item.importance.toLowerCase();
          const computedPercent = calculateDynamicPercentage(item);

          const slideHTML = `
            <div class="slide ${idx === currentIndex ? 'active-slide' : ''}">
              <div class="slide-image-container">
                <img src="${item.image}" class="slide-image" alt="Project Cover">
                <div class="image-overlay-badge">📅 ${item.date}</div>
              </div>
              <div class="slide-content">
                <div>
                  <div class="meta-top">
                    <span>Command Spotlight 🌟</span>
                    <span class="category-pill">${item.category}</span>
                  </div>
                  <h2 class="project-title">${item.title}</h2>
                  <div class="importance-indicator">
                    <span class="dot ${impClass}"></span> ${item.importance} Priority
                  </div>
                  <p class="project-description">${item.description}</p>
                  
                  <!-- SUB-METRICS BADGES DISPLAY -->
                  <div class="submetrics-grid">
                    <div class="submetric-box">
                      <span class="submetric-label">⚡ Efficiency</span>
                      <span class="submetric-value">${item.subEfficiency || 'High'}</span>
                    </div>
                    <div class="submetric-box">
                      <span class="submetric-label">⏱️ Time Spent</span>
                      <span class="submetric-value">${item.subHours || 0} Hours</span>
                    </div>
                    <div class="submetric-box">
                      <span class="submetric-label">🎯 Milestone</span>
                      <span class="submetric-value">${item.subMilestone === 'yes' ? 'Achieved ✅' : 'Pending ❌'}</span>
                    </div>
                    <div class="submetric-box">
                      <span class="submetric-label">⭐ Quality Score</span>
                      <span class="submetric-value">${item.subQuality || 5}/10</span>
                    </div>
                  </div>

                  <!-- DYNAMIC PERCENTAGE BAR -->
                  <div class="productivity-box">
                    <div class="prod-header">
                      <span class="prod-label">Dynamic Accuracy & Completion</span>
                      <span class="prod-value">${computedPercent}%</span>
                    </div>
                    <div class="progress-track">
                      <div class="progress-fill" style="width: ${computedPercent}%;"></div>
                    </div>
                  </div>
                </div>
                <div class="meta-details">
                  <div class="meta-row">
                    <span class="meta-label">Role</span>
                    <strong style="color: var(--text-main);">${item.role}</strong>
                  </div>
                  <div class="meta-row">
                    <span class="meta-label">Skills</span>
                    <div class="skills-container">${skillsHTML}</div>
                  </div>
                </div>
              </div>
            </div>
          `;
          slider.insertAdjacentHTML('beforeend', slideHTML);
        }
      });

      updateSlidePosition();
    }

    function updateSlidePosition() {
      const slider = document.getElementById('slider');
      slider.style.transform = `translateX(-${currentIndex * 100}%)`;
      
      document.querySelectorAll('.indicator-bar').forEach((bar, idx) => {
        bar.classList.toggle('active', idx === currentIndex);
      });
      document.querySelectorAll('.slide').forEach((slide, idx) => {
        slide.classList.toggle('active-slide', idx === currentIndex);
      });
    }

    function moveSlide(dir) {
      const data = getFilteredData();
      if (data.length === 0) return;
      currentIndex = (currentIndex + dir + data.length) % data.length;
      updateSlidePosition();
    }

    function filterProjects(cat, btn) {
      isAiPanelActive = false;
      activeFilter = cat;
      currentIndex = 0;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderWidget();
    }

    function jumpToAI(btn) {
      isAiPanelActive = true;
      currentIndex = 0;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderWidget();
    }

    // Modal Controls
    function openEditCurrentModal() {
      if (isAiPanelActive) {
        alert("⚠️ Switch to a project slide to edit its sub-metrics!");
        return;
      }
      const data = getFilteredData();
      if (data.length === 0) return;
      const currentItem = data[currentIndex];

      modalMode = 'edit';
      document.getElementById('modalTitleText').innerText = "✏️ Edit Item & Sub-Metrics";
      document.getElementById('modalSaveBtn').innerText = "Update & Recalculate";

      document.getElementById('editTitle').value = currentItem.title;
      document.getElementById('editCategory').value = currentItem.category;
      document.getElementById('editImportance').value = currentItem.importance;
      document.getElementById('editRole').value = currentItem.role;
      document.getElementById('editDate').value = currentItem.date;
      document.getElementById('editDesc').value = currentItem.description;
      document.getElementById('subEfficiency').value = currentItem.subEfficiency || 'High';
      document.getElementById('subHours').value = currentItem.subHours || 10;
      document.getElementById('subMilestone').value = currentItem.subMilestone || 'yes';
      document.getElementById('subQuality').value = currentItem.subQuality || 8;
      document.getElementById('editImage').value = currentItem.image;

      document.getElementById('customModal').classList.add('active');
    }

    function openAddNewModal() {
      modalMode = 'add';
      document.getElementById('modalTitleText').innerText = "➕ Add New Item with Sub-Metrics";
      document.getElementById('modalSaveBtn').innerText = "Create Item";

      document.getElementById('editTitle').value = '';
      document.getElementById('editCategory').value = 'Leadership';
      document.getElementById('editImportance').value = 'High';
      document.getElementById('editRole').value = 'Lead Creator';
      document.getElementById('editDate').value = 'September 2026';
      document.getElementById('editDesc').value = '';
      document.getElementById('subEfficiency').value = 'High';
      document.getElementById('subHours').value = 15;
      document.getElementById('subMilestone').value = 'yes';
      document.getElementById('subQuality').value = 9;
      document.getElementById('editImage').value = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop';

      document.getElementById('customModal').classList.add('active');
    }

    function closeCustomModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    function saveCustomChanges() {
      const title = document.getElementById('editTitle').value.trim();
      const category = document.getElementById('editCategory').value;
      const importance = document.getElementById('editImportance').value;
      const role = document.getElementById('editRole').value.trim();
      const date = document.getElementById('editDate').value.trim();
      const desc = document.getElementById('editDesc').value.trim();
      const subEfficiency = document.getElementById('subEfficiency').value;
      const subHours = parseFloat(document.getElementById('subHours').value) || 0;
      const subMilestone = document.getElementById('subMilestone').value;
      const subQuality = parseFloat(document.getElementById('subQuality').value) || 5;
      const image = document.getElementById('editImage').value.trim();

      if (!title || !desc) {
        alert("⚠️ Please fill in at least the Title and Description fields.");
        return;
      }

      const itemData = {
        title, category, importance, role, date,
        description: desc,
        subEfficiency, subHours, subMilestone, subQuality,
        skills: "Custom, Sub-Metric Sync",
        image: image || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop"
      };

      if (modalMode === 'edit') {
        const filtered = getFilteredData();
        const targetItem = filtered[currentIndex];
        const globalIndex = portfolioData.findIndex(p => p === targetItem);
        if (globalIndex !== -1) {
          portfolioData[globalIndex] = itemData;
        }
      } else {
        portfolioData.unshift(itemData);
        activeFilter = 'All';
        currentIndex = 0;
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        document.querySelector('.filter-tab').classList.add('active');
      }

      closeCustomModal();
      renderWidget();
    }

    // AI Chat Assistant
    function sendAiMessage() {
      const input = document.getElementById('aiUserInput');
      const chatBox = document.getElementById('aiChatBox');
      const text = input.value.trim();
      if (!text) return;

      chatBox.insertAdjacentHTML('beforeend', `<div class="ai-message user">${escapeHtml(text)}</div>`);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        let reply = "✨ Sub-metrics updated successfully! Your completion percentages automatically adapt up and down based on your efficiency, hours, milestones, and quality ratings.";
        const q = text.toLowerCase();

        if (q.includes('percentage') || q.includes('score') || q.includes('calculate')) {
          reply = "📊 The percentage is dynamically calculated from 4 areas: Efficiency (up to 35%), Time spent in hours (up to 25%), Milestone completion (20%), and Quality score (up to 20%). Change any of these in the edit menu to watch the percentage fluctuate!";
        } else if (q.includes('edit') || q.includes('change')) {
          reply = "✏️ Click the pencil icon (✏️) at the top right of any active card to modify its sub-metrics and instantly recalculate its accuracy percentage!";
        }

        chatBox.insertAdjacentHTML('beforeend', `<div class="ai-message bot">${reply}</div>`);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 500);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    renderWidget();
  </script>
</body>
</html>
