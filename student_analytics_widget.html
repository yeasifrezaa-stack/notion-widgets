<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI StudyFlow Hub - Custom Academic Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0b0e;
      --bg-card: #12141c;
      --bg-card-hover: #181b26;
      --gold-primary: #f3c669;
      --gold-light: #ffe8b3;
      --gold-dark: #b8860b;
      --gold-accent: #d4af37;
      --gold-gradient: linear-gradient(135deg, #ffe8b3 0%, #f3c669 45%, #9a7b38 100%);
      --text-main: #f0f2f5;
      --text-muted: #8a8f9d;
      --border-gold: rgba(243, 198, 105, 0.22);
      --glow-gold: rgba(243, 198, 105, 0.12);
      --glow-gold-strong: rgba(243, 198, 105, 0.28);
      --danger: #ff5555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .widget-container {
      width: 100%;
      max-width: 500px;
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--glow-gold);
      position: relative;
      overflow: hidden;
    }

    .widget-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 20%, var(--glow-gold), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .content-relative {
      position: relative;
      z-index: 1;
    }

    /* Header Styling */
    .widget-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .widget-title {
      font-size: 26px;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .widget-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(243, 198, 105, 0.15);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .tab-btn.active {
      color: #000;
      background: var(--gold-gradient);
      font-weight: 700;
      box-shadow: 0 2px 10px var(--glow-gold-strong);
    }

    /* Gauge Arc */
    .gauge-wrapper {
      position: relative;
      width: 260px;
      height: 140px;
      margin: 0 auto 6px auto;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .gauge-bg {
      fill: none;
      stroke: #1f2230;
      stroke-width: 18;
      stroke-linecap: round;
    }

    .gauge-fill {
      fill: none;
      stroke: url(#goldGradient);
      stroke-width: 18;
      stroke-linecap: round;
      stroke-dasharray: 314;
      stroke-dashoffset: 314;
      transition: stroke-dashoffset 1s cubic-bezier(0.25, 1, 0.5, 1);
      filter: drop-shadow(0px 0px 8px rgba(243, 198, 105, 0.4));
    }

    .gauge-center-text {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: 100%;
    }

    .percentage-number {
      font-size: 44px;
      font-weight: 800;
      color: var(--gold-light);
      line-height: 1;
      letter-spacing: -1px;
      text-shadow: 0 0 16px var(--glow-gold-strong);
    }

    .status-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--gold-primary);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .gauge-ticks {
      display: flex;
      justify-content: space-between;
      width: 250px;
      margin: 0 auto 10px auto;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(243, 198, 105, 0.15);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .stat-card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .stat-list {
      list-style: none;
      font-size: 12px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .stat-item:last-child {
      margin-bottom: 0;
    }

    .stat-item span:first-child {
      color: #c0c4d0;
    }

    .stat-item span:last-child {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--gold-light);
    }

    /* Custom Module Control Area */
    .modules-section {
      border-top: 1px dashed var(--border-gold);
      padding-top: 16px;
    }

    .modules-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modules-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 0.5px;
    }

    .header-btns {
      display: flex;
      gap: 6px;
    }

    .add-btn, .reset-btn {
      background: rgba(243, 198, 105, 0.15);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-btn:hover {
      background: var(--gold-primary);
      color: #000;
    }

    .reset-btn {
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
    }

    .reset-btn:hover {
      background: rgba(255, 85, 85, 0.2);
      color: var(--danger);
      border-color: var(--danger);
    }

    /* Module Creation Form */
    .module-form {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .module-form.active {
      display: flex;
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    .form-input, .form-select {
      background: #181b26;
      border: 1px solid rgba(243, 198, 105, 0.25);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--gold-primary);
    }

    .form-input.flex-1 { flex: 1; }
    .form-input.w-20 { width: 70px; }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 4px;
    }

    .save-btn {
      background: var(--gold-primary);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }

    .cancel-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    /* List Items */
    .module-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }

    .module-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(243, 198, 105, 0.25);
    }

    .module-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      flex: 1;
      overflow: hidden;
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      border: 2px solid var(--gold-dark);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .module-item.completed .custom-checkbox {
      background: var(--gold-primary);
      border-color: var(--gold-primary);
      box-shadow: 0 0 8px var(--glow-gold-strong);
    }

    .module-item.completed .custom-checkbox::after {
      content: '✓';
      font-size: 11px;
      color: #0b0c0e;
      font-weight: 800;
    }

    .module-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .module-item.completed .module-name {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .priority-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      user-select: none;
    }

    .badge-A { background: rgba(243, 198, 105, 0.2); color: var(--gold-light); border: 1px solid var(--gold-primary); }
    .badge-B { background: rgba(100, 149, 237, 0.2); color: #8ab4f8; border: 1px solid #6495ed; }
    .badge-C { background: rgba(150, 150, 150, 0.2); color: #c0c0c0; border: 1px solid #888; }

    .module-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 8px;
    }

    .module-weight {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: var(--danger);
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="content-relative">
      <!-- Header -->
      <div class="widget-header">
        <div class="widget-title">AI StudyFlow Hub ⚡</div>
        <div class="widget-subtitle">Customizable Academic Analytics</div>
      </div>

      <!-- Navigation Tabs -->
      <div class="nav-tabs">
        <button class="tab-btn" onclick="switchTab(this)">Overview</button>
        <button class="tab-btn active" onclick="switchTab(this)">Study Plan</button>
        <button class="tab-btn" onclick="switchTab(this)">Progress Insights</button>
      </div>

      <!-- Semi-Circular Gauge Arc -->
      <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 220 120">
          <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#9a7b38" />
              <stop offset="50%" stop-color="#f3c669" />
              <stop offset="100%" stop-color="#ffe8b3" />
            </linearGradient>
          </defs>
          <path class="gauge-bg" d="M 20 110 A 90 90 0 0 1 200 110" />
          <path id="gaugeFill" class="gauge-fill" d="M 20 110 A 90 90 0 0 1 200 110" />
        </svg>
        <div class="gauge-center-text">
          <div id="percentageText" class="percentage-number">0%</div>
          <div id="statusLabel" class="status-label">Analyzing...</div>
        </div>
      </div>

      <div class="gauge-ticks">
        <span>0%</span>
        <span>100%</span>
      </div>

      <!-- Analytics Cards -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-title">Task Distribution 📋</div>
          <div class="stat-list">
            <div class="stat-item"><span>Priority A</span><span id="prioA">0/0</span></div>
            <div class="stat-item"><span>Priority B</span><span id="prioB">0/0</span></div>
            <div class="stat-item"><span>Priority C</span><span id="prioC">0/0</span></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-title">Upcoming Milestones 🗓️</div>
          <div class="stat-list">
            <div class="stat-item"><span>Ethics Paper</span><span>in 2 days</span></div>
            <div class="stat-item"><span>History Quiz</span><span>in 4 days</span></div>
            <div class="stat-item"><span>Project Pitch</span><span>in 7 days</span></div>
          </div>
        </div>
      </div>

      <!-- Sub-Modules Customization Section -->
      <div class="modules-section">
        <div class="modules-header">
          <div class="modules-title">SUB-MODULE EXECUTION (<span id="moduleCount">0/0</span>)</div>
          <div class="header-btns">
            <button class="reset-btn" onclick="resetToDefaults()" title="Reset sequence to default A, A, A, B, B, B, C, C, C">Reset ↺</button>
            <button class="add-btn" onclick="toggleForm()">+ Add Module</button>
          </div>
        </div>

        <!-- Inline New Module Form -->
        <div id="moduleForm" class="module-form">
          <div class="form-row">
            <input type="text" id="newModuleName" class="form-input flex-1" placeholder="Module Title (e.g., Chemistry Past Papers)">
            <input type="number" id="newModuleWeight" class="form-input w-20" placeholder="Weight %" value="10">
            <select id="newModulePriority" class="form-select">
              <option value="A">Priority A</option>
              <option value="B">Priority B</option>
              <option value="C">Priority C</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="cancel-btn" onclick="toggleForm()">Cancel</button>
            <button class="save-btn" onclick="addNewModule()">Save Module</button>
          </div>
        </div>

        <!-- Modules List Container -->
        <div id="modulesList">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initial Default Sequence: 3 Priority A, 3 Priority B, 3 Priority C
    const defaultModules = [
      { id: 1, name: "Lecture Notes & Summaries", weight: 15, priority: "A", completed: true },
      { id: 2, name: "Weekly Problem Sets", weight: 15, priority: "A", completed: true },
      { id: 3, name: "Core Exam Revision", weight: 15, priority: "A", completed: false },
      { id: 4, name: "Research & Literature Review", weight: 10, priority: "B", completed: true },
      { id: 5, name: "Revision & Mock Practice", weight: 10, priority: "B", completed: false },
      { id: 6, name: "Lab & Practical Reports", weight: 10, priority: "B", completed: false },
      { id: 7, name: "Group Project Slide Deck", weight: 10, priority: "C", completed: false },
      { id: 8, name: "Extra Credit Assignments", weight: 10, priority: "C", completed: false },
      { id: 9, name: "Supplementary Reading", weight: 5, priority: "C", completed: false }
    ];

    let modules = [...defaultModules];

    // Load from LocalStorage if user updated sequence previously
    const savedState = localStorage.getItem('studyflow_custom_modules_v2');
    if (savedState) {
      try {
        modules = JSON.parse(savedState);
      } catch (e) {
        console.error("Failed to load saved state", e);
      }
    }

    function saveState() {
      localStorage.setItem('studyflow_custom_modules_v2', JSON.stringify(modules));
    }

    function resetToDefaults() {
      modules = JSON.parse(JSON.stringify(defaultModules));
      saveState();
      renderModules();
    }

    function toggleForm() {
      const form = document.getElementById('moduleForm');
      form.classList.toggle('active');
    }

    function addNewModule() {
      const nameInput = document.getElementById('newModuleName');
      const weightInput = document.getElementById('newModuleWeight');
      const prioritySelect = document.getElementById('newModulePriority');

      const name = nameInput.value.trim();
      const weight = parseInt(weightInput.value) || 10;
      const priority = prioritySelect.value;

      if (!name) return alert("Please enter a module title! ✨");

      const newModule = {
        id: Date.now(),
        name: name,
        weight: weight,
        priority: priority,
        completed: false
      };

      modules.push(newModule);
      saveState();
      renderModules();

      nameInput.value = '';
      toggleForm();
    }

    function deleteModule(id) {
      modules = modules.filter(m => m.id !== id);
      saveState();
      renderModules();
    }

    function toggleModule(id) {
      const mod = modules.find(m => m.id === id);
      if (mod) {
        mod.completed = !mod.completed;
        saveState();
        renderModules();
      }
    }

    function cyclePriority(id, e) {
      e.stopPropagation();
      const mod = modules.find(m => m.id === id);
      if (mod) {
        if (mod.priority === 'A') mod.priority = 'B';
        else if (mod.priority === 'B') mod.priority = 'C';
        else mod.priority = 'A';
        saveState();
        renderModules();
      }
    }

    function renderModules() {
      const listContainer = document.getElementById('modulesList');
      listContainer.innerHTML = '';

      let totalWeight = 0;
      let completedWeight = 0;
      let countDone = 0;

      let prioADone = 0, prioATotal = 0;
      let prioBDone = 0, prioBTotal = 0;
      let prioCDone = 0, prioCTotal = 0;

      modules.forEach(mod => {
        totalWeight += mod.weight;
        if (mod.completed) {
          completedWeight += mod.weight;
          countDone++;
        }

        if (mod.priority === 'A') { prioATotal++; if (mod.completed) prioADone++; }
        if (mod.priority === 'B') { prioBTotal++; if (mod.completed) prioBDone++; }
        if (mod.priority === 'C') { prioCTotal++; if (mod.completed) prioCDone++; }

        const item = document.createElement('div');
        item.className = `module-item ${mod.completed ? 'completed' : ''}`;

        item.innerHTML = `
          <div class="module-info">
            <div class="custom-checkbox" onclick="toggleModule(${mod.id})"></div>
            <span class="priority-badge badge-${mod.priority}" onclick="cyclePriority(${mod.id}, event)" title="Click to change priority">Prio ${mod.priority}</span>
            <span class="module-name" onclick="toggleModule(${mod.id})">${mod.name}</span>
          </div>
          <div class="module-meta">
            <span class="module-weight">${mod.weight}%</span>
            <button class="delete-btn" onclick="deleteModule(${mod.id})" title="Delete Module">✕</button>
          </div>
        `;

        listContainer.appendChild(item);
      });

      const overallPercent = totalWeight > 0 ? Math.round((completedWeight / totalWeight) * 100) : 0;

      const gaugeFill = document.getElementById('gaugeFill');
      const offset = 314 - (314 * Math.min(overallPercent, 100) / 100);
      gaugeFill.style.strokeDashoffset = offset;

      document.getElementById('percentageText').innerText = `${overallPercent}%`;
      document.getElementById('moduleCount').innerText = `${countDone}/${modules.length}`;

      document.getElementById('prioA').innerText = `${prioADone}/${prioATotal}`;
      document.getElementById('prioB').innerText = `${prioBDone}/${prioBTotal}`;
      document.getElementById('prioC').innerText = `${prioCDone}/${prioCTotal}`;

      const label = document.getElementById('statusLabel');
      if (overallPercent >= 90) label.innerText = "EXCELLENT PROGRESS";
      else if (overallPercent >= 70) label.innerText = "ON TRACK";
      else if (overallPercent >= 40) label.innerText = "MODERATE PACE";
      else if (modules.length === 0) label.innerText = "NO MODULES ADDED";
      else label.innerText = "NEEDS ATTENTION";
    }

    function switchTab(button) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }

    document.addEventListener("DOMContentLoaded", renderModules);
  </script>
</body>
</html>
