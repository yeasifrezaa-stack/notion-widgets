<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Honest CV - Kinetic Command Center</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --notion-bg: #0a0a0a; 
      --harvard-crimson: #C80119;
      --glass-blur: 32px;
      --glow-spread: 28px;
      
      --thamar-black: #1A1717;
      --wood-bark: #312724;
      --dark-taupe: #4A3E3B;
      --maroon-oak: #540916;
      --wolfs-fur: #5D5452;
      --astrogranite: #767579;
      
      --glass-bg: rgba(16, 14, 14, 0.72); 
      --glass-border: rgba(118, 117, 121, 0.28); 
      --card-bg: rgba(28, 23, 22, 0.58); 
      
      --glow-crimson: 0 0 var(--glow-spread) rgba(200, 1, 25, 0.55);
      --glow-crimson-intense: 0 0 calc(var(--glow-spread) + 22px) rgba(200, 1, 25, 0.95), 0 0 calc(var(--glow-spread) * 4) rgba(84, 9, 22, 0.75);
      
      --font-curvy: 'Playfair Display', serif;
      --font-sans: 'Outfit', sans-serif;
      --font-accent: 'Dancing Script', cursive;

      --text-main: #F4F0EB;
      --text-muted: #AFAAA0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--notion-bg);
      font-family: var(--font-sans);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
      perspective: 1200px;
    }

    .ambient-orb {
      position: fixed;
      width: 55vw;
      height: 55vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,1,25,0.14) 0%, transparent 68%);
      top: -20%;
      left: -20%;
      z-index: -1;
      pointer-events: none;
      will-change: transform;
      animation: kineticDrift 20s infinite alternate cubic-bezier(0.44, 0, 0.56, 1);
    }
    .ambient-orb.two {
      top: 30%;
      left: 45%;
      background: radial-gradient(circle, rgba(84,9,22,0.2) 0%, transparent 70%);
      animation-delay: -10s;
      animation-duration: 26s;
      animation-direction: alternate-reverse;
    }

    @keyframes kineticDrift {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); filter: blur(40px); }
      50% { transform: translate(70px, -50px) scale(1.2) rotate(15deg); filter: blur(55px); }
      100% { transform: translate(-50px, 80px) scale(0.9) rotate(-10deg); filter: blur(45px); }
    }

    .glass-panel {
      width: 100%;
      max-width: 1300px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1.5px solid var(--glass-border);
      border-radius: 36px;
      padding: 50px;
      position: relative;
      will-change: transform, box-shadow, border-color;
      box-shadow: 
        0 40px 90px rgba(0,0,0,0.85), 
        inset 0 0 50px rgba(255,255,255,0.03),
        0 0 35px rgba(200, 1, 25, 0.3),
        0 0 70px rgba(200, 1, 25, 0.12);
      animation: masterPulse 5s ease-in-out infinite alternate;
      transition: border-color 0.4s cubic-bezier(0.25, 1, 0.25, 1), box-shadow 0.4s cubic-bezier(0.25, 1, 0.25, 1);
    }

    @keyframes masterPulse {
      0% {
        border-color: rgba(200, 1, 25, 0.35);
        box-shadow: 
          0 40px 90px rgba(0,0,0,0.85), 
          inset 0 0 40px rgba(255,255,255,0.02),
          0 0 25px rgba(200, 1, 25, 0.22),
          0 0 50px rgba(200, 1, 25, 0.08);
      }
      100% {
        border-color: rgba(200, 1, 25, 0.85);
        box-shadow: 
          0 50px 110px rgba(0,0,0,0.9), 
          inset 0 0 65px rgba(255,255,255,0.05),
          0 0 50px rgba(200, 1, 25, 0.6),
          0 0 100px rgba(200, 1, 25, 0.3);
      }
    }

    .settings-toggle {
      position: fixed;
      top: 30px;
      right: 30px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 100;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      will-change: transform;
      animation: subtleFloat 4s ease-in-out infinite alternate;
      transition: color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s cubic-bezier(0.25, 1, 0.25, 1);
    }
    @keyframes subtleFloat {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-4px) rotate(5deg); }
    }
    .settings-toggle:hover {
      color: var(--harvard-crimson);
      border-color: var(--harvard-crimson);
      box-shadow: var(--glow-crimson);
      transform: scale(1.15) rotate(90deg) !important;
    }
    .settings-toggle svg { width: 22px; height: 22px; fill: currentColor; }

    .settings-panel {
      position: fixed;
      top: 0;
      right: -420px;
      width: 380px;
      height: 100vh;
      background: rgba(16, 14, 14, 0.96);
      backdrop-filter: blur(30px);
      border-left: 1px solid var(--glass-border);
      padding: 40px;
      z-index: 99;
      transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -20px 0 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 22px;
      overflow-y: auto;
    }
    .settings-panel.open { right: 0; }
    .settings-header {
      font-family: var(--font-curvy);
      font-size: 1.8rem;
      border-bottom: 1px solid var(--dark-taupe);
      padding-bottom: 15px;
    }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .control-group label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    .control-group input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 10px; cursor: pointer; background: none; }
    .control-group input[type="range"] { width: 100%; accent-color: var(--harvard-crimson); cursor: pointer; }

    .action-btn {
      background: var(--harvard-crimson);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.25, 1);
      box-shadow: var(--glow-crimson);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.8rem;
      will-change: transform;
    }
    .action-btn:hover { filter: brightness(1.2); transform: translateY(-3px) scale(1.02); box-shadow: var(--glow-crimson-intense); }

    .dashboard-header { text-align: center; margin-bottom: 40px; }

    .title {
      font-family: var(--font-curvy);
      font-size: 3.4rem;
      font-style: italic;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      animation: titleWave 6s ease-in-out infinite alternate;
      background: linear-gradient(135deg, #F4F0EB 30%, #C80119 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @keyframes titleWave {
      0% { filter: drop-shadow(0 2px 10px rgba(200,1,25,0.2)); }
      100% { filter: drop-shadow(0 2px 22px rgba(200,1,25,0.55)); }
    }

    .subtitle {
      font-family: var(--font-sans);
      font-weight: 300;
      color: var(--astrogranite);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .metrics-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      padding: 22px;
      border-radius: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      will-change: transform, box-shadow;
      animation: cardBreath 5s ease-in-out infinite alternate;
      transition: border-color 0.4s cubic-bezier(0.25, 1, 0.25, 1), box-shadow 0.4s cubic-bezier(0.25, 1, 0.25, 1), transform 0.4s cubic-bezier(0.25, 1, 0.25, 1);
    }
    .metric-card:nth-child(1) { animation-delay: 0s; }
    .metric-card:nth-child(2) { animation-delay: 1.5s; }
    .metric-card:nth-child(3) { animation-delay: 3s; }

    @keyframes cardBreath {
      0% { transform: translateY(0); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
      100% { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(200,1,25,0.15); }
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 200%; height: 3px;
      background: linear-gradient(90deg, transparent, var(--harvard-crimson), transparent);
      animation: laserSweep 4s linear infinite;
    }
    @keyframes laserSweep {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .metric-card:hover {
      border-color: var(--harvard-crimson);
      box-shadow: var(--glow-crimson);
      transform: translateY(-8px) scale(1.03) !important;
    }

    .metric-value {
      font-family: var(--font-curvy);
      font-size: 2.5rem;
      color: var(--harvard-crimson);
      text-shadow: var(--glow-crimson);
      margin-bottom: 4px;
      transition: transform 0.3s ease;
    }
    .metric-card:hover .metric-value { transform: scale(1.08); }

    .metric-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    .utility-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(22, 18, 18, 0.6);
      border: 1px solid var(--glass-border);
      padding: 15px 25px;
      border-radius: 16px;
      margin-bottom: 35px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .quick-search {
      flex: 1;
      max-width: 350px;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 15px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.25, 1);
    }
    .quick-search:focus {
      border-color: var(--harvard-crimson);
      box-shadow: 0 0 15px rgba(200,1,25,0.4);
      outline: none;
      transform: scale(1.01);
    }

    .utility-buttons { display: flex; gap: 12px; }

    .category-section {
      margin-top: 45px;
      animation: sectionFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes sectionFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--dark-taupe);
      padding-bottom: 14px;
      margin-bottom: 22px;
    }

    .category-title {
      font-family: var(--font-curvy);
      font-size: 1.9rem;
      color: var(--text-main);
      cursor: pointer;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }
    .category-title:hover { 
      color: var(--harvard-crimson); 
      text-shadow: 0 0 12px rgba(200,1,25,0.4); 
    }

    .category-actions { display: flex; gap: 10px; align-items: center; }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      will-change: transform;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.25, 1);
    }
    .btn-icon:hover {
      background: var(--harvard-crimson);
      border-color: var(--harvard-crimson);
      box-shadow: var(--glow-crimson);
      transform: translateY(-3px) scale(1.04);
    }
    .btn-icon.danger:hover {
      background: #8b0000;
      border-color: #ff4d4d;
      box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
    }

    /* ========================================================
       AESTHETIC INLINE CREATION DRAWER (+ ADD CONFIGURATOR)
       ======================================================== */
    .creation-drawer {
      background: rgba(22, 16, 16, 0.85);
      border: 1px solid var(--harvard-crimson);
      border-radius: 20px;
      margin-bottom: 25px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      will-change: max-height, opacity, padding;
      transition: max-height 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-in-out, padding 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--glow-crimson);
      padding: 0 30px;
    }
    .creation-drawer.open {
      max-height: 900px;
      opacity: 1;
      padding: 30px;
    }

    .creation-drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(200, 1, 25, 0.3);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .creation-drawer-title {
      font-family: var(--font-curvy);
      font-size: 1.4rem;
      color: var(--harvard-crimson);
      text-shadow: 0 0 10px rgba(200,1,25,0.4);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .form-grid.full { grid-template-columns: 1fr; }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-field label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
    }
    .form-field input, .form-field textarea {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.25, 1);
    }
    .form-field input:focus, .form-field textarea:focus {
      border-color: var(--harvard-crimson);
      box-shadow: 0 0 15px rgba(200,1,25,0.4);
      outline: none;
      transform: scale(1.01);
    }
    .form-field textarea { resize: vertical; min-height: 80px; }

    .drawer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 10px;
    }

    /* =========================================
       ULTRA-LUXURIOUS EXPANDING DROPDOWN CARDS
       ========================================= */
    .entry-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      margin-bottom: 18px;
      will-change: transform, box-shadow, border-color, background;
      position: relative;
      overflow: hidden;
      animation: cardSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.25, 1);
    }
    
    .entry-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      border: 1px solid rgba(200, 1, 25, 0.12);
      pointer-events: none;
      animation: cardIdleGlow 6s ease-in-out infinite alternate;
    }
    @keyframes cardIdleGlow {
      0% { opacity: 0.3; box-shadow: inset 0 0 15px rgba(200,1,25,0.02); }
      100% { opacity: 0.8; box-shadow: inset 0 0 30px rgba(200,1,25,0.08); }
    }

    .entry-card:hover {
      background: rgba(38, 30, 28, 0.75);
      border-color: rgba(200, 1, 25, 0.55);
      transform: translateY(-4px) scale(1.005);
      box-shadow: 0 20px 45px rgba(0,0,0,0.7), 0 0 25px rgba(200, 1, 25, 0.15);
    }

    .entry-card.active {
      background: rgba(32, 24, 22, 0.88);
      border-color: var(--harvard-crimson);
      box-shadow: 0 30px 60px rgba(0,0,0,0.85), var(--glow-crimson);
      transform: translateY(-2px);
    }

    .entry-header {
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .entry-title-area {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--astrogranite);
      box-shadow: 0 0 10px var(--astrogranite);
      transition: all 0.5s cubic-bezier(0.25, 1, 0.25, 1);
      position: relative;
    }
    .status-dot::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px dashed var(--astrogranite);
      animation: orbSpin 10s linear infinite;
      opacity: 0.4;
    }
    @keyframes orbSpin {
      100% { transform: rotate(360deg); }
    }

    .entry-card.active .status-dot {
      background: var(--harvard-crimson);
      box-shadow: var(--glow-crimson-intense);
      transform: scale(1.4);
      animation: neonPulseLoop 2.5s ease-in-out infinite alternate;
    }
    @keyframes neonPulseLoop {
      0% { box-shadow: 0 0 8px var(--harvard-crimson), inset 0 0 4px #fff; transform: scale(1.3); }
      100% { box-shadow: 0 0 25px var(--harvard-crimson), 0 0 40px var(--harvard-crimson); transform: scale(1.6); }
    }

    .entry-title {
      font-weight: 500;
      font-size: 1.15rem;
      letter-spacing: 0.3px;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }
    .entry-title:hover { color: var(--harvard-crimson); text-shadow: 0 0 10px rgba(200,1,25,0.4); }

    .entry-meta-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .entry-date {
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 1.2px;
      background: rgba(255,255,255,0.03);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .dropdown-chevron {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      will-change: transform;
    }
    .dropdown-chevron svg {
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
      transition: fill 0.3s ease, transform 0.3s ease;
    }
    .entry-card:hover .dropdown-chevron {
      background: rgba(200, 1, 25, 0.15);
      border-color: var(--harvard-crimson);
      box-shadow: 0 0 12px rgba(200,1,25,0.3);
    }
    .entry-card:hover .dropdown-chevron svg {
      fill: var(--harvard-crimson);
    }
    .entry-card.active .dropdown-chevron {
      transform: rotate(180deg);
      background: var(--harvard-crimson);
      border-color: var(--harvard-crimson);
      box-shadow: var(--glow-crimson);
    }
    .entry-card.active .dropdown-chevron svg {
      fill: #ffffff;
    }

    .remove-card-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 6px 10px;
      border-radius: 8px;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.25, 1);
    }
    .remove-card-btn:hover {
      color: #ff4d4d;
      background: rgba(255, 77, 77, 0.2);
      transform: scale(1.15);
    }

    .entry-content {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      will-change: max-height, opacity, padding;
      transition: max-height 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease-in-out, padding 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0 28px;
    }
    .entry-card.active .entry-content {
      max-height: 1800px;
      opacity: 1;
      padding: 0 28px 28px 28px;
    }

    .content-grid {
      display: grid;
      gap: 20px;
      border-top: 1px solid rgba(200, 1, 25, 0.25);
      padding-top: 24px;
      position: relative;
    }
    
    .content-grid::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--harvard-crimson), transparent);
      animation: innerScan 4s ease-in-out infinite;
    }
    @keyframes innerScan {
      0% { opacity: 0.2; transform: scaleX(0.5); }
      50% { opacity: 1; transform: scaleX(1); }
      100% { opacity: 0.2; transform: scaleX(0.5); }
    }

    .data-block {
      position: relative;
      background: rgba(18, 14, 14, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 16px 20px;
      border-radius: 14px;
      transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
    }
    .data-block:hover {
      background: rgba(24, 18, 18, 0.7);
      border-color: rgba(200, 1, 25, 0.3);
      transform: translateX(4px);
    }

    .data-block p {
      color: var(--text-main);
      font-weight: 300;
      line-height: 1.65;
      font-size: 0.98rem;
      outline: none;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.3s ease, border 0.3s ease;
    }
    .data-block p[contenteditable="true"]:hover {
      background: rgba(255,255,255,0.03);
      border: 1px dashed var(--glass-border);
    }
    .data-block p[contenteditable="true"]:focus {
      background: rgba(200, 1, 25, 0.06);
      border: 1px solid var(--harvard-crimson);
      box-shadow: 0 0 15px rgba(200,1,25,0.3);
    }

    .data-label {
      font-family: var(--font-curvy);
      font-style: italic;
      color: var(--harvard-crimson);
      font-size: 1.15rem;
      margin-bottom: 6px;
      display: block;
      text-shadow: 0 0 8px rgba(200,1,25,0.3);
      cursor: pointer;
      transition: filter 0.3s ease, transform 0.3s ease;
    }
    .data-label:hover { filter: brightness(1.3); transform: translateX(3px); }

    .update-action {
      background: linear-gradient(135deg, rgba(84, 9, 22, 0.35) 0%, rgba(28, 23, 22, 0.7) 100%); 
      border: 1px solid rgba(200, 1, 25, 0.5);
      padding: 20px;
      border-radius: 14px;
      animation: actionPulseGlow 4s ease-in-out infinite alternate;
    }
    @keyframes actionPulseGlow {
      0% { border-color: rgba(200, 1, 25, 0.35); box-shadow: inset 0 0 15px rgba(200,1,25,0.1); }
      100% { border-color: rgba(200, 1, 25, 0.85); box-shadow: inset 0 0 30px rgba(200,1,25,0.3), 0 0 20px rgba(200,1,25,0.15); }
    }

    .metrics-input-box {
      background: rgba(12, 10, 10, 0.8);
      border: 1px solid var(--glass-border);
      padding: 18px 20px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 15px;
      align-items: center;
      margin-top: 4px;
    }

    .metric-input-field label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .metric-input-field input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.25, 1);
    }
    .metric-input-field input:focus {
      border-color: var(--harvard-crimson);
      box-shadow: 0 0 15px rgba(200,1,25,0.4);
      outline: none;
      transform: scale(1.02);
    }

    .neon-stamp {
      font-family: var(--font-accent);
      font-size: 3rem;
      color: var(--harvard-crimson);
      text-shadow: var(--glow-crimson-intense);
      position: absolute;
      bottom: 25px;
      right: 35px;
      transform: rotate(-12deg) scale(1.4);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .entry-card.active .neon-stamp {
      opacity: 0.95;
      transform: rotate(-12deg) scale(1);
      animation: stampFloat 4s ease-in-out infinite alternate;
      transition-delay: 0.25s;
    }
    @keyframes stampFloat {
      0% { transform: rotate(-12deg) scale(1) translateY(0); filter: drop-shadow(0 2px 8px rgba(200,1,25,0.5)); }
      100% { transform: rotate(-9deg) scale(1.04) translateY(-6px); filter: drop-shadow(0 8px 18px rgba(200,1,25,0.8)); }
    }

    .global-controls {
      display: flex;
      justify-content: flex-end;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px dashed var(--dark-taupe);
    }
  </style>
</head>
<body>

  <div class="ambient-orb"></div>
  <div class="ambient-orb two"></div>

  <div class="settings-toggle" id="settings-btn" title="Customize Engine">
    <svg viewBox="0 0 24 24">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </div>

  <div class="settings-panel" id="settings-panel">
    <h3 class="settings-header">Visual Engine</h3>
    <div class="control-group">
      <label>Accent Glow Color</label>
      <input type="color" id="ctrl-accent" value="#C80119">
    </div>
    <div class="control-group">
      <label>Background Color</label>
      <input type="color" id="ctrl-bg" value="#0a0a0a">
    </div>
    <div class="control-group">
      <label>Glow Spread Intensity</label>
      <input type="range" id="ctrl-glow" min="15" max="50" value="28">
    </div>
    <button class="action-btn" id="save-storage-btn">Save State</button>
    <button class="action-btn" id="reset-storage-btn" style="background: var(--dark-taupe);">Reset Defaults</button>
  </div>

  <div class="glass-panel">
    
    <header class="dashboard-header">
      <h1 class="title">System Update Archive</h1>
      <p class="subtitle">Behavioral Debug Log & Command Center</p>
      
      <div class="metrics-container">
        <div class="metric-card">
          <div class="metric-value" id="stat-error-rate">12%</div>
          <div class="metric-label">Mean Error Rate</div>
        </div>
        <div class="metric-card">
          <div class="metric-value" id="stat-pattern-breaks">08</div>
          <div class="metric-label">Total Pattern Breaks</div>
        </div>
        <div class="metric-card">
          <div class="metric-value" id="stat-vulnerability" style="font-size: 1.3rem; padding-top: 10px; font-family: var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Time Management</div>
          <div class="metric-label">Key Vulnerability</div>
        </div>
      </div>
    </header>

    <div class="utility-bar">
      <input type="text" class="quick-search" id="quick-search-input" placeholder="🔍 Filter logs or keywords...">
      <div class="utility-buttons">
        <button class="btn-icon" id="collapse-all-btn"><span>Collapse All</span></button>
        <button class="btn-icon" id="expand-all-btn"><span>Expand All</span></button>
      </div>
    </div>

    <!-- Aesthetic Section Creation Drawer -->
    <div class="creation-drawer" id="section-drawer">
      <div class="creation-drawer-header">
        <h3 class="creation-drawer-title">Configure New Section Domain</h3>
        <button class="remove-card-btn" onclick="toggleSectionDrawer()">✕</button>
      </div>
      <div class="form-grid full">
        <div class="form-field">
          <label>Section Title</label>
          <input type="text" id="new-sec-title" placeholder="e.g. Physical Conditioning & Health">
        </div>
      </div>
      <div class="drawer-actions">
        <button class="btn-icon" onclick="toggleSectionDrawer()" style="background: var(--dark-taupe);">Cancel</button>
        <button class="action-btn" onclick="commitNewSection()">Initialize Section</button>
      </div>
    </div>

    <div id="log-container">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Global Actions -->
    <div class="global-controls">
      <button class="btn-icon" id="add-category-btn" onclick="toggleSectionDrawer()">
        <span>+ Add New Section Title</span>
      </button>
    </div>

  </div>

  <script>
    const defaultLogs = [
      {
        category: "Academic Architecture",
        logs: [
          {
            title: "O Level Mock Exam Miscalibration",
            date: "Jan 2026",
            bug: "Approached the O Level mock exams as a casual knowledge check rather than a strict simulation of the marking scheme.",
            rootCause: "Relying on general understanding rather than the specific phrasing examiners require.",
            systemUpdate: "Before: Studying textbooks. After: Studying marking schemes concurrently.",
            nextMove: "Execute one past paper under strict timed conditions every Sunday.",
            errorRate: 15,
            breaks: 2,
            vulnerability: "Exam Calibration"
          },
          {
            title: "Post-School Bandwidth Drain",
            date: "Jul 2025",
            bug: "Attempted heavy study blocks immediately after school, causing instant mental burnout.",
            rootCause: "Failing to account for the cognitive drain of a 6-hour institutional routine.",
            systemUpdate: "Before: Forcing immediate output. After: Mandatory 90-minute absolute rest.",
            nextMove: "Block out 2:30 PM - 4:00 PM purely for physical/mental reset.",
            errorRate: 18,
            breaks: 3,
            vulnerability: "Time Management"
          }
        ]
      },
      {
        category: "Projects & Engineering",
        logs: [
          {
            title: "Blender Asset Corruption",
            date: "Mar 2026",
            bug: "Lost detailed structural requirements for 3D character artwork render after a crash.",
            rootCause: "Trusting application stability over redundant manual saving.",
            systemUpdate: "Before: Saving at completion. After: Incremental version saving (v1, v2).",
            nextMove: "Configure auto-save to 10-minute intervals in Blender and Krita.",
            errorRate: 10,
            breaks: 1,
            vulnerability: "Workflow Backup"
          }
        ]
      }
    ];

    let systemLogs = JSON.parse(localStorage.getItem('honest_cv_kinetic_v6')) || defaultLogs;

    function updateDashboardMetrics() {
      let totalError = 0;
      let totalBreaks = 0;
      let count = 0;
      const vulnerabilityCounts = {};

      systemLogs.forEach(section => {
        section.logs.forEach(log => {
          totalError += Number(log.errorRate) || 0;
          totalBreaks += Number(log.breaks) || 0;
          count++;
          const vuln = log.vulnerability ? log.vulnerability.trim() : "General";
          vulnerabilityCounts[vuln] = (vulnerabilityCounts[vuln] || 0) + 1;
        });
      });

      const meanError = count > 0 ? (totalError / count).toFixed(1) : 0;
      let topVuln = "Time Management";
      let maxFreq = -1;
      for (const [v, freq] of Object.entries(vulnerabilityCounts)) {
        if (freq > maxFreq) {
          maxFreq = freq;
          topVuln = v;
        }
      }

      document.getElementById('stat-error-rate').innerText = `${meanError}%`;
      document.getElementById('stat-pattern-breaks').innerText = String(totalBreaks).padStart(2, '0');
      document.getElementById('stat-vulnerability').innerText = topVuln;
    }

    const container = document.getElementById('log-container');

    function renderDashboard(filterText = '') {
      container.innerHTML = '';
      
      systemLogs.forEach((section, sIndex) => {
        const filteredLogs = section.logs.filter(log => {
          const matchString = (log.title + log.bug + log.rootCause + log.systemUpdate + log.nextMove + section.category).toLowerCase();
          return matchString.includes(filterText.toLowerCase());
        });

        if (filterText && filteredLogs.length === 0 && !section.category.toLowerCase().includes(filterText.toLowerCase())) {
          return;
        }

        const logsToDisplay = filterText && !section.category.toLowerCase().includes(filterText.toLowerCase()) ? filteredLogs : section.logs;

        const categoryWrapper = document.createElement('div');
        categoryWrapper.className = 'category-section';
        
        const headerRow = document.createElement('div');
        headerRow.className = 'category-header-row';
        headerRow.innerHTML = `
          <h2 class="category-title" contenteditable="true" title="Click to edit section title" onblur="updateCategoryTitle(${sIndex}, this.innerText)">${section.category}</h2>
          <div class="category-actions">
            <button class="btn-icon" onclick="openDashboardDrawer(${sIndex})"><span>+ Add Dashboard</span></button>
            <button class="btn-icon danger" onclick="removeCategory(${sIndex})"><span>Remove Title</span></button>
          </div>
        `;
        categoryWrapper.appendChild(headerRow);

        // Aesthetic Dashboard Creation Drawer injected per section
        const dashboardDrawer = document.createElement('div');
        dashboardDrawer.className = 'creation-drawer';
        dashboardDrawer.id = `dashboard-drawer-${sIndex}`;
        dashboardDrawer.innerHTML = `
          <div class="creation-drawer-header">
            <h3 class="creation-drawer-title">Configure New Dashboard Log</h3>
            <button class="remove-card-btn" onclick="closeDashboardDrawer(${sIndex})">✕</button>
          </div>
          <div class="form-grid">
            <div class="form-field">
              <label>Log Title</label>
              <input type="text" id="new-dash-title-${sIndex}" placeholder="e.g. Protocol Breakdown">
            </div>
            <div class="form-field">
              <label>Timeline / Date</label>
              <input type="text" id="new-dash-date-${sIndex}" placeholder="e.g. Mar 2026">
            </div>
          </div>
          <div class="form-grid full">
            <div class="form-field">
              <label>The Bug / Friction Point</label>
              <textarea id="new-dash-bug-${sIndex}" placeholder="Describe the failure or inefficiency..."></textarea>
            </div>
            <div class="form-field">
              <label>Root Cause</label>
              <textarea id="new-dash-cause-${sIndex}" placeholder="Why did this occur?..."></textarea>
            </div>
            <div class="form-field">
              <label>System Update (Before -> After)</label>
              <textarea id="new-dash-update-${sIndex}" placeholder="Before: ... After: ..."></textarea>
            </div>
            <div class="form-field">
              <label>Next Move</label>
              <input type="text" id="new-dash-move-${sIndex}" placeholder="Immediate corrective action protocol">
            </div>
          </div>
          <div class="form-grid">
            <div class="form-field">
              <label>Error Rate (%)</label>
              <input type="number" id="new-dash-error-${sIndex}" value="10">
            </div>
            <div class="form-field">
              <label>Pattern Breaks</label>
              <input type="number" id="new-dash-breaks-${sIndex}" value="1">
            </div>
          </div>
          <div class="form-grid full">
            <div class="form-field">
              <label>Vulnerability Type</label>
              <input type="text" id="new-dash-vuln-${sIndex}" placeholder="e.g. Focus & Execution">
            </div>
          </div>
          <div class="drawer-actions">
            <button class="btn-icon" onclick="closeDashboardDrawer(${sIndex})" style="background: var(--dark-taupe);">Cancel</button>
            <button class="action-btn" onclick="commitNewDashboard(${sIndex})">Inject Dashboard</button>
          </div>
        `;
        categoryWrapper.appendChild(dashboardDrawer);

        logsToDisplay.forEach((log) => {
          const lIndex = systemLogs[sIndex].logs.indexOf(log);

          const card = document.createElement('div');
          card.className = 'entry-card';
          
          card.innerHTML = `
            <div class="entry-header">
              <div class="entry-title-area">
                <div class="status-dot"></div>
                <span class="entry-title" contenteditable="true" title="Click to edit title" onblur="updateLogField(${sIndex}, ${lIndex}, 'title', this.innerText)">${log.title}</span>
              </div>
              <div class="entry-meta-right">
                <span class="entry-date" contenteditable="true" title="Click to edit date" onblur="updateLogField(${sIndex}, ${lIndex}, 'date', this.innerText)">${log.date}</span>
                <div class="dropdown-chevron" title="Expand / Collapse">
                  <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                </div>
                <button class="remove-card-btn" onclick="event.stopPropagation(); removeDashboard(${sIndex}, ${lIndex})" title="Remove Dashboard">✕</button>
              </div>
            </div>
            <div class="entry-content">
              <div class="content-grid">
                <div class="data-block">
                  <span class="data-label" onclick="renameLabel(this)">The Bug</span>
                  <p contenteditable="true" onblur="updateLogField(${sIndex}, ${lIndex}, 'bug', this.innerText)">${log.bug}</p>
                </div>
                <div class="data-block">
                  <span class="data-label" onclick="renameLabel(this)">Root Cause</span>
                  <p contenteditable="true" onblur="updateLogField(${sIndex}, ${lIndex}, 'rootCause', this.innerText)">${log.rootCause}</p>
                </div>
                <div class="data-block">
                  <span class="data-label" onclick="renameLabel(this)">System Update</span>
                  <p contenteditable="true" onblur="updateLogField(${sIndex}, ${lIndex}, 'systemUpdate', this.innerText)">${log.systemUpdate}</p>
                </div>
                <div class="data-block update-action">
                  <span class="data-label" style="font-size: 1.15rem; color: var(--text-main);" onclick="renameLabel(this)">Next Move</span>
                  <p contenteditable="true" style="color: var(--harvard-crimson); font-weight: 500; font-size: 1.05rem; text-shadow: 0 0 8px rgba(200,1,25,0.4);" onblur="updateLogField(${sIndex}, ${lIndex}, 'nextMove', this.innerText)">${log.nextMove}</p>
                </div>

                <div class="metrics-input-box">
                  <div class="metric-input-field">
                    <label>Error Rate (%)</label>
                    <input type="number" class="input-error" data-s="${sIndex}" data-l="${lIndex}" value="${log.errorRate}">
                  </div>
                  <div class="metric-input-field">
                    <label>Pattern Breaks</label>
                    <input type="number" class="input-breaks" data-s="${sIndex}" data-l="${lIndex}" value="${log.breaks}">
                  </div>
                  <div class="metric-input-field">
                    <label>Vulnerability Type</label>
                    <input type="text" class="input-vuln" data-s="${sIndex}" data-l="${lIndex}" value="${log.vulnerability}">
                  </div>
                </div>
              </div>
              <div class="neon-stamp">Patched</div>
            </div>
          `;

          card.querySelector('.entry-header').addEventListener('click', (e) => {
            if(e.target.getAttribute('contenteditable') === 'true') return;
            const isActive = card.classList.contains('active');
            document.querySelectorAll('.entry-card').forEach(c => c.classList.remove('active'));
            if (!isActive) card.classList.add('active');
          });

          categoryWrapper.appendChild(card);
        });

        container.appendChild(categoryWrapper);
      });

      document.querySelectorAll('.input-error').forEach(input => {
        input.addEventListener('input', (e) => {
          systemLogs[e.target.dataset.s].logs[e.target.dataset.l].errorRate = parseFloat(e.target.value) || 0;
          updateDashboardMetrics();
        });
      });

      document.querySelectorAll('.input-breaks').forEach(input => {
        input.addEventListener('input', (e) => {
          systemLogs[e.target.dataset.s].logs[e.target.dataset.l].breaks = parseInt(e.target.value) || 0;
          updateDashboardMetrics();
        });
      });

      document.querySelectorAll('.input-vuln').forEach(input => {
        input.addEventListener('input', (e) => {
          systemLogs[e.target.dataset.s].logs[e.target.dataset.l].vulnerability = e.target.value;
          updateDashboardMetrics();
        });
      });
    }

    // Section Drawer Controllers
    window.toggleSectionDrawer = function() {
      const drawer = document.getElementById('section-drawer');
      drawer.classList.toggle('open');
      if(drawer.classList.contains('open')) {
        document.getElementById('new-sec-title').value = '';
        document.getElementById('new-sec-title').focus();
      }
    };

    window.commitNewSection = function() {
      const title = document.getElementById('new-sec-title').value.trim();
      if(!title) {
        alert("Please enter a valid section title.");
        return;
      }
      systemLogs.push({
        category: title,
        logs: [{
          title: "Initial Diagnostic Entry",
          date: "Present",
          bug: "Baseline calibration required for this domain.",
          rootCause: "Uncharted operational parameter.",
          systemUpdate: "Before: Untracked. After: Active Telemetry.",
          nextMove: "Establish consistent weekly protocol checks.",
          errorRate: 10,
          breaks: 1,
          vulnerability: "Baseline Setup"
        }]
      });
      toggleSectionDrawer();
      renderDashboard(document.getElementById('quick-search-input').value);
      updateDashboardMetrics();
    };

    // Dashboard Drawer Controllers
    window.openDashboardDrawer = function(sIndex) {
      // Close any other open dashboard drawers first
      document.querySelectorAll('[id^="dashboard-drawer-"]').forEach(d => d.classList.remove('open'));
      const drawer = document.getElementById(`dashboard-drawer-${sIndex}`);
      if(drawer) {
        drawer.classList.add('open');
        document.getElementById(`new-dash-title-${sIndex}`).focus();
      }
    };

    window.closeDashboardDrawer = function(sIndex) {
      const drawer = document.getElementById(`dashboard-drawer-${sIndex}`);
      if(drawer) drawer.classList.remove('open');
    };

    window.commitNewDashboard = function(sIndex) {
      const title = document.getElementById(`new-dash-title-${sIndex}`).value.trim();
      const date = document.getElementById(`new-dash-date-${sIndex}`).value.trim() || "Recent";
      const bug = document.getElementById(`new-dash-bug-${sIndex}`).value.trim() || "Observed workflow friction point.";
      const rootCause = document.getElementById(`new-dash-cause-${sIndex}`).value.trim() || "Underlying behavioral habit.";
      const systemUpdate = document.getElementById(`new-dash-update-${sIndex}`).value.trim() || "Before: Unoptimized. After: Engineered.";
      const nextMove = document.getElementById(`new-dash-move-${sIndex}`).value.trim() || "Execute protocol revision.";
      const errorRate = parseFloat(document.getElementById(`new-dash-error-${sIndex}`).value) || 10;
      const breaks = parseInt(document.getElementById(`new-dash-breaks-${sIndex}`).value) || 1;
      const vulnerability = document.getElementById(`new-dash-vuln-${sIndex}`).value.trim() || "Execution";

      if(!title) {
        alert("Please provide a log title.");
        return;
      }

      systemLogs[sIndex].logs.push({
        title, date, bug, rootCause, systemUpdate, nextMove, errorRate, breaks, vulnerability
      });

      closeDashboardDrawer(sIndex);
      renderDashboard(document.getElementById('quick-search-input').value);
      updateDashboardMetrics();
    };

    window.updateCategoryTitle = function(sIndex, newTitle) {
      if(!newTitle.trim()) return;
      systemLogs[sIndex].category = newTitle.trim();
    };

    window.updateLogField = function(sIndex, lIndex, field, val) {
      systemLogs[sIndex].logs[lIndex][field] = val.trim();
    };

    window.renameLabel = function(labelEl) {
      const newName = prompt("Rename section label:", labelEl.innerText);
      if(newName && newName.trim()) {
        labelEl.innerText = newName.trim();
      }
    };

    window.removeDashboard = function(sIndex, lIndex) {
      if (confirm("Are you sure you want to remove this dashboard log?")) {
        systemLogs[sIndex].logs.splice(lIndex, 1);
        renderDashboard(document.getElementById('quick-search-input').value);
        updateDashboardMetrics();
      }
    };

    window.removeCategory = function(sIndex) {
      if (confirm("Remove this entire section title and all its dashboards?")) {
        systemLogs.splice(sIndex, 1);
        renderDashboard(document.getElementById('quick-search-input').value);
        updateDashboardMetrics();
      }
    };

    document.getElementById('quick-search-input').addEventListener('input', (e) => {
      renderDashboard(e.target.value);
    });

    document.getElementById('collapse-all-btn').addEventListener('click', () => {
      document.querySelectorAll('.entry-card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.creation-drawer').forEach(d => d.classList.remove('open'));
    });

    document.getElementById('expand-all-btn').addEventListener('click', () => {
      document.querySelectorAll('.entry-card').forEach(c => c.classList.add('active'));
    });

    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');
    settingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('open'));

    const root = document.documentElement;
    document.getElementById('ctrl-accent').addEventListener('input', (e) => {
      root.style.setProperty('--harvard-crimson', e.target.value);
    });
    document.getElementById('ctrl-bg').addEventListener('input', (e) => {
      root.style.setProperty('--notion-bg', e.target.value);
    });
    document.getElementById('ctrl-glow').addEventListener('input', (e) => {
      root.style.setProperty('--glow-spread', `${e.target.value}px`);
    });

    document.getElementById('save-storage-btn').addEventListener('click', () => {
      localStorage.setItem('honest_cv_kinetic_v6', JSON.stringify(systemLogs));
      alert("Command center state successfully saved!");
      settingsPanel.classList.remove('open');
    });

    document.getElementById('reset-storage-btn').addEventListener('click', () => {
      localStorage.removeItem('honest_cv_kinetic_v6');
      location.reload();
    });

    renderDashboard();
    updateDashboardMetrics();
  </script>
</body>
</html>
