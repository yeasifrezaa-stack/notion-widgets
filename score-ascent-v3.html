<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score Ascent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --imperial: #2A123F;
      --amethyst: #4B1F6F;
      --lavender: #9C86B9;
      --orchid: #C6B6DD;
      --pearl: #F1EDF7;
      --notion: #191919;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--notion);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 720px;
      height: 720px;
      background: radial-gradient(circle, rgba(75, 31, 111, 0.22) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .ascent {
      width: 100%;
      max-width: 560px;
      background: rgba(42, 18, 63, 0.6);
      backdrop-filter: blur(40px) saturate(170%);
      -webkit-backdrop-filter: blur(40px) saturate(170%);
      border: 1px solid rgba(198, 182, 221, 0.15);
      border-radius: 28px;
      padding: 24px 20px 18px;
      position: relative;
      z-index: 1;
      box-shadow: 
        0 28px 60px -24px rgba(0,0,0,0.55),
        0 0 90px rgba(75, 31, 111, 0.15);
      opacity: 0;
      transform: translateY(20px);
      animation: shellIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes shellIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 500;
      color: var(--pearl);
      letter-spacing: 0.03em;
      text-shadow: 0 0 24px rgba(198, 182, 221, 0.35);
    }

    .header p {
      font-size: 11px;
      color: var(--lavender);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .column {
      background: rgba(42, 18, 63, 0.5);
      border: 1px solid rgba(156, 134, 185, 0.18);
      border-radius: 18px;
      padding: 14px 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .column:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 30px -10px rgba(0,0,0,0.4);
    }

    .column.near {
      box-shadow: 0 0 24px rgba(198, 182, 221, 0.2);
    }

    .test-name {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      color: var(--pearl);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .target {
      font-size: 10px;
      color: var(--lavender);
      margin-bottom: 6px;
    }

    .tube {
      width: 34px;
      height: 140px;
      background: rgba(20, 10, 30, 0.7);
      border-radius: 20px;
      border: 1px solid rgba(156, 134, 185, 0.25);
      position: relative;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .liquid {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      border-radius: 0 0 18px 18px;
      transition: height 1.3s cubic-bezier(0.16, 1, 0.3, 1);
      height: 0%;
    }

    .column[data-key="sat"] .liquid {
      background: linear-gradient(to top, #4B1F6F, #9C86B9, #C6B6DD);
      box-shadow: 0 0 16px rgba(156, 134, 185, 0.45);
    }
    .column[data-key="toefl"] .liquid {
      background: linear-gradient(to top, #2A123F, #5C3D8A, #A78BCA);
      box-shadow: 0 0 16px rgba(167, 139, 202, 0.4);
    }
    .column[data-key="ielts"] .liquid {
      background: linear-gradient(to top, #3D1F5C, #7B5EA7, #D4C1EC);
      box-shadow: 0 0 16px rgba(212, 193, 236, 0.4);
    }

    .score {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      color: var(--pearl);
      line-height: 1;
    }

    .gap {
      font-size: 10px;
      color: var(--orchid);
      margin-top: 2px;
    }

    .status {
      margin-top: 7px;
      font-size: 9px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(156, 134, 185, 0.18);
      color: var(--orchid);
    }

    .status.active {
      background: rgba(156, 134, 185, 0.3);
      color: var(--pearl);
    }

    .prod {
      background: rgba(42, 18, 63, 0.45);
      border: 1px solid rgba(156, 134, 185, 0.15);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .prod-title {
      font-size: 11px;
      color: var(--lavender);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .prod-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .prod-row:last-child { margin-bottom: 0; }

    .prod-btn {
      flex: 1;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(156, 134, 185, 0.2);
      background: rgba(0,0,0,0.2);
      color: var(--pearl);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .prod-btn:hover {
      background: rgba(75, 31, 111, 0.5);
      border-color: rgba(198, 182, 221, 0.35);
    }

    .insight {
      font-size: 12px;
      color: var(--orchid);
      line-height: 1.45;
      padding: 10px 12px;
      background: rgba(75, 31, 111, 0.35);
      border-radius: 12px;
      border-left: 2px solid rgba(198, 182, 221, 0.4);
    }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 90%;
      max-width: 320px;
      background: rgba(42, 18, 63, 0.96);
      border: 1px solid rgba(198, 182, 221, 0.2);
      border-radius: 18px;
      padding: 22px 18px;
      transform: scale(0.95);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .overlay.open .modal {
      transform: scale(1);
    }

    .modal h3 {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      color: var(--pearl);
      margin-bottom: 12px;
    }

    .modal label {
      display: block;
      font-size: 11px;
      color: var(--lavender);
      margin-bottom: 4px;
      letter-spacing: 0.03em;
    }

    .modal input {
      width: 100%;
      height: 38px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(156, 134, 185, 0.25);
      border-radius: 10px;
      color: var(--pearl);
      font-size: 14px;
      padding: 0 12px;
      outline: none;
      margin-bottom: 12px;
    }

    .modal input:focus {
      border-color: rgba(198, 182, 221, 0.45);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .modal-actions button {
      flex: 1;
      height: 38px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid rgba(156, 134, 185, 0.25) !important;
      color: var(--lavender);
    }

    .btn-save {
      background: linear-gradient(135deg, #9C86B9, #4B1F6F);
      color: var(--pearl);
    }
  </style>
</head>
<body>
  <div class="ascent">
    <div class="header">
      <h1>Score Ascent</h1>
      <p>Entrance Tests Progress</p>
    </div>

    <div class="columns">
      <div class="column" data-key="sat">
        <div class="test-name" id="name-sat">SAT</div>
        <div class="target" id="target-sat">Target 1500</div>
        <div class="tube"><div class="liquid" id="liquid-sat"></div></div>
        <div class="score" id="score-sat">1350</div>
        <div class="gap" id="gap-sat">Gap 150</div>
        <div class="status active" id="status-sat">Studying</div>
      </div>

      <div class="column" data-key="toefl">
        <div class="test-name" id="name-toefl">TOEFL</div>
        <div class="target" id="target-toefl">Target 100</div>
        <div class="tube"><div class="liquid" id="liquid-toefl"></div></div>
        <div class="score" id="score-toefl">0</div>
        <div class="gap" id="gap-toefl">Gap 100</div>
        <div class="status" id="status-toefl">Not Started</div>
      </div>

      <div class="column" data-key="ielts">
        <div class="test-name" id="name-ielts">IELTS</div>
        <div class="target" id="target-ielts">Target 7.5</div>
        <div class="tube"><div class="liquid" id="liquid-ielts"></div></div>
        <div class="score" id="score-ielts">6.5</div>
        <div class="gap" id="gap-ielts">Gap 1.0</div>
        <div class="status active" id="status-ielts">Studying</div>
      </div>
    </div>

    <div class="prod">
      <div class="prod-title">Quick Actions</div>
      <div class="prod-row">
        <button class="prod-btn" data-key="sat">Edit SAT</button>
        <button class="prod-btn" data-key="toefl">Edit TOEFL</button>
        <button class="prod-btn" data-key="ielts">Edit IELTS</button>
      </div>
      <div class="prod-row">
        <button class="prod-btn" id="btnLowest">Focus Lowest</button>
        <button class="prod-btn" id="btnReset">Reset All</button>
      </div>
    </div>

    <div class="insight" id="insight">
      SAT is closest to target. TOEFL has not been started yet.
    </div>
  </div>

  <!-- Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h3 id="modalTitle">Edit Test</h3>

      <label>Test Name</label>
      <input type="text" id="inputName" placeholder="e.g. SAT" />

      <label>Target Score</label>
      <input type="number" id="inputTarget" step="0.1" placeholder="e.g. 1500" />

      <label>Current Score</label>
      <input type="number" id="inputCurrent" step="0.1" placeholder="e.g. 1350" />

      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel">Cancel</button>
        <button class="btn-save" id="btnSave">Save</button>
      </div>
    </div>
  </div>

  <script>
    const tests = {
      sat:   { name: "SAT",   current: 1350, target: 1500 },
      toefl: { name: "TOEFL", current: 0,    target: 100 },
      ielts: { name: "IELTS", current: 6.5,  target: 7.5 }
    };

    let activeKey = null;

    function getPct(key) {
      const t = tests[key];
      if (t.target <= 0) return 0;
      return Math.min(100, (t.current / t.target) * 100);
    }

    function updateColumn(key) {
      const t = tests[key];
      const pct = getPct(key);
      const gap = (t.target - t.current).toFixed(t.target % 1 === 0 ? 0 : 1);

      document.getElementById('name-' + key).textContent = t.name;
      document.getElementById('target-' + key).textContent = 'Target ' + t.target;
      document.getElementById('liquid-' + key).style.height = pct + '%';
      document.getElementById('score-' + key).textContent = t.current;
      document.getElementById('gap-' + key).textContent = 'Gap ' + gap;

      const statusEl = document.getElementById('status-' + key);
      if (t.current <= 0) {
        statusEl.textContent = 'Not Started';
        statusEl.classList.remove('active');
      } else if (pct >= 100) {
        statusEl.textContent = 'Reached';
        statusEl.classList.add('active');
      } else {
        statusEl.textContent = 'Studying';
        statusEl.classList.add('active');
      }

      const col = document.querySelector(`.column[data-key="${key}"]`);
      if (pct >= 85) col.classList.add('near');
      else col.classList.remove('near');
    }

    function updateInsight() {
      const keys = Object.keys(tests);
      const sorted = keys.sort((a, b) => getPct(b) - getPct(a));
      const best = tests[sorted[0]];
      const worst = tests[sorted[sorted.length - 1]];

      let text = `${best.name} is currently leading. `;
      if (worst.current <= 0) {
        text += `${worst.name} has not been started yet.`;
      } else {
        text += `Biggest remaining gap is on ${worst.name}.`;
      }
      document.getElementById('insight').textContent = text;
    }

    function refresh() {
      Object.keys(tests).forEach(updateColumn);
      updateInsight();
    }

    function openModal(key) {
      activeKey = key;
      const t = tests[key];
      document.getElementById('modalTitle').textContent = 'Edit ' + t.name;
      document.getElementById('inputName').value = t.name;
      document.getElementById('inputTarget').value = t.target;
      document.getElementById('inputCurrent').value = t.current;
      document.getElementById('overlay').classList.add('open');
      setTimeout(() => document.getElementById('inputName').focus(), 50);
    }

    document.querySelectorAll('.column').forEach(col => {
      col.addEventListener('click', () => openModal(col.dataset.key));
    });

    document.querySelectorAll('.prod-btn[data-key]').forEach(btn => {
      btn.addEventListener('click', () => openModal(btn.dataset.key));
    });

    document.getElementById('btnLowest').addEventListener('click', () => {
      const worst = Object.keys(tests).sort((a, b) => getPct(a) - getPct(b))[0];
      openModal(worst);
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      tests.sat   = { name: "SAT",   current: 1350, target: 1500 };
      tests.toefl = { name: "TOEFL", current: 0,    target: 100 };
      tests.ielts = { name: "IELTS", current: 6.5,  target: 7.5 };
      refresh();
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
      document.getElementById('overlay').classList.remove('open');
    });

    document.getElementById('btnSave').addEventListener('click', () => {
      const name = document.getElementById('inputName').value.trim();
      const target = parseFloat(document.getElementById('inputTarget').value);
      const current = parseFloat(document.getElementById('inputCurrent').value);

      if (name) tests[activeKey].name = name;
      if (!isNaN(target) && target > 0) tests[activeKey].target = target;
      if (!isNaN(current) && current >= 0) tests[activeKey].current = current;

      refresh();
      document.getElementById('overlay').classList.remove('open');
    });

    document.getElementById('overlay').addEventListener('click', e => {
      if (e.target.id === 'overlay') {
        document.getElementById('overlay').classList.remove('open');
      }
    });

    setTimeout(refresh, 200);
  </script>
</body>
</html>
