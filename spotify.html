<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exquisite Spotify Widget</title>
    
    <!-- STRICTLY ONLY SAIL FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sail&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Matched to your calendar and Notion dark aesthetic */
            --bg-notion: #191919; 
            --glass-base: rgba(25, 25, 25, 0.4); 
            
            --gold-edge: rgba(243, 200, 119, 0.25);
            --gold-glow: rgba(243, 200, 119, 0.4);
            --gold-text: #f3c877;
            
            --white-shiny: #ffffff;
            --white-glow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sail', cursive !important;
        }

        body {
            background-color: var(--bg-notion);
            color: var(--white-shiny);
            display: flex;
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 10px; 
            overflow: hidden; 
        }

        .spotify-container {
            width: 100%;
            max-width: 400px;
            background: var(--glass-base);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--gold-edge);
            border-radius: 16px;
            padding: 18px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4),
                        inset 0 0 12px rgba(243, 200, 119, 0.05);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Widget Header */
        .spotify-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(243, 200, 119, 0.15);
        }

        .spotify-title {
            font-size: 1.5rem; 
            color: var(--gold-text);
            text-shadow: 0 0 10px var(--gold-glow);
            letter-spacing: 1px;
            font-weight: normal;
        }

        .spotify-dot {
            width: 8px; 
            height: 8px;
            border-radius: 50%;
            background: var(--gold-text);
            box-shadow: 0 0 8px var(--gold-glow);
        }

        /* Iframe Wrapper to match glass curve */
        .iframe-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        iframe {
            width: 100%;
            height: 152px; /* Standard compact Spotify player height */
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="spotify-container">
        
        <!-- Header -->
        <div class="spotify-header">
            <div class="spotify-title">Vibes & Melodies 🎶</div>
            <div class="spotify-dot"></div>
        </div>

        <!-- Embedded Spotify Player (Replace the src link with your favorite playlist/track embed link) -->
        <div class="iframe-wrapper">
            <iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_name=generator&theme=0" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
            </iframe>
        </div>

    </div>

</body>
</html>
