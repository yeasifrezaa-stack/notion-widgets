<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams & Assessments - Smooth Reactive</title>
    
    <!-- STRICTLY ONLY SAIL FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sail&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-notion: #191919; 
            --glass-base: rgba(20, 20, 20, 0.65);
            --glass-hover: rgba(35, 30, 25, 0.85);
            
            --gold-bright: #f3c877;
            --gold-mid: #d4a15c;
            --gold-dark: #7a5f37;
            --gold-glow: rgba(243, 200, 119, 0.3);
            
            --text-main: #fcf8f2;
            --text-muted: #9e9589;
            
            --color-track: #85d685;
            --color-approaching: #f3c877;
            --color-crossed: #f47171;

            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sail', cursive !important;
        }

        body {
            background-color: var(--bg-notion);
            color: var(--text-main);
            display: flex;
            justify-content: flex-end; 
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px;
            overflow-x: hidden;
        }

        /* Ambient Glow specific to the right side */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--gold-glow), transparent 60%);
            top: -200px;
            right: -150px;
            filter: blur(50px);
            opacity: 0.4;
            z-index: -1;
            animation: breathe 8s infinite alternate var(--ease-smooth);
            pointer-events: none;
        }

        @keyframes breathe {
            0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            100% { transform: scale(1.1) translate(-20px, 30px); opacity: 0.6; }
        }

        .widget-container {
            width: 100%;
            max-width: 1050px;
            background: var(--glass-base);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid rgba(243, 200, 119, 0.15);
            border-radius: 20px;
            padding: 30px 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: popIn 0.8s var(--ease-spring);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(243, 200, 119, 0.15);
        }

        .header h1 {
            font-size: 2.8rem;
            color: transparent;
            background: linear-gradient(180deg, #fff, var(--gold-bright), var(--gold-mid));
            -webkit-background-clip: text;
            background-clip: text;
            font-weight: normal;
            letter-spacing: 1px;
            text-shadow: 0 4px 15px var(--gold-glow);
        }

        .header p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn-add {
            background: rgba(243, 200, 119, 0.05);
            border: 1px solid var(--gold-mid);
            color: var(--gold-bright);
            font-size: 1.3rem;
            padding: 6px 20px;
            border-radius: 99px;
            cursor: pointer;
            transition: all 0.4s var(--ease-spring);
            letter-spacing: 1px;
        }

        .btn-add:hover {
            background: rgba(243, 200, 119, 0.2);
            box-shadow: 0 0 20px var(--gold-glow);
            transform: translateY(-3px) scale(1.05);
            border-color: var(--gold-bright);
        }
        
        .btn-add:active { transform: scale(0.95); }

        /* Highly Animated Dashboard embedded in the original aesthetic */
        .analytics-dashboard {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 40px;
            margin-bottom: 24px;
            padding: 24px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.03);
            align-items: center;
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.4);
        }

        .gauge-container {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gauge-svg { transform: rotate(-90deg); width: 100%; height: 100%; filter: drop-shadow(0 0 8px var(--gold-glow)); }
        .gauge-bg { stroke: rgba(255,255,255,0.05); stroke-width: 8; fill: none; }
        .gauge-fill {
            stroke: var(--gold-bright);
            stroke-width: 8;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            fill: none;
            stroke-linecap: round;
            transition: stroke-dashoffset 1.2s var(--ease-spring);
        }

        .gauge-text {
            position: absolute;
            font-size: 1.8rem;
            color: var(--gold-bright);
            text-shadow: 0 0 12px var(--gold-glow);
        }

        .health-bars {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        
        .health-title { font-size: 1.3rem; color: var(--text-muted); margin-bottom: 2px; }
        
        .bar-wrap { display: flex; align-items: center; gap: 16px; font-size: 1.2rem; }
        .bar-label { width: 110px; color: var(--text-muted); }
        .bar-track {
            flex: 1;
            height: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            transition: width 1.2s var(--ease-spring);
        }
        .bar-fill.track { background: var(--color-track); box-shadow: 0 0 12px var(--color-track); }
        .bar-fill.approach { background: var(--color-approaching); box-shadow: 0 0 12px var(--color-approaching); }
        .bar-fill.crossed { background: var(--color-crossed); box-shadow: 0 0 12px var(--color-crossed); }
        .bar-value { width: 30px; text-align: right; color: var(--gold-bright); font-size: 1.3rem; }

        .grid-header {
            display: grid;
            grid-template-columns: 2fr 0.9fr 1.3fr 1.2fr 1fr 1.2fr 40px;
            padding: 0 16px 12px 16px;
            color: var(--gold-mid);
            font-size: 1.4rem;
            opacity: 0.9;
        }

        .grid-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row {
            display: grid;
            grid-template-columns: 2fr 0.9fr 1.3fr 1.2fr 1fr 1.2fr 40px;
            align-items: center;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.015);
            transition: all 0.4s var(--ease-spring);
            font-size: 1.3rem;
            animation: slideInFade 0.5s var(--ease-spring) backwards;
        }

        @keyframes slideInFade {
            0% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .row.removing {
            animation: slideOutFade 0.4s var(--ease-smooth) forwards;
        }

        @keyframes slideOutFade {
            100% { opacity: 0; transform: scale(0.95) translateX(-30px); }
        }

        .row:hover {
            background: var(--glass-hover);
            border-color: rgba(243, 200, 119, 0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transform: scale(1.01) translateY(-2px);
        }

        .editable {
            outline: none;
            padding: 4px 8px;
            border-radius: 6px;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
            cursor: text;
        }

        .editable:focus {
            border-color: var(--gold-bright);
            color: var(--gold-bright);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 12px var(--gold-glow);
        }

        /* Smooth Styled Native Date Input */
        .styled-date-input {
            color-scheme: dark; 
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-family: 'Sail', cursive !important;
            font-size: 1.3rem;
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .styled-date-input:hover, .styled-date-input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: var(--gold-bright);
            color: var(--gold-bright);
            outline: none;
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .styled-date-input::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.8) sepia(1) hue-rotate(5deg) saturate(400%);
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .styled-date-input::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
            transform: scale(1.2) rotate(10deg);
        }

        .readonly-field { padding: 4px 8px; pointer-events: none; transition: all 0.3s; }

        .status-track { color: var(--color-track); text-shadow: 0 0 8px rgba(133, 214, 133, 0.3); }
        .status-approaching { color: var(--color-approaching); text-shadow: 0 0 10px rgba(243, 200, 119, 0.5); animation: pulseText 2s infinite alternate; }
        .status-crossed { color: var(--color-crossed); text-shadow: 0 0 10px rgba(244, 113, 113, 0.5); }

        @keyframes pulseText {
            0% { text-shadow: 0 0 5px rgba(243,200,119,0.3); }
            100% { text-shadow: 0 0 15px rgba(243,200,119,0.7); }
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            border: 2px solid var(--gold-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s var(--ease-spring);
            background: rgba(0,0,0,0.2);
        }

        .checkbox:hover { border-color: var(--gold-bright); transform: scale(1.15) rotate(-5deg); box-shadow: 0 0 15px var(--gold-glow); }
        
        .checkbox.checked {
            background: var(--gold-bright);
            border-color: var(--gold-bright);
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 20px rgba(243, 200, 119, 0.5);
        }
        
        .checkbox-icon {
            opacity: 0;
            transform: scale(0);
            transition: all 0.4s var(--ease-spring);
            color: #191919;
            font-size: 1.1rem;
        }
        
        .checkbox.checked .checkbox-icon {
            opacity: 1;
            transform: scale(1);
        }

        .row.completed { opacity: 0.4; filter: grayscale(0.6); background: rgba(0,0,0,0.2); }
        .row.completed .editable, .row.completed .styled-date-input, .row.completed .readonly-field {
            text-decoration: line-through;
            pointer-events: none;
        }
        .row.completed:hover { opacity: 0.8; filter: grayscale(0); }

        .btn-delete {
            background: none;
            border: none;
            color: var(--gold-dark);
            cursor: pointer;
            font-size: 1.3rem;
            opacity: 0;
            transition: all 0.3s var(--ease-spring);
            padding: 5px;
        }
        
        .row:hover .btn-delete { opacity: 1; transform: translateX(0); }
        .btn-delete:hover { color: var(--color-crossed); transform: scale(1.4) rotate(15deg); text-shadow: 0 0 10px rgba(244,113,113,0.5); }

    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="widget-container">
        
        <div class="header">
            <div>
                <h1>Exams & Assessments</h1>
                <p>Click the date box for a smooth calendar picker. Metrics update instantly.</p>
            </div>
            <button class="btn-add" onclick="addNewRow()">+ Add</button>
        </div>

        <!-- NEW: Embedded Dashboard matching the requested FIXED_2 aesthetic -->
        <div class="analytics-dashboard">
            <div class="gauge-container">
                <svg class="gauge-svg" viewBox="0 0 100 100">
                    <circle class="gauge-bg" cx="50" cy="50" r="45"></circle>
                    <circle class="gauge-fill" id="progress-circle" cx="50" cy="50" r="45"></circle>
                </svg>
                <div class="gauge-text" id="progress-text">0%</div>
            </div>
            
            <div class="health-bars">
                <div class="health-title">Pending Deadlines Overview</div>
                
                <div class="bar-wrap">
                    <div class="bar-label">On Track</div>
                    <div class="bar-track"><div class="bar-fill track" id="bar-track"></div></div>
                    <div class="bar-value" id="stat-track">0</div>
                </div>
                
                <div class="bar-wrap">
                    <div class="bar-label">Approaching</div>
                    <div class="bar-track"><div class="bar-fill approach" id="bar-approach"></div></div>
                    <div class="bar-value" id="stat-approach">0</div>
                </div>
                
                <div class="bar-wrap">
                    <div class="bar-label">Crossed</div>
                    <div class="bar-track"><div class="bar-fill crossed" id="bar-crossed"></div></div>
                    <div class="bar-value" id="stat-crossed">0</div>
                </div>
            </div>
        </div>

        <div class="grid-header">
            <div>Exam Name</div>
            <div>Days Left</div>
            <div>Deadline</div>
            <div>Subject</div>
            <div>Type</div>
            <div>Status</div>
            <div></div>
        </div>

        <div class="grid-body" id="tableBody">
            <!-- Rows injected by JS -->
        </div>

    </div>

    <script>
        const defaultData = [
            { id: 1, name: "Math Final Exam", date: "2027-05-25", subject: "Mathematics", type: "Final Exam", done: false },
            { id: 2, name: "Chemistry Final", date: "2027-05-15", subject: "Chemistry", type: "Final Exam", done: false },
            { id: 3, name: "English Reading Mock", date: "2026-08-10", subject: "English ESL", type: "Mock Test", done: false },
            { id: 4, name: "Physics Final Exam", date: "2027-05-20", subject: "Physics", type: "Final Exam", done: false },
            { id: 5, name: "Biology Topical", date: "2026-08-08", subject: "Biology", type: "Mock Test", done: false }
        ];

        let exams = JSON.parse(localStorage.getItem('reactive_exams_data_fixed_v3')) || defaultData;

        function calculateMetrics(dateString) {
            const today = new Date();
            today.setHours(0, 0, 0, 0); 
            
            const [y, m, d] = dateString.split('-');
            const targetDate = new Date(y, m - 1, d);
            targetDate.setHours(0, 0, 0, 0);

            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            let status = "On Track";
            let statusClass = "status-track";
            let displayDays = `${diffDays}d`;

            if (diffDays < 0) {
                status = "Crossed";
                statusClass = "status-crossed";
                displayDays = `+${Math.abs(diffDays)}d`;
            } else if (diffDays === 0) {
                status = "Approaching";
                statusClass = "status-approaching";
                displayDays = "Today";
            } else if (diffDays <= 14) {
                status = "Approaching";
                statusClass = "status-approaching";
            }

            return { displayDays, status, statusClass };
        }

        function updateGraphs() {
            const total = exams.length;
            const completed = exams.filter(e => e.done).length;
            const completionPct = total === 0 ? 0 : Math.round((completed / total) * 100);

            // Animate Dashboard Gauge
            const circle = document.getElementById('progress-circle');
            const offset = 283 - (283 * completionPct) / 100;
            circle.style.strokeDashoffset = offset;
            
            // Animate % Text Counter
            const progressText = document.getElementById('progress-text');
            let currentPct = parseInt(progressText.innerText) || 0;
            if(currentPct !== completionPct) {
                let start = currentPct;
                let step = completionPct > currentPct ? 1 : -1;
                let timer = setInterval(() => {
                    start += step;
                    progressText.innerText = `${start}%`;
                    if(start === completionPct) clearInterval(timer);
                }, 15);
            }

            // Animate Dashboard Bars
            const pending = exams.filter(e => !e.done);
            let track = 0, approach = 0, cross = 0;
            
            pending.forEach(exam => {
                const met = calculateMetrics(exam.date);
                if(met.status === 'On Track') track++;
                else if(met.status === 'Approaching') approach++;
                else cross++;
            });

            const pTotal = pending.length || 1; 
            
            document.getElementById('bar-track').style.width = `${(track/pTotal)*100}%`;
            document.getElementById('bar-approach').style.width = `${(approach/pTotal)*100}%`;
            document.getElementById('bar-crossed').style.width = `${(cross/pTotal)*100}%`;

            document.getElementById('stat-track').innerText = track;
            document.getElementById('stat-approach').innerText = approach;
            document.getElementById('stat-crossed').innerText = cross;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            exams.forEach((exam, index) => {
                const metrics = calculateMetrics(exam.date);
                const animDelay = index * 0.05;

                const row = document.createElement('div');
                row.className = `row ${exam.done ? 'completed' : ''}`;
                row.style.animationDelay = `${animDelay}s`;
                row.id = `row-${exam.id}`;
                
                row.innerHTML = `
                    <div class="editable" contenteditable="${!exam.done}" spellcheck="false" 
                         onblur="updateTextData(${index}, 'name', this.innerText)"
                         onkeydown="handleEnter(event)">${exam.name}</div>
                    
                    <div class="readonly-field ${metrics.statusClass}">${metrics.displayDays}</div>
                    
                    <div>
                        <input type="date" class="styled-date-input" value="${exam.date}" 
                               onchange="updateDate(${index}, this.value)" ${exam.done ? 'disabled' : ''}>
                    </div>
                    
                    <div class="editable" contenteditable="${!exam.done}" spellcheck="false" 
                         onblur="updateTextData(${index}, 'subject', this.innerText)"
                         onkeydown="handleEnter(event)">${exam.subject}</div>
                         
                    <div class="editable" contenteditable="${!exam.done}" spellcheck="false" 
                         onblur="updateTextData(${index}, 'type', this.innerText)"
                         onkeydown="handleEnter(event)">${exam.type}</div>
                    
                    <div class="readonly-field ${metrics.statusClass}">${metrics.status}</div>
                    
                    <div style="display: flex; gap: 12px; align-items: center; justify-content: flex-end;">
                        <div class="checkbox ${exam.done ? 'checked' : ''}" onclick="toggleDone(${index})">
                            <span class="checkbox-icon">✓</span>
                        </div>
                        <button class="btn-delete" onclick="deleteRow(${index}, ${exam.id})">✖</button>
                    </div>
                `;
                tbody.appendChild(row);
            });

            updateGraphs();
        }

        // Prevent multiline breaks in edit mode
        function handleEnter(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.target.blur();
            }
        }

        function updateTextData(index, field, value) {
            if(exams[index][field] !== value.trim()) {
                exams[index][field] = value.trim();
                saveData();
            }
        }

        function updateDate(index, newDateValue) {
            if (!newDateValue) return;
            exams[index].date = newDateValue;
            saveData();
            renderTable(); // Update metrics & graphs
        }

        function toggleDone(index) {
            exams[index].done = !exams[index].done;
            saveData();
            renderTable(); 
        }

        function addNewRow() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 14); 
            const isoDate = tomorrow.toISOString().split('T')[0];

            exams.unshift({
                id: Date.now(),
                name: "New Assessment",
                date: isoDate,
                subject: "Subject",
                type: "Type",
                done: false
            });
            saveData();
            renderTable();
        }

        function deleteRow(index, id) {
            const rowEl = document.getElementById(`row-${id}`);
            if(rowEl) {
                rowEl.classList.add('removing');
                setTimeout(() => {
                    exams.splice(index, 1);
                    saveData();
                    renderTable();
                }, 350);
            } else {
                exams.splice(index, 1);
                saveData();
                renderTable();
            }
        }

        function saveData() {
            localStorage.setItem('reactive_exams_data_fixed_v3', JSON.stringify(exams));
        }

        renderTable();
    </script>
</body>
</html>
