<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balanced Glass Weather Widget</title>
    
    <!-- DM Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-notion: #121212;
            --glass-bg: rgba(18, 22, 30, 0.72);
            --glass-border: rgba(96, 165, 250, 0.25);
            --text-main: #f8fafc;
            --gold-accent: #f59e0b;
            --sky-blue: #60a5fa;
            --sky-glow: 0 0 30px rgba(96, 165, 250, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif !important;
        }

        body {
            background-color: var(--bg-notion);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        .weather-card {
            width: 100%;
            /* Widened just a bit for that perfect middle ground */
            max-width: 350px; 
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 26px 28px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .weather-card:hover {
            border-color: rgba(96, 165, 250, 0.45);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), var(--sky-glow);
        }

        /* Header: Location & Search */
        .weather-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .location-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .city-name {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
            line-height: 1.1;
        }

        .country-tag {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--sky-blue);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .search-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--sky-blue);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: rgba(96, 165, 250, 0.15);
            border-color: var(--sky-blue);
            transform: scale(1.05);
        }

        /* Main: Weather Display */
        .weather-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .weather-icon-box {
            font-size: 4.5rem;
            filter: drop-shadow(0 10px 20px rgba(96, 165, 250, 0.25));
            line-height: 1;
            margin-bottom: 4px;
        }

        .temp-display {
            font-size: 3.8rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .condition-text {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--sky-blue);
            text-align: center;
        }

        /* Footer: Stats Grid */
        .weather-footer {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(0, 0, 0, 0.25);
            padding: 16px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        /* Divider Line inside the grid */
        .weather-footer::after {
            content: '';
            position: absolute;
            top: 15%;
            bottom: 15%;
            left: 50%;
            width: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .detail-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .detail-value {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gold-accent);
        }

        /* Search Overlay */
        .search-panel {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 18, 24, 0.95);
            backdrop-filter: blur(20px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            gap: 16px;
            z-index: 10;
        }

        .search-panel.active {
            display: flex;
        }

        .search-panel input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(96, 165, 250, 0.4);
            border-radius: 12px;
            color: var(--text-main);
            padding: 14px 18px;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .search-panel input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .button-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .search-panel button {
            flex: 1;
            background: var(--sky-blue);
            border: none;
            color: #121212;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .search-panel button:hover {
            opacity: 0.9;
        }

        .search-panel .close-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        
        <!-- Header: Location & Search -->
        <div class="weather-header">
            <div class="location-box">
                <span class="city-name" id="cityName">Dhaka</span>
                <span class="country-tag" id="countryTag">Bangladesh</span>
            </div>
            <button class="search-btn" onclick="toggleSearch()" title="Search City">🔍</button>
        </div>

        <!-- Main: Big Weather Info -->
        <div class="weather-main">
            <div class="weather-icon-box" id="weatherEmoji">☁️</div>
            <div class="temp-display" id="tempDisplay">--°</div>
            <div class="condition-text" id="conditionText">Loading...</div>
        </div>

        <!-- Footer: Humidity & Wind -->
        <div class="weather-footer">
            <div class="detail-item">
                <span class="detail-label">Humidity</span>
                <span class="detail-value" id="humidityDisplay">--%</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Wind</span>
                <span class="detail-value" id="windDisplay">-- km/h</span>
            </div>
        </div>

        <!-- Hidden Search Overlay -->
        <div class="search-panel" id="searchPanel">
            <input type="text" id="cityInput" placeholder="Enter city name..." onkeydown="if(event.key==='Enter') changeCity()">
            <div class="button-group">
                <button onclick="changeCity()">Set</button>
                <button class="close-btn" onclick="toggleSearch()">Cancel</button>
            </div>
        </div>

    </div>

    <script>
        let currentLat = 23.8103;
        let currentLon = 90.4125;
        let currentCityName = "Dhaka";
        let currentCountry = "Bangladesh";

        try {
            const savedCity = localStorage.getItem('weather_city_bal');
            const savedLat = localStorage.getItem('weather_lat_bal');
            const savedLon = localStorage.getItem('weather_lon_bal');
            const savedCountry = localStorage.getItem('weather_country_bal');
            if (savedCity && savedLat && savedLon) {
                currentCityName = savedCity;
                currentLat = parseFloat(savedLat);
                currentLon = parseFloat(savedLon);
                currentCountry = savedCountry || "";
            }
        } catch(e) {}

        function toggleSearch() {
            const panel = document.getElementById('searchPanel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) {
                document.getElementById('cityInput').focus();
            }
        }

        async function fetchWeather(lat, lon, cityName, countryName) {
            try {
                document.getElementById('cityName').innerText = cityName;
                document.getElementById('countryTag').innerText = countryName || "";
                
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`);
                const data = await res.json();
                
                if (data && data.current) {
                    const temp = Math.round(data.current.temperature_2m);
                    const humidity = data.current.relative_humidity_2m;
                    const wind = Math.round(data.current.wind_speed_10m);
                    const code = data.current.weather_code;

                    document.getElementById('tempDisplay').innerText = `${temp}°`;
                    document.getElementById('humidityDisplay').innerText = `${humidity}%`;
                    document.getElementById('windDisplay').innerText = `${wind} km/h`;

                    updateVisuals(code);
                }
            } catch (e) {
                document.getElementById('conditionText').innerText = "Offline";
            }
        }

        function updateVisuals(code) {
            let emoji = "☁️";
            let desc = "Cloudy";

            if (code === 0) { emoji = "☀️"; desc = "Clear"; }
            else if (code >= 1 && code <= 3) { emoji = "🌤️"; desc = "Partly Cloudy"; }
            else if (code >= 45 && code <= 48) { emoji = "🌫️"; desc = "Foggy"; }
            else if (code >= 51 && code <= 67) { emoji = "🌧️"; desc = "Rainy"; }
            else if (code >= 71 && code <= 77) { emoji = "❄️"; desc = "Snowy"; }
            else if (code >= 95) { emoji = "⚡"; desc = "Stormy"; }

            document.getElementById('weatherEmoji').innerText = emoji;
            document.getElementById('conditionText').innerText = desc;
        }

        async function changeCity() {
            const query = document.getElementById('cityInput').value.trim();
            if (!query) return;

            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1`);
                const geoData = await geoRes.json();

                if (geoData && geoData.results && geoData.results.length > 0) {
                    const loc = geoData.results[0];
                    currentLat = loc.latitude;
                    currentLon = loc.longitude;
                    currentCityName = loc.name;
                    currentCountry = loc.country || "";

                    try {
                        localStorage.setItem('weather_city_bal', currentCityName);
                        localStorage.setItem('weather_lat_bal', currentLat);
                        localStorage.setItem('weather_lon_bal', currentLon);
                        localStorage.setItem('weather_country_bal', currentCountry);
                    } catch(e) {}

                    fetchWeather(currentLat, currentLon, currentCityName, currentCountry);
                    toggleSearch();
                    document.getElementById('cityInput').value = '';
                } else {
                    alert("Location not found.");
                }
            } catch(e) {
                alert("Network error.");
            }
        }

        fetchWeather(currentLat, currentLon, currentCityName, currentCountry);
    </script>
</body>
</html>
