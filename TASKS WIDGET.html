<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Custom Graph Dashboard</title>
    
    <!-- DM Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Core Theme */
            --notion-dark: #191919;
            --panel-bg: rgba(22, 22, 26, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            
            /* Dynamic Theme (Starts as Gold, changes via JS) */
            --theme-hex: #f59e0b;
            --theme-rgb: 245, 158, 11;
            
            --theme-glow: 0 0 35px rgba(var(--theme-rgb), 0.15);
            --white-glow: 0 0 20px rgba(255, 255, 255, 0.2);
            --dropdown-bg: rgba(30, 30, 35, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif !important;
        }

        body {
            background-color: var(--notion-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Idle Glow & Float Animation */
        @keyframes idleFloat {
            0% { transform: translateY(0px); box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1); }
            50% { transform: translateY(-6px); box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(var(--theme-rgb),0.3), var(--theme-glow); }
            100% { transform: translateY(0px); box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1); }
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 1000px; /* Slightly wider to fit 8 perfectly */
            background: var(--panel-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-glass);
            border-top: 1px solid rgba(var(--theme-rgb), 0.4);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            animation: idleFloat 7s ease-in-out infinite;
            transition: border-color 0.4s ease;
        }

        /* Top Controls */
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 16px;
        }

        .header-left, .header-right {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--theme-hex);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.4s ease;
        }

        .custom-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            border-color: var(--theme-hex);
            box-shadow: 0 0 10px rgba(var(--theme-rgb), 0.2);
        }

        .color-picker {
            width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        /* ADD BUTTON */
        .add-btn {
            background: rgba(var(--theme-rgb), 0.15);
            color: var(--theme-hex);
            border: 1px solid rgba(var(--theme-rgb), 0.4);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 38px;
        }

        .add-btn:hover {
            background: rgba(var(--theme-rgb), 0.3);
            box-shadow: 0 0 15px rgba(var(--theme-rgb), 0.2);
            transform: translateY(-2px);
        }

        /* Horizontal Graph Container */
        .graph-area {
            position: relative;
            width: 100%;
            height: 320px;
            display: flex;
            align-items: flex-end;
            justify-content: space-evenly; /* Adapts spacing evenly */
            padding: 40px 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            border-left: 2px solid rgba(255, 255, 255, 0.1);
        }

        .y-axis-label {
            position: absolute;
            left: -10px;
            top: -15px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .x-axis-label {
            position: absolute;
            right: 0;
            bottom: -25px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* Graph Bars & Data Points */
        .data-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            position: relative;
            width: 50px; /* Slimmer to fit 8 */
            gap: 6px;
        }

        .due-date-tag {
            position: absolute;
            top: -30px;
            font-size: 0.65rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 6px;
            border-radius: 6px;
            color: var(--text-main);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
        }

        .bars-container {
            display: flex;
            gap: 4px; /* Tighter gap */
            align-items: flex-end;
            height: 100%;
            width: 100%;
            justify-content: center;
        }

        /* The Vertical "Thingys" */
        .bar {
            width: 16px; /* Slimmer bars */
            border-radius: 4px 4px 0 0;
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s ease, filter 0.2s ease, background 0.4s ease, border-color 0.4s ease;
            position: relative;
            cursor: pointer;
        }

        /* Dynamic Priority Bar */
        .bar-priority {
            background: linear-gradient(180deg, var(--theme-hex) 0%, rgba(var(--theme-rgb), 0.1) 100%);
            border: 1px solid rgba(var(--theme-rgb), 0.5);
            border-bottom: none;
        }

        /* Status Bar (Shiny White) */
        .bar-status {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: none;
        }

        /* Hover Animations */
        .data-group:hover .due-date-tag { opacity: 1; transform: translateY(0); }
        .bar:hover { transform: scaleY(1.05) scaleX(1.15); filter: brightness(1.3); box-shadow: var(--white-glow); }
        .bar-priority:hover { box-shadow: var(--theme-glow); }

        /* X-Axis Bottom Labels */
        .x-labels {
            position: absolute;
            bottom: -35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 80px;
            text-align: center;
        }
        
        .x-priority { font-size: 0.7rem; font-weight: 700; color: var(--theme-hex); transition: color 0.4s; }
        .x-type { font-size: 0.65rem; color: var(--text-muted); }

        /* Interactive Task Editor */
        .editor-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-glass);
        }

        .editor-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .editor-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .task-name-edit {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.85rem;
            width: 100%;
            outline: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
            padding-bottom: 2px;
        }

        .task-name-edit:focus {
            border-bottom-color: var(--theme-hex);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 6px;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s;
        }

        .delete-btn:hover { background: #ef4444; color: white; }

        /* Dropdown Selection Animations */
        @keyframes selectPop {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(0,0,0,0); }
            50% { transform: scale(1.05); box-shadow: 0 0 15px var(--theme-hex); border-color: var(--theme-hex); }
            100% { transform: scale(1); box-shadow: 0 0 0 rgba(0,0,0,0); }
        }

        .interactive-select {
            width: 100%;
            background: var(--dropdown-bg);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
        }

        .interactive-select.animating { animation: selectPop 0.4s ease-out; }
        .interactive-select:hover { border-color: var(--theme-hex); }

        /* LIMIT WARNING MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid rgba(var(--theme-rgb), 0.5);
            box-shadow: 0 0 40px rgba(var(--theme-rgb), 0.2);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--theme-hex);
            margin-bottom: 10px;
        }

        .modal-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-close-btn {
            background: var(--theme-hex);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .modal-close-btn:hover { opacity: 0.8; }

    </style>
</head>
<body>

    <div class="dashboard-wrapper" role="region" aria-label="Dynamic Task Graph Dashboard">
        
        <!-- Customization Header -->
        <div class="controls-header">
            <div class="header-left">
                <div class="input-group">
                    <label class="input-label" for="yAxisName">Y-Axis Name</label>
                    <input type="text" id="yAxisName" class="custom-input" value="Impact & Progress" oninput="updateLabels()">
                </div>
                
                <div class="input-group">
                    <label class="input-label" for="xAxisName">X-Axis Name</label>
                    <input type="text" id="xAxisName" class="custom-input" value="Task Categories" oninput="updateLabels()">
                </div>
            </div>

            <div class="header-right">
                <div class="input-group">
                    <label class="input-label" for="themeColorPicker">Widget Theme</label>
                    <input type="color" id="themeColorPicker" class="color-picker" value="#f59e0b" oninput="updateThemeColor()">
                </div>
                
                <button class="add-btn" onclick="addTask()">Add Task +</button>
            </div>
        </div>

        <!-- Horizontal Graph Area -->
        <div class="graph-area" id="graphArea" aria-live="polite">
            <span class="y-axis-label" id="yLabelDisplay">Impact & Progress</span>
            <span class="x-axis-label" id="xLabelDisplay">Task Categories</span>
            <!-- Bars rendered via JS -->
        </div>

        <!-- Task Editor Area -->
        <div class="editor-section" id="editorArea">
            <!-- Dropdowns & Names rendered via JS -->
        </div>

    </div>

    <!-- Maximum Limit Pop-Out Modal -->
    <div class="modal-overlay" id="limitModal">
        <div class="modal-content">
            <h2 class="modal-title">Limit Reached! 🛑</h2>
            <p class="modal-text">You have reached the maximum limit of 8 tasks to maintain visual aesthetics. Please delete an existing task to add a new one.</p>
            <button class="modal-close-btn" onclick="closeModal()">Got it!</button>
        </div>
    </div>

    <script>
        // Initial Dataset (5 items)
        let tasks = [
            { id: 0, name: "Genetics Rev", dueDate: "Jul 26", priority: "High", status: "Not Started", type: "Revision" },
            { id: 1, name: "Notion Store", dueDate: "Jul 28", priority: "Low", status: "Not Started", type: "Chore" },
            { id: 2, name: "Algebra Paper", dueDate: "Jul 25", priority: "High", status: "In Progress", type: "Revision" },
            { id: 3, name: "Essay Practice", dueDate: "Jul 23", priority: "Medium", status: "Done", type: "Homework" },
            { id: 4, name: "Chem Sheet", dueDate: "Jul 27", priority: "Medium", status: "Not Started", type: "Homework" }
        ];

        // Height Mapping logic
        const priorityHeights = { "High": "95%", "Medium": "60%", "Low": "25%" };
        const statusHeights = { "Done": "95%", "In Progress": "55%", "Not Started": "15%" };

        function initGraph() {
            renderGraph();
            renderEditors();
        }

        // 1. Render Graph Bars
        function renderGraph() {
            const graphArea = document.getElementById('graphArea');
            const bars = graphArea.querySelectorAll('.data-group');
            bars.forEach(b => b.remove());

            tasks.forEach(task => {
                const group = document.createElement('div');
                group.className = 'data-group';
                
                const pHeight = priorityHeights[task.priority] || "10%";
                const sHeight = statusHeights[task.status] || "10%";

                group.innerHTML = `
                    <div class="due-date-tag">📅 ${task.dueDate}</div>
                    <div class="bars-container">
                        <div class="bar bar-priority" style="height: ${pHeight};" title="Priority: ${task.priority}"></div>
                        <div class="bar bar-status" style="height: ${sHeight};" title="Status: ${task.status}"></div>
                    </div>
                    <div class="x-labels">
                        <span class="x-priority">${task.priority}</span>
                        <span class="x-type">${task.type}</span>
                    </div>
                `;
                graphArea.appendChild(group);
            });
        }

        // 2. Render Editors (with Delete & Edit Name)
        function renderEditors() {
            const editorArea = document.getElementById('editorArea');
            editorArea.innerHTML = '';

            tasks.forEach((task, index) => {
                const card = document.createElement('div');
                card.className = 'editor-card';
                
                card.innerHTML = `
                    <div class="editor-card-header">
                        <input type="text" class="task-name-edit" value="${task.name}" onchange="updateTaskData(${index}, 'name', this.value)" placeholder="Task Name">
                        <button class="delete-btn" onclick="deleteTask(${index})" title="Delete Task">✕</button>
                    </div>
                    
                    <select class="interactive-select" onchange="updateTaskDropdown(${index}, 'priority', this)">
                        <option value="High" ${task.priority === 'High' ? 'selected' : ''}>🔥 Priority: High</option>
                        <option value="Medium" ${task.priority === 'Medium' ? 'selected' : ''}>⚡ Priority: Medium</option>
                        <option value="Low" ${task.priority === 'Low' ? 'selected' : ''}>🧊 Priority: Low</option>
                    </select>
                    
                    <select class="interactive-select" onchange="updateTaskDropdown(${index}, 'status', this)">
                        <option value="Done" ${task.status === 'Done' ? 'selected' : ''}>✅ Status: Done</option>
                        <option value="In Progress" ${task.status === 'In Progress' ? 'selected' : ''}>⏳ Status: In Progress</option>
                        <option value="Not Started" ${task.status === 'Not Started' ? 'selected' : ''}>❌ Status: Not Started</option>
                    </select>
                `;
                editorArea.appendChild(card);
            });
        }

        // 3. Add & Delete Functions
        function addTask() {
            if (tasks.length >= 8) {
                document.getElementById('limitModal').classList.add('active');
                return;
            }
            tasks.push({
                id: Date.now(),
                name: "New Task",
                dueDate: "TBD",
                priority: "Low",
                status: "Not Started",
                type: "Custom"
            });
            initGraph();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            initGraph();
        }

        function closeModal() {
            document.getElementById('limitModal').classList.remove('active');
        }

        // 4. Update Handlers
        function updateTaskData(index, field, value) {
            tasks[index][field] = value;
            renderGraph();
        }

        function updateTaskDropdown(index, field, selectElement) {
            selectElement.classList.remove('animating');
            void selectElement.offsetWidth; // trigger reflow
            selectElement.classList.add('animating');
            tasks[index][field] = selectElement.value;
            renderGraph();
        }

        function updateLabels() {
            document.getElementById('yLabelDisplay').innerText = document.getElementById('yAxisName').value;
            document.getElementById('xLabelDisplay').innerText = document.getElementById('xAxisName').value;
        }

        // 5. Dynamic Theme Color Logic Converter
        function hexToRgb(hex) {
            let bigint = parseInt(hex.replace('#', ''), 16);
            let r = (bigint >> 16) & 255;
            let g = (bigint >> 8) & 255;
            let b = bigint & 255;
            return `${r}, ${g}, ${b}`;
        }

        function updateThemeColor() {
            const hex = document.getElementById('themeColorPicker').value;
            const rgb = hexToRgb(hex);
            
            // Updates CSS variables globally for the whole widget!
            document.documentElement.style.setProperty('--theme-hex', hex);
            document.documentElement.style.setProperty('--theme-rgb', rgb);
        }

        // Run on load
        window.onload = initGraph;
    </script>
</body>
</html>
