<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Perspective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --notion: #191919;
      --gold: #C4A484;
      --gold-light: #D9C3A8;
      --dark: #141210;
      --text: #EDE6DC;
      --muted: #8C8278;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--notion);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .widget {
      width: 100%;
      max-width: 420px;
      background: rgba(20, 18, 16, 0.48);
      backdrop-filter: blur(34px) saturate(150%);
      -webkit-backdrop-filter: blur(34px) saturate(150%);
      border: 1px solid rgba(196, 164, 132, 0.07);
      border-radius: 32px;
      padding: 22px 20px 18px;
      box-shadow: 0 18px 50px -20px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(16px);
      animation: enter 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes enter {
      to { opacity: 1; transform: translateY(0); }
    }

    .widget::before {
      content: "";
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 50%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196,164,132,0.2), transparent);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 18px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab.active {
      background: rgba(196, 164, 132, 0.12);
      color: var(--gold-light);
    }

    .panel { display: none; }
    .panel.active {
      display: block;
      animation: fadePanel 0.4s ease;
    }

    @keyframes fadePanel {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== WATCH PANEL ===== */
    .real-time {
      text-align: center;
      margin-bottom: 12px;
    }
    .real-time .time {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 500;
      color: var(--gold-light);
      letter-spacing: 0.03em;
    }
    .real-time .date {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
      letter-spacing: 0.06em;
    }

    .stage {
      position: relative;
      width: 270px;
      height: 270px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .watch {
      position: relative;
      width: 230px;
      height: 230px;
      transition: all 1.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .watch.level-1 { width: 250px; height: 250px; }
    .watch.level-2 { width: 265px; height: 265px; }
    .watch.level-3 { width: 280px; height: 280px; }

    .watch svg { width: 100%; height: 100%; overflow: visible; }

    .layer { transition: all 1.15s cubic-bezier(0.16, 1, 0.3, 1); }
    .layer-deep {
      opacity: 0;
      transform-origin: 150px 150px;
      transform: scale(0.88);
    }

    .watch.level-1 .layer-day,
    .watch.level-2 .layer-day,
    .watch.level-3 .layer-day { opacity: 1; transform: scale(1); }

    .watch.level-2 .layer-week,
    .watch.level-3 .layer-week { opacity: 1; transform: scale(1); }

    .watch.level-3 .layer-month { opacity: 1; transform: scale(1); }

    .controls {
      display: flex;
      gap: 7px;
      justify-content: center;
    }

    .ctrl {
      flex: 1;
      height: 40px;
      border-radius: 11px;
      border: 1px solid rgba(196, 164, 132, 0.14);
      background: rgba(255,255,255,0.025);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
    }

    .ctrl span { font-size: 10px; opacity: 0.7; }

    .ctrl:hover {
      background: rgba(196, 164, 132, 0.08);
      border-color: rgba(196, 164, 132, 0.28);
      color: var(--gold-light);
    }

    .ctrl.active {
      background: rgba(196, 164, 132, 0.14);
      border-color: rgba(196, 164, 132, 0.4);
      color: var(--gold-light);
      box-shadow: 0 0 20px rgba(196, 164, 132, 0.12);
    }

    /* ===== WORK PANEL ===== */
    .work-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .work-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 500;
      color: var(--gold-light);
    }

    .insight {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
      padding: 10px 12px;
      background: rgba(196, 164, 132, 0.06);
      border-radius: 10px;
      border-left: 2px solid rgba(196, 164, 132, 0.3);
    }

    .values-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .value-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(196, 164, 132, 0.1);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .value-card:hover {
      background: rgba(196, 164, 132, 0.07);
      border-color: rgba(196, 164, 132, 0.22);
    }

    .value-card.active {
      background: rgba(196, 164, 132, 0.12);
      border-color: rgba(196, 164, 132, 0.35);
    }

    .value-num {
      font-size: 18px;
      font-weight: 500;
      color: var(--gold-light);
    }

    .value-label {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.05em;
    }

    .reflect-box {
      margin-bottom: 14px;
    }

    .reflect-box label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .reflect-box textarea {
      width: 100%;
      height: 64px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(196, 164, 132, 0.12);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      padding: 10px 12px;
      resize: none;
      outline: none;
      font-family: inherit;
    }

    .reflect-box textarea:focus {
      border-color: rgba(196, 164, 132, 0.3);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .action-btn {
      flex: 1;
      height: 36px;
      border-radius: 9px;
      border: 1px solid rgba(196, 164, 132, 0.18);
      background: rgba(255,255,255,0.03);
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .action-btn:hover {
      background: rgba(196, 164, 132, 0.1);
      border-color: rgba(196, 164, 132, 0.3);
    }

    .history {
      max-height: 110px;
      overflow-y: auto;
    }

    .history-title {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: var(--text);
    }

    .history-item span:last-child {
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="tabs">
      <div class="tab active" data-panel="watch">Watch</div>
      <div class="tab" data-panel="work">Work</div>
    </div>

    <!-- WATCH PANEL -->
    <div class="panel active" id="panel-watch">
      <div class="real-time">
        <div class="time" id="realTime">00:00</div>
        <div class="date" id="realDate">—</div>
      </div>

      <div class="stage">
        <div class="watch" id="watch">
          <svg viewBox="0 0 300 300" fill="none">
            <circle cx="150" cy="150" r="145" stroke="rgba(196,164,132,0.2)" stroke-width="2.5"/>
            <circle cx="150" cy="150" r="139" stroke="rgba(196,164,132,0.08)" stroke-width="1"/>
            <circle cx="150" cy="150" r="132" fill="#1A1815" stroke="rgba(196,164,132,0.12)" stroke-width="1"/>

            <g class="layer">
              <path d="M78 105 Q150 85 222 105" stroke="rgba(196,164,132,0.28)" stroke-width="4" fill="none"/>
              <path d="M82 195 Q150 215 218 195" stroke="rgba(196,164,132,0.22)" stroke-width="3.5" fill="none"/>
              <rect x="140" y="62" width="20" height="176" rx="4" fill="#2A2622" stroke="rgba(196,164,132,0.22)"/>
              <path d="M95 150 H205" stroke="rgba(196,164,132,0.15)" stroke-width="2"/>
              <circle cx="90" cy="102" r="4.5" fill="#3A342F" stroke="rgba(196,164,132,0.45)" stroke-width="0.9"/>
              <circle cx="210" cy="102" r="4.5" fill="#3A342F" stroke="rgba(196,164,132,0.45)" stroke-width="0.9"/>
              <circle cx="90" cy="198" r="4.5" fill="#3A342F" stroke="rgba(196,164,132,0.45)" stroke-width="0.9"/>
              <circle cx="210" cy="198" r="4.5" fill="#3A342F" stroke="rgba(196,164,132,0.45)" stroke-width="0.9"/>
              <circle cx="150" cy="70" r="4" fill="#3A342F" stroke="rgba(196,164,132,0.4)" stroke-width="0.8"/>
              <circle cx="150" cy="230" r="4" fill="#3A342F" stroke="rgba(196,164,132,0.4)" stroke-width="0.8"/>
            </g>

            <g class="layer layer-deep layer-day">
              <g transform="translate(150 150)">
                <circle r="52" fill="#25211E" stroke="rgba(196,164,132,0.32)" stroke-width="1.4"/>
                <circle r="42" fill="none" stroke="rgba(196,164,132,0.14)" stroke-width="0.9"/>
                <circle r="14" fill="#1A1815" stroke="rgba(196,164,132,0.4)" stroke-width="1.1"/>
                <circle r="5.5" fill="rgba(196,164,132,0.65)"/>
                <g stroke="rgba(196,164,132,0.4)" stroke-width="2.2">
                  <path d="M0-52L0-59M0 52L0 59M52 0L59 0M-52 0L-59 0"/>
                  <path d="M36.8-36.8L41.5-41.5M36.8 36.8L41.5 41.5M-36.8 36.8L-41.5 41.5M-36.8-36.8L-41.5-41.5"/>
                </g>
              </g>
              <g transform="translate(92 138)">
                <circle r="31" fill="#25211E" stroke="rgba(196,164,132,0.3)" stroke-width="1.2"/>
                <circle r="21" fill="none" stroke="rgba(196,164,132,0.12)"/>
                <circle r="8" fill="#1A1815" stroke="rgba(196,164,132,0.38)"/>
                <circle r="3.2" fill="rgba(196,164,132,0.55)"/>
              </g>
              <g transform="translate(205 155)">
                <circle r="24" fill="#25211E" stroke="rgba(196,164,132,0.28)" stroke-width="1.1"/>
                <circle r="15" fill="none" stroke="rgba(196,164,132,0.12)"/>
                <circle r="6" fill="#1A1815" stroke="rgba(196,164,132,0.35)"/>
                <circle r="2.5" fill="rgba(196,164,132,0.5)"/>
              </g>
            </g>

            <g class="layer layer-deep layer-week">
              <g transform="translate(170 92)">
                <circle r="25" fill="#25211E" stroke="rgba(196,164,132,0.3)" stroke-width="1.1"/>
                <circle r="16" fill="none" stroke="rgba(196,164,132,0.12)"/>
                <circle r="6.5" fill="#1A1815" stroke="rgba(196,164,132,0.38)"/>
                <circle r="2.6" fill="rgba(196,164,132,0.55)"/>
              </g>
              <g transform="translate(108 195)">
                <circle r="27" fill="#25211E" stroke="rgba(196,164,132,0.28)" stroke-width="1.1"/>
                <circle r="17" fill="none" stroke="rgba(196,164,132,0.12)"/>
                <circle r="7" fill="#1A1815" stroke="rgba(196,164,132,0.35)"/>
                <circle r="2.8" fill="rgba(196,164,132,0.5)"/>
              </g>
              <circle cx="125" cy="90" r="3.2" fill="#3A342F" stroke="rgba(196,164,132,0.42)" stroke-width="0.7"/>
              <circle cx="185" cy="210" r="3.2" fill="#3A342F" stroke="rgba(196,164,132,0.42)" stroke-width="0.7"/>
            </g>

            <g class="layer layer-deep layer-month">
              <g transform="translate(195 195)">
                <circle r="20" fill="#25211E" stroke="rgba(196,164,132,0.3)" stroke-width="1"/>
                <circle r="12" fill="none" stroke="rgba(196,164,132,0.12)"/>
                <circle r="4.5" fill="#1A1815" stroke="rgba(196,164,132,0.4)"/>
                <circle r="1.8" fill="rgba(196,164,132,0.55)"/>
              </g>
              <g transform="translate(85 95)">
                <circle r="18" fill="#25211E" stroke="rgba(196,164,132,0.28)" stroke-width="1"/>
                <circle r="11" fill="none" stroke="rgba(196,164,132,0.12)"/>
                <circle r="4" fill="#1A1815" stroke="rgba(196,164,132,0.38)"/>
                <circle r="1.6" fill="rgba(196,164,132,0.5)"/>
              </g>
              <circle cx="135" cy="125" r="2.4" fill="#3A342F" stroke="rgba(196,164,132,0.45)" stroke-width="0.6"/>
              <circle cx="165" cy="175" r="2.4" fill="#3A342F" stroke="rgba(196,164,132,0.45)" stroke-width="0.6"/>
            </g>

            <g id="hands">
              <line id="handHour" x1="150" y1="150" x2="150" y2="92" stroke="url(#goldGrad)" stroke-width="3.8" stroke-linecap="round"/>
              <line id="handMinute" x1="150" y1="150" x2="150" y2="72" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
              <line id="handSecond" x1="150" y1="150" x2="150" y2="65" stroke="#D9C3A8" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
              <circle cx="150" cy="150" r="7" fill="#C4A484"/>
              <circle cx="150" cy="150" r="3" fill="#1A1815"/>
            </g>

            <defs>
              <linearGradient id="goldGrad" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#A88B6A"/>
                <stop offset="100%" stop-color="#D9C3A8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" data-level="1" id="btnDay">Day <span id="valDay">100%</span></button>
        <button class="ctrl" data-level="2" id="btnWeek">Week <span id="valWeek">—</span></button>
        <button class="ctrl" data-level="3" id="btnMonth">Month <span id="valMonth">13%</span></button>
      </div>
    </div>

    <!-- WORK PANEL -->
    <div class="panel" id="panel-work">
      <div class="work-header">
        <h2>Perspective Work</h2>
      </div>

      <div class="insight" id="insight">
        Your Day is fully present. Month still feels distant.
      </div>

      <div class="values-grid">
        <div class="value-card" data-key="day">
          <div class="value-num" id="workDay">100%</div>
          <div class="value-label">DAY</div>
        </div>
        <div class="value-card" data-key="week">
          <div class="value-num" id="workWeek">—</div>
          <div class="value-label">WEEK</div>
        </div>
        <div class="value-card" data-key="month">
          <div class="value-num" id="workMonth">13%</div>
          <div class="value-label">MONTH</div>
        </div>
      </div>

      <div class="reflect-box">
        <label id="reflectLabel">Reflection — Day</label>
        <textarea id="reflectInput" placeholder="What does this percentage mean to you right now?"></textarea>
      </div>

      <div class="actions">
        <button class="action-btn" id="resetDay">Reset Day</button>
        <button class="action-btn" id="focusDay">Focus Mode</button>
      </div>

      <div class="history">
        <div class="history-title">RECENT CHANGES</div>
        <div id="historyList"></div>
      </div>
    </div>
  </div>

  <script>
    let currentLevel = 0;
    let values = { day: 100, week: null, month: 13 };
    let reflections = { day: '', week: '', month: '' };
    let history = [];
    let activeKey = 'day';

    const watch = document.getElementById('watch');
    const buttons = {
      1: document.getElementById('btnDay'),
      2: document.getElementById('btnWeek'),
      3: document.getElementById('btnMonth')
    };

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
      });
    });

    function updateRealTime() {
      const now = new Date();
      document.getElementById('realTime').textContent = 
        String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      document.getElementById('realDate').textContent = 
        now.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

      const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
      document.getElementById('handHour').setAttribute('transform', `rotate(${h*30 + m*0.5} 150 150)`);
      document.getElementById('handMinute').setAttribute('transform', `rotate(${m*6} 150 150)`);
      document.getElementById('handSecond').setAttribute('transform', `rotate(${s*6} 150 150)`);
    }
    updateRealTime();
    setInterval(updateRealTime, 1000);

    function updateUI() {
      document.getElementById('valDay').textContent = values.day + '%';
      document.getElementById('valWeek').textContent = values.week !== null ? values.week + '%' : '—';
      document.getElementById('valMonth').textContent = values.month + '%';

      document.getElementById('workDay').textContent = values.day + '%';
      document.getElementById('workWeek').textContent = values.week !== null ? values.week + '%' : '—';
      document.getElementById('workMonth').textContent = values.month + '%';

      // Insight
      let insight = '';
      if (values.day >= 90 && values.month < 30) {
        insight = 'Your Day is fully present, but Month still feels distant.';
      } else if (values.day < 50) {
        insight = 'Day perspective is low — you may be living ahead of yourself.';
      } else if (values.week !== null && values.week < 40) {
        insight = 'Week is underweighted. Consider rebalancing.';
      } else {
        insight = 'Your time perspective looks balanced right now.';
      }
      document.getElementById('insight').textContent = insight;

      // History
      const list = document.getElementById('historyList');
      list.innerHTML = history.slice(0, 5).map(h => 
        `<div class="history-item"><span>${h.text}</span><span>${h.time}</span></div>`
      ).join('') || '<div class="history-item"><span>No changes yet</span></div>';
    }

    function setLevel(level) {
      if (currentLevel === level) {
        currentLevel = 0;
        watch.className = 'watch';
        Object.values(buttons).forEach(b => b.classList.remove('active'));
        return;
      }
      currentLevel = level;
      watch.className = 'watch level-' + level;
      Object.values(buttons).forEach(b => b.classList.remove('active'));
      buttons[level].classList.add('active');
    }

    document.getElementById('btnDay').addEventListener('click', () => setLevel(1));
    document.getElementById('btnWeek').addEventListener('click', () => setLevel(2));
    document.getElementById('btnMonth').addEventListener('click', () => setLevel(3));

    // Work panel interactions
    document.querySelectorAll('.value-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.value-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        activeKey = card.dataset.key;
        document.getElementById('reflectLabel').textContent = 
          'Reflection — ' + activeKey.charAt(0).toUpperCase() + activeKey.slice(1);
        document.getElementById('reflectInput').value = reflections[activeKey] || '';
      });
    });

    document.getElementById('reflectInput').addEventListener('change', (e) => {
      reflections[activeKey] = e.target.value;
    });

    document.getElementById('resetDay').addEventListener('click', () => {
      values.day = 100;
      history.unshift({ text: 'Day reset to 100%', time: 'Just now' });
      updateUI();
    });

    document.getElementById('focusDay').addEventListener('click', () => {
      setLevel(1);
      document.querySelector('.tab[data-panel="watch"]').click();
    });

    // Init
    document.querySelector('.value-card[data-key="day"]').classList.add('active');
    updateUI();
  </script>
</body>
</html>
