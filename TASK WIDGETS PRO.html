<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxurious Productivity Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @font-face {
            font-family: 'QUARTZO';
            src: local('QUARTZO'), local('Quartzo');
        }

        :root {
            /* Deep Dark Background */
            --bg-base: #141414;
            --bg-panel: #1a1a1a;
            
            /* Luxurious Glow Colors */
            --theme-color: #e6b95c;
            --theme-rgb: 230, 185, 92;
            --theme-secondary: #ff8c42;
            
            /* UI Elements */
            --text-main: #f5f5f5;
            --text-muted: #8c8c8c;
            --border-radius: 16px;
            --panel-border: rgba(230, 185, 92, 0.15);
            
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'QUARTZO', system-ui, sans-serif;
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 0%, #202020 0%, var(--bg-base) 70%);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes idleGlow {
            0% { box-shadow: 0 0 15px rgba(var(--theme-rgb), 0.1), inset 0 0 10px rgba(var(--theme-rgb), 0.05); }
            50% { box-shadow: 0 0 30px rgba(var(--theme-rgb), 0.2), inset 0 0 20px rgba(var(--theme-rgb), 0.1); }
            100% { box-shadow: 0 0 15px rgba(var(--theme-rgb), 0.1), inset 0 0 10px rgba(var(--theme-rgb), 0.05); }
        }

        .dashboard-container {
            width: 100%;
            max-width: 1350px; /* Scaled down by ~10% */
            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: var(--border-radius);
            padding: 2.2rem;
            animation: idleGlow 4s infinite alternate ease-in-out;
            transition: var(--transition-smooth);
        }

        .dashboard-container:hover {
            box-shadow: 0 0 40px rgba(var(--theme-rgb), 0.35), inset 0 0 20px rgba(var(--theme-rgb), 0.15);
            border-color: rgba(var(--theme-rgb), 0.4);
            animation: none; 
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .controls-group {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.8rem;
            color: var(--theme-color);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(var(--theme-rgb), 0.5);
        }

        input[type="text"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
            width: 200px;
        }

        input[type="text"]:focus {
            border-color: var(--theme-color);
            box-shadow: 0 0 15px rgba(var(--theme-rgb), 0.3);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            padding: 0;
            box-shadow: 0 0 15px rgba(var(--theme-rgb), 0.5);
            transition: var(--transition-smooth);
        }
        
        input[type="color"]:hover { transform: scale(1.1); }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--text-main);
            border-radius: 50%;
        }

        button.primary-btn {
            background: linear-gradient(135deg, var(--theme-color), var(--theme-secondary));
            color: #000;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(var(--theme-rgb), 0.4);
            transition: var(--transition-smooth);
        }

        button.primary-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 35px rgba(var(--theme-rgb), 0.7);
        }

        /* --- Analytics Section --- */
        .analytics-layout {
            display: grid;
            grid-template-columns: 2.8fr 1.2fr;
            gap: 1.5rem;
            margin-bottom: 2.2rem;
        }

        .chart-panel {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: var(--border-radius);
            padding: 1.2rem;
            position: relative;
        }

        .main-radar-chart {
            height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .side-pies {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 420px;
        }

        .pie-container {
            flex: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 10px;
            padding: 0.6rem;
            min-height: 0; /* Prevents flex items from overflowing bounds */
        }

        /* --- Tasks Grid --- */
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.2rem;
        }

        .task-card {
            background: linear-gradient(145deg, rgba(30, 30, 30, 0.8), rgba(20, 20, 20, 0.9));
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 1.2rem;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .task-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--theme-color), transparent);
            opacity: 0.3;
            transition: var(--transition-smooth);
        }

        .task-card:hover {
            transform: translateY(-5px);
            border-color: rgba(var(--theme-rgb), 0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(var(--theme-rgb), 0.15);
        }

        .task-card:hover::before {
            opacity: 1;
            box-shadow: 0 0 10px var(--theme-color);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .task-title-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.05rem;
            font-weight: bold;
            font-family: inherit;
            outline: none;
            width: 80%;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            transition: var(--transition-smooth);
        }

        .btn-delete:hover {
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.8);
            transform: scale(1.2);
        }

        .task-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            background: rgba(0,0,0,0.3);
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .task-row span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        select, input[type="date"] {
            background: transparent;
            border: none;
            color: var(--theme-color);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            text-align: right;
            text-shadow: 0 0 5px rgba(var(--theme-rgb), 0.3);
        }

        select option {
            background: var(--bg-panel);
            color: var(--text-main);
        }

        @media (max-width: 1100px) {
            .analytics-layout { grid-template-columns: 1fr; }
            .side-pies { flex-direction: row; height: 260px; }
        }
        @media (max-width: 768px) {
            .side-pies { flex-direction: column; height: 520px; }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <div class="header">
        <div class="controls-group">
            <div class="input-group">
                <label for="dataset1Name">Dataset 1 Label</label>
                <input type="text" id="dataset1Name" value="Impact (Priority)">
            </div>
            <div class="input-group">
                <label for="dataset2Name">Dataset 2 Label</label>
                <input type="text" id="dataset2Name" value="Progress (Status)">
            </div>
        </div>

        <div class="controls-group">
            <div class="input-group" style="align-items: center;">
                <label for="themeColorPicker">Glow</label>
                <input type="color" id="themeColorPicker" value="#e6b95c" aria-label="Widget Theme Color">
            </div>
            <button class="primary-btn" id="addTaskBtn">
                + Add Task
            </button>
        </div>
    </div>

    <!-- Main Analytics Section -->
    <div class="analytics-layout">
        <!-- Main Edgy Radar Chart -->
        <div class="chart-panel main-radar-chart">
            <canvas id="radarChart"></canvas>
        </div>
        
        <!-- 2 Side Pie Charts with fixed container height constraints -->
        <div class="side-pies">
            <div class="pie-container"><canvas id="statusPie"></canvas></div>
            <div class="pie-container"><canvas id="priorityPie"></canvas></div>
        </div>
    </div>

    <!-- Interactive Tasks -->
    <div class="tasks-grid" id="tasksContainer">
        <!-- JS renders tasks here -->
    </div>

</div>

<script>
    // State
    let tasks = [
        { id: 1, title: 'Genetics Rev', date: '2026-07-26', priority: 'high', status: 'not-start' },
        { id: 2, title: 'Notion Store', date: '2026-07-28', priority: 'low', status: 'not-start' },
        { id: 3, title: 'Algebra Paper', date: '2026-07-25', priority: 'high', status: 'in-progress' },
        { id: 4, title: 'Essay Practice', date: '2026-07-23', priority: 'medium', status: 'done' },
        { id: 5, title: 'Chem Sheet', date: '2026-07-27', priority: 'medium', status: 'not-start' }
    ];

    let radarChart, statusPieChart, priorityPieChart;
    const priorityValues = { 'high': 3, 'medium': 2, 'low': 1 };
    const statusValues = { 'done': 3, 'in-progress': 2, 'not-start': 1 };

    // Utils
    function hexToRgb(hex) {
        let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '230, 185, 92';
    }

    function getThemeRgb() {
        return getComputedStyle(document.documentElement).getPropertyValue('--theme-rgb').trim();
    }

    // Chart.js Glow Plugin
    const glowPlugin = {
        id: 'glowPlugin',
        beforeDatasetsDraw: function(chart) {
            const ctx = chart.ctx;
            ctx.save();
            ctx.shadowColor = `rgba(${getThemeRgb()}, 0.6)`;
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        },
        afterDatasetsDraw: function(chart) {
            chart.ctx.restore();
        }
    };

    function init() {
        Chart.register(glowPlugin);
        Chart.defaults.color = '#8c8c8c';
        Chart.defaults.font.family = "'QUARTZO', sans-serif";
        
        renderTasks();
        initCharts();
        setupEvents();
    }

    // --- Task DOM Rendering ---
    function renderTasks() {
        const container = document.getElementById('tasksContainer');
        container.innerHTML = '';
        
        tasks.forEach((task) => {
            const card = document.createElement('div');
            card.className = 'task-card';
            
            card.innerHTML = `
                <div class="task-header">
                    <input type="text" class="task-title-input" value="${task.title}" 
                           onchange="updateTask(${task.id}, 'title', this.value)">
                    <button class="btn-delete" onclick="deleteTask(${task.id})" title="Delete Task">✖</button>
                </div>
                <div class="task-row">
                    <span>📅 Date</span>
                    <input type="date" value="${task.date}" onchange="updateTask(${task.id}, 'date', this.value)">
                </div>
                <div class="task-row">
                    <span>⚡ Priority</span>
                    <select onchange="updateTask(${task.id}, 'priority', this.value)">
                        <option value="high" ${task.priority === 'high' ? 'selected' : ''}>High</option>
                        <option value="medium" ${task.priority === 'medium' ? 'selected' : ''}>Medium</option>
                        <option value="low" ${task.priority === 'low' ? 'selected' : ''}>Low</option>
                    </select>
                </div>
                <div class="task-row">
                    <span>📊 Status</span>
                    <select onchange="updateTask(${task.id}, 'status', this.value)">
                        <option value="not-start" ${task.status === 'not-start' ? 'selected' : ''}>Not Started</option>
                        <option value="in-progress" ${task.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                        <option value="done" ${task.status === 'done' ? 'selected' : ''}>Done</option>
                    </select>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- Chart Initializations ---
    function initCharts() {
        // 1. Sharper/Edgier Radar Chart (Main)
        const radarCtx = document.getElementById('radarChart').getContext('2d');
        radarChart = new Chart(radarCtx, {
            type: 'radar',
            data: getRadarData(),
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 1200, easing: 'easeOutQuart' },
                elements: {
                    line: { tension: 0, borderWidth: 3 }, // Tension set to 0 makes lines sharp and angular/edgy
                    point: { radius: 5, hoverRadius: 8, backgroundColor: '#141414', borderWidth: 2, pointStyle: 'rectRot' } // Diamond/sharp point shapes
                },
                plugins: {
                    legend: { labels: { color: '#f5f5f5', font: { size: 13 } }, position: 'top' }
                },
                scales: {
                    r: {
                        grid: { color: 'rgba(255, 255, 255, 0.12)', circular: false }, // Circular: false enforces sharp polygonal/edgy grid lines
                        angleLines: { color: 'rgba(255, 255, 255, 0.15)' },
                        pointLabels: { color: '#f5f5f5', font: { size: 12, family: "'QUARTZO', sans-serif" } },
                        ticks: { display: false, min: 0, max: 4 }
                    }
                }
            }
        });

        // Common Pie Options (Compact to avoid overlap)
        const pieOptions = (titleText) => ({
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'right', labels: { boxWidth: 10, font: { size: 9 }, padding: 8 } },
                title: { display: true, text: titleText, color: '#f5f5f5', font: { size: 11 }, padding: { bottom: 4 } }
            },
            cutout: '45%' 
        });

        // 2. Status Pie
        statusPieChart = new Chart(document.getElementById('statusPie').getContext('2d'), {
            type: 'doughnut', data: getStatusData(), options: pieOptions('Task Status')
        });

        // 3. Priority Pie
        priorityPieChart = new Chart(document.getElementById('priorityPie').getContext('2d'), {
            type: 'doughnut', data: getPriorityData(), options: pieOptions('Task Priority')
        });
    }

    // --- Data Generators ---
    function getRadarData() {
        const themeRgb = getThemeRgb();
        
        return {
            labels: tasks.map(t => t.title),
            datasets: [
                {
                    label: document.getElementById('dataset1Name').value,
                    data: tasks.map(t => priorityValues[t.priority]),
                    borderColor: `rgba(${themeRgb}, 1)`,
                    backgroundColor: `rgba(${themeRgb}, 0.2)`,
                    pointBorderColor: `rgba(${themeRgb}, 1)`,
                    fill: true
                },
                {
                    label: document.getElementById('dataset2Name').value,
                    data: tasks.map(t => statusValues[t.status]),
                    borderColor: 'rgba(200, 200, 200, 0.9)',
                    backgroundColor: 'rgba(255, 255, 255, 0.1)',
                    pointBorderColor: 'rgba(200, 200, 200, 1)',
                    fill: true
                }
            ]
        };
    }

    function getStatusData() {
        const themeRgb = getThemeRgb();
        const counts = { 'done': 0, 'in-progress': 0, 'not-start': 0 };
        tasks.forEach(t => counts[t.status]++);
        return {
            labels: ['Done', 'In Prog', 'To Do'],
            datasets: [{
                data: [counts['done'], counts['in-progress'], counts['not-start']],
                backgroundColor: [`rgba(${themeRgb}, 1)`, `rgba(${themeRgb}, 0.5)`, 'rgba(255,255,255,0.1)'],
                borderWidth: 1, borderColor: '#1a1a1a'
            }]
        };
    }

    function getPriorityData() {
        const themeRgb = getThemeRgb();
        const counts = { 'high': 0, 'medium': 0, 'low': 0 };
        tasks.forEach(t => counts[t.priority]++);
        return {
            labels: ['High', 'Med', 'Low'],
            datasets: [{
                data: [counts['high'], counts['medium'], counts['low']],
                backgroundColor: ['#ff4757', `rgba(${themeRgb}, 0.8)`, 'rgba(255,255,255,0.2)'],
                borderWidth: 1, borderColor: '#1a1a1a'
            }]
        };
    }

    // --- Global Updates ---
    function updateAllCharts() {
        radarChart.data = getRadarData();
        radarChart.update();
        
        statusPieChart.data = getStatusData();
        statusPieChart.update();
        
        priorityPieChart.data = getPriorityData();
        priorityPieChart.update();
    }

    // --- Event Listeners ---
    function setupEvents() {
        // Theme Color Changer
        document.getElementById('themeColorPicker').addEventListener('input', (e) => {
            const hex = e.target.value;
            const rgb = hexToRgb(hex);
            
            document.documentElement.style.setProperty('--theme-color', hex);
            document.documentElement.style.setProperty('--theme-rgb', rgb);
            
            updateAllCharts();
        });

        // Add Task
        document.getElementById('addTaskBtn').addEventListener('click', () => {
            const newId = tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
            tasks.push({
                id: newId,
                title: `Task ${newId}`,
                date: new Date().toISOString().split('T')[0],
                priority: 'medium',
                status: 'not-start'
            });
            renderTasks();
            updateAllCharts();
        });

        // Dataset Labels map directly to Radar Legend
        document.getElementById('dataset1Name').addEventListener('input', (e) => {
            radarChart.data.datasets[0].label = e.target.value;
            radarChart.update('none');
        });
        
        document.getElementById('dataset2Name').addEventListener('input', (e) => {
            radarChart.data.datasets[1].label = e.target.value;
            radarChart.update('none');
        });
    }

    window.updateTask = function(id, field, value) {
        const taskIndex = tasks.findIndex(t => t.id === id);
        if (taskIndex > -1) {
            tasks[taskIndex][field] = value;
            updateAllCharts();
        }
    };

    window.deleteTask = function(id) {
        tasks = tasks.filter(t => t.id !== id);
        renderTasks();
        updateAllCharts();
    };

    // Run
    init();
</script>
</body>
</html>
