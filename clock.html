<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Minimalist Flip Clock</title>
    
    <!-- DM Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --notion-dark: #191919;
            --card-bg: #121215;
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-top: rgba(255, 255, 255, 0.22);
            --text-shiny: #ffffff;
            --text-glow: 0 0 25px rgba(255, 255, 255, 0.4), 0 0 50px rgba(255, 255, 255, 0.15);
            --accent-red: #f43f5e;
            --widget-glow: 0 0 40px rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif !important;
        }

        body {
            background-color: var(--notion-dark);
            color: var(--text-shiny);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        @keyframes floatCard {
            0% {
                transform: translateY(0px);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            }
            50% {
                transform: translateY(-6px);
                box-shadow: 0 28px 50px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.25), var(--widget-glow);
            }
            100% {
                transform: translateY(0px);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            }
        }

        .clock-container {
            width: 100%;
            max-width: 360px;
            background: rgba(22, 22, 26, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-top: 1px solid var(--card-border-top);
            border-radius: 28px;
            padding: 28px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: relative;
            overflow: hidden;
            animation: floatCard 6s ease-in-out infinite;
        }

        /* Time Display Group */
        .time-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Flip Card Unit */
        .flip-card {
            position: relative;
            width: 62px;
            height: 92px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-shiny);
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.8), 0 8px 16px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* Split Line in Flip Card */
        .flip-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
            z-index: 2;
        }

        .flip-card span {
            text-shadow: var(--text-glow);
            transform: translateY(-2px);
        }

        /* Flipping Animation Class */
        .flip-card.flipping {
            animation: flipNum 0.4s ease-in-out;
        }

        @keyframes flipNum {
            0% { transform: scaleY(1); opacity: 1; }
            50% { transform: scaleY(0.1); opacity: 0.5; filter: brightness(1.5); }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* Colon Separator */
        .colon {
            font-size: 3rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            animation: pulseColon 2s ease-in-out infinite;
            margin-top: -4px;
        }

        @keyframes pulseColon {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }

        /* Side Info (Day & Date) */
        .side-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            padding-right: 4px;
        }

        .day-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
        }

        .date-text {
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <!-- Flip Clock Numbers -->
        <div class="time-group">
            <div class="flip-card" id="h1"><span id="h1-val">0</span></div>
            <div class="flip-card" id="h2"><span id="h2-val">0</span></div>
            <div class="colon">:</div>
            <div class="flip-card" id="m1"><span id="m1-val">0</span></div>
            <div class="flip-card" id="m2"><span id="m2-val">0</span></div>
        </div>

        <!-- Side Date & Day Display -->
        <div class="side-info">
            <span class="day-text" id="dayText">MON</span>
            <span class="date-text" id="dateText">2026.07.24</span>
        </div>
    </div>

    <script>
        let prevTime = "";

        function updateClock() {
            const now = new Date();
            
            // Format time components
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            const timeString = hours + minutes;

            // Update digits with flip animation trigger if changed
            updateDigit('h1', hours[0], timeString[0] !== prevTime[0]);
            updateDigit('h2', hours[1], timeString[1] !== prevTime[1]);
            updateDigit('m1', minutes[0], timeString[2] !== prevTime[2]);
            updateDigit('m2', minutes[1], timeString[3] !== prevTime[3]);

            prevTime = timeString;

            // Update Day and Date
            const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            document.getElementById('dayText').innerText = days[now.getDay()];
            
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            document.getElementById('dateText').innerText = `${year}.${month}.${date}`;
        }

        function updateDigit(id, newValue, hasChanged) {
            const card = document.getElementById(id);
            const span = document.getElementById(id + '-val');
            
            if (span.innerText !== newValue) {
                span.innerText = newValue;
                card.classList.add('flipping');
                setTimeout(() => {
                    card.classList.remove('flipping');
                }, 400);
            }
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
