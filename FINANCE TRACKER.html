<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Pulse Widget</title>
  <style>
    @font-face {
      font-family: 'Birds of Paradise';
      src: local('Birds of Paradise'), local('Birds of paradise');
    }

    :root {
      --notion-bg: #191919;
      --widget-bg: #172a1d;
      --card-glass: rgba(12, 24, 16, 0.55);
      --glass-border: rgba(52, 211, 153, 0.12);
      --glass-glow: rgba(52, 211, 153, 0.08);
      
      --text-primary: #F5F5F2;
      --text-secondary: #757B78;
      --text-muted: #454B48;
      
      --emerald-line: #34D399;
      --emerald-glow: rgba(52, 211, 153, 0.35);
      --pill-green-bg: rgba(16, 185, 129, 0.14);
      --pill-green-text: #34D399;
      
      --pill-yellow-bg: rgba(245, 158, 11, 0.14);
      --pill-yellow-text: #FBBF24;
      
      --pill-red-bg: rgba(239, 68, 68, 0.14);
      --pill-red-text: #F87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Birds of Paradise", cursive, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--notion-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      color: var(--text-primary);
    }

    /* Main Container */
    .widget-container {
      width: 100%;
      max-width: 1100px;
      background: radial-gradient(130% 120% at 50% 0%, #1e3827 0%, var(--widget-bg) 50%, #0c1610 100%);
      border-radius: 44px;
      padding: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.1),
        0 0 80px -20px var(--glass-glow);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
    }

    /* Subtle ambient glowing background aura */
    .widget-container::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Header Section */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      position: relative;
      z-index: 2;
    }

    .brand-title {
      font-size: 16px; /* slightly increased for script readability */
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .currency-toggle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .currency-toggle:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.1);
    }

    .primary-balance {
      font-size: 68px;
      font-weight: 400;
      letter-spacing: -1.5px;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 12px;
    }

    .decimal-part {
      opacity: 0.35;
      font-size: 0.85em;
    }

    .trend-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      background-color: var(--pill-green-bg);
      color: var(--pill-green-text);
      font-size: 16px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(52, 211, 153, 0.15);
    }

    /* Timeframe Selector & Status */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .health-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 100px;
      background: var(--card-glass);
      border: 1px solid var(--glass-border);
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 10px #10B981;
    }

    .timeframe-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 100px;
      border: 1px solid var(--glass-border);
    }

    .tf-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tf-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* Chart Section */
    .chart-container {
      position: relative;
      width: 100%;
      height: 280px;
      margin: 16px 0 28px 0;
    }

    svg.chart-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .grid-line {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-dasharray: 4 4;
      stroke-width: 1;
    }

    .chart-path-bg {
      fill: url(#chart-gradient);
    }

    .chart-path-line {
      fill: none;
      stroke: var(--emerald-line);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0px 4px 12px var(--emerald-glow));
      transition: d 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .x-axis-label {
      font-size: 14px;
      fill: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
      text-anchor: middle;
    }

    /* Hover Interactive Elements */
    .hover-point {
      fill: var(--emerald-line);
      stroke: #0c1610;
      stroke-width: 3px;
      r: 6;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      filter: drop-shadow(0 0 8px var(--emerald-line));
    }

    .hover-line {
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1;
      stroke-dasharray: 3 3;
      opacity: 0;
      pointer-events: none;
    }

    .chart-tooltip {
      position: absolute;
      background: rgba(15, 23, 18, 0.92);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 14px;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -120%);
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      z-index: 10;
      min-width: 120px;
    }

    .tooltip-date {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .tooltip-val {
      font-size: 18px;
      color: #F5F5F2;
      font-weight: 600;
    }

    .tooltip-change {
      font-size: 14px;
      color: var(--emerald-line);
      margin-top: 2px;
      font-weight: 500;
    }

    /* Metrics Strip */
    .metrics-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 24px;
    }

    .metric-card {
      background: var(--card-glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 18px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .metric-card:hover {
      border-color: rgba(52, 211, 153, 0.25);
      background: rgba(18, 36, 25, 0.65);
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .metric-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .metric-input-wrapper {
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .currency-symbol {
      font-size: 20px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .metric-input {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 26px;
      font-weight: 500;
      width: 100%;
      outline: none;
      transition: color 0.2s;
    }

    .metric-input:focus {
      color: var(--emerald-line);
    }

    .metric-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .rate-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--emerald-line);
      border-radius: 4px;
      width: 36px;
      text-align: center;
      font-size: 14px;
      outline: none;
    }

    /* Responsive scaling */
    @media (max-width: 850px) {
      .widget-container { padding: 32px; border-radius: 32px; }
      .primary-balance { font-size: 52px; }
      .header-row { flex-direction: column; gap: 16px; }
      .metrics-strip { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 500px) {
      .metrics-strip { grid-template-columns: 1fr; }
      .primary-balance { font-size: 40px; }
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- Header Row -->
    <div class="header-row">
      <div>
        <div class="brand-title">
          <span>Student Financial Health</span>
          <button class="currency-toggle" id="curr-toggle" onclick="toggleCurrency()">$ USD</button>
        </div>
        <div class="primary-balance" id="main-balance">
          $20,000<span class="decimal-part">.63</span>
        </div>
        <div class="trend-badge" id="trend-badge">
          <span>↑</span> <span id="trend-text">+$1,500 in the last 14 days</span>
        </div>
      </div>

      <div class="controls-row">
        <div class="health-indicator">
          <span class="status-dot" id="health-dot"></span>
          <span id="health-text">Financial Health: Healthy</span>
        </div>

        <div class="timeframe-selector">
          <button class="tf-btn" onclick="updateChart('7D', this)">7D</button>
          <button class="tf-btn active" onclick="updateChart('14D', this)">14D</button>
          <button class="tf-btn" onclick="updateChart('30D', this)">30D</button>
          <button class="tf-btn" onclick="updateChart('3M', this)">3M</button>
          <button class="tf-btn" onclick="updateChart('6M', this)">6M</button>
          <button class="tf-btn" onclick="updateChart('ALL', this)">ALL</button>
        </div>
      </div>
    </div>

    <!-- Chart Container -->
    <div class="chart-container" id="chart-wrapper">
      <div class="chart-tooltip" id="tooltip">
        <div class="tooltip-date" id="tt-date">18 AUG</div>
        <div class="tooltip-val" id="tt-val">$20,000</div>
        <div class="tooltip-change" id="tt-change">+$75 vs avg</div>
      </div>

      <svg class="chart-svg" id="chart-svg" viewBox="0 0 900 240" preserveAspectRatio="none">
        <defs>
          <linearGradient id="chart-gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#34D399" stop-opacity="0.28" />
            <stop offset="100%" stop-color="#34D399" stop-opacity="0.0" />
          </linearGradient>
        </defs>

        <!-- Subtle horizontal grid lines -->
        <line x1="0" y1="40" x2="900" y2="40" class="grid-line" />
        <line x1="0" y1="100" x2="900" y2="100" class="grid-line" />
        <line x1="0" y1="160" x2="900" y2="160" class="grid-line" />

        <!-- Area Fill & Smooth Line -->
        <path id="chart-bg-path" class="chart-path-bg" d="" />
        <path id="chart-line-path" class="chart-path-line" d="" />

        <!-- Hover Guideline & Point -->
        <line id="hover-line" class="hover-line" x1="0" y1="0" x2="0" y2="200" />
        <circle id="hover-point" class="hover-point" cx="0" cy="0" />

        <!-- X Axis Labels Group -->
        <g id="x-axis-group"></g>
      </svg>
    </div>

    <!-- Metrics Strip -->
    <div class="metrics-strip">
      <!-- Income -->
      <div class="metric-card">
        <div class="metric-header">
          <span class="metric-label">Income</span>
          <span style="color: var(--emerald-line); font-size: 12px;">↓</span>
        </div>
        <div class="metric-input-wrapper">
          <span class="currency-symbol">$</span>
          <input type="number" id="input-income" class="metric-input" value="35000" oninput="calculateFinancials()" />
        </div>
        <div class="metric-sub">This month</div>
      </div>

      <!-- Expenses -->
      <div class="metric-card">
        <div class="metric-header">
          <span class="metric-label">Expenses</span>
          <span style="color: #F87171; font-size: 12px;">↑</span>
        </div>
        <div class="metric-input-wrapper">
          <span class="currency-symbol">$</span>
          <input type="number" id="input-expense" class="metric-input" value="10800" oninput="calculateFinancials()" />
        </div>
        <div class="metric-sub">Budgeted spend</div>
      </div>

      <!-- Savings -->
      <div class="metric-card">
        <div class="metric-header">
          <span class="metric-label">Savings</span>
          <span style="color: var(--text-secondary); font-size: 11px;">
            <input type="number" id="input-rate" class="rate-input" value="28" min="0" max="100" oninput="calculateFinancials()" />%
          </span>
        </div>
        <div class="metric-input-wrapper">
          <span class="currency-symbol">$</span>
          <input type="text" id="display-savings" class="metric-input" value="9800" readonly style="opacity: 0.9;" />
        </div>
        <div class="metric-sub">Auto-allocated</div>
      </div>

      <!-- Available -->
      <div class="metric-card">
        <div class="metric-header">
          <span class="metric-label">Available</span>
          <span style="color: var(--emerald-line); font-size: 12px;">★</span>
        </div>
        <div class="metric-input-wrapper">
          <span class="currency-symbol">$</span>
          <input type="text" id="display-available" class="metric-input" value="14400" readonly style="color: var(--emerald-line);" />
        </div>
        <div class="metric-sub">Net remaining</div>
      </div>
    </div>
  </div>

  <script>
    // Config & Datasets
    let currentCurrency = '$';

    const datasets = {
      '7D': {
        labels: ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'],
        data: [19200, 19800, 19400, 19500, 20100, 19900, 20000.63],
        dates: ['12 Aug', '13 Aug', '14 Aug', '15 Aug', '16 Aug', '17 Aug', '18 Aug'],
        trend: '+$800 this week'
      },
      '14D': {
        labels: ['05 AUG', '07 AUG', '09 AUG', '11 AUG', '13 AUG', '15 AUG', '18 AUG'],
        data: [18500, 19400, 18900, 19100, 19800, 19600, 20000.63],
        dates: ['05 Aug', '07 Aug', '09 Aug', '11 Aug', '13 Aug', '15 Aug', '18 Aug'],
        trend: '+$1,500 in the last 14 days'
      },
      '30D': {
        labels: ['20 JUL', '25 JUL', '30 JUL', '04 AUG', '09 AUG', '14 AUG', '18 AUG'],
        data: [16800, 18200, 17500, 17800, 19200, 18900, 20000.63],
        dates: ['20 Jul', '25 Jul', '30 Jul', '04 Aug', '09 Aug', '14 Aug', '18 Aug'],
        trend: '+$3,200 this month'
      },
      '3M': {
        labels: ['JUN', 'JUL', 'AUG'],
        data: [14200, 16500, 15800, 16000, 18500, 17900, 20000.63],
        dates: ['15 Jun', '01 Jul', '15 Jul', '01 Aug', '10 Aug', '15 Aug', '18 Aug'],
        trend: '+$5,800 last 3 months'
      },
      '6M': {
        labels: ['MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG'],
        data: [11000, 13500, 12800, 15000, 17200, 16800, 20000.63],
        dates: ['Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug 10', 'Aug 18'],
        trend: '+$9,000 last 6 months'
      },
      'ALL': {
        labels: ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG'],
        data: [8500, 11200, 10100, 12400, 11800, 15500, 17800, 20000.63],
        dates: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'],
        trend: '+135% all time'
      }
    };

    let activeTF = '14D';

    function toggleCurrency() {
      currentCurrency = currentCurrency === '$' ? '৳' : '$';
      document.getElementById('curr-toggle').innerText = currentCurrency === '$' ? '$ USD' : '৳ BDT';
      document.querySelectorAll('.currency-symbol').forEach(el => el.innerText = currentCurrency);
      
      calculateFinancials();
      renderChart(activeTF);
    }

    // Dynamic Calculation & Financial Health Engine
    function calculateFinancials() {
      const income = parseFloat(document.getElementById('input-income').value) || 0;
      const expense = parseFloat(document.getElementById('input-expense').value) || 0;
      const rate = parseFloat(document.getElementById('input-rate').value) || 0;

      const savings = (income * (rate / 100));
      const available = income - expense - savings;

      document.getElementById('display-savings').value = Math.round(savings).toLocaleString();
      document.getElementById('display-available').value = Math.round(available).toLocaleString();

      // Financial Health Calculation
      const healthDot = document.getElementById('health-dot');
      const healthText = document.getElementById('health-text');

      const savingsRatio = income > 0 ? (savings / income) : 0;
      const expenseRatio = income > 0 ? (expense / income) : 0;

      if (available >= 0 && savingsRatio >= 0.20 && expenseRatio <= 0.60) {
        healthDot.style.backgroundColor = '#10B981';
        healthDot.style.boxShadow = '0 0 10px #10B981';
        healthText.innerText = 'Financial Health: Healthy';
      } else if (available >= 0 && (savingsRatio >= 0.10 || expenseRatio <= 0.75)) {
        healthDot.style.backgroundColor = '#FBBF24';
        healthDot.style.boxShadow = '0 0 10px #FBBF24';
        healthText.innerText = 'Financial Health: Watch';
      } else {
        healthDot.style.backgroundColor = '#F87171';
        healthDot.style.boxShadow = '0 0 10px #F87171';
        healthText.innerText = 'Financial Health: At Risk';
      }

      // Update main balance formatted
      const latestVal = datasets[activeTF].data[datasets[activeTF].data.length - 1];
      document.getElementById('main-balance').innerHTML = `${currentCurrency}${Math.floor(latestVal).toLocaleString()}<span class="decimal-part">.63</span>`;
    }

    // Bezier Curve Spline Generator
    function getBezierPath(points) {
      if (points.length < 2) return '';
      let path = `M ${points[0].x} ${points[0].y}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i === 0 ? i : i - 1];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] ? points[i + 2] : p2;

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        path += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
      }
      return path;
    }

    // Render SVG Chart
    let currentPoints = [];

    function renderChart(tf) {
      activeTF = tf;
      const dataset = datasets[tf];
      document.getElementById('trend-text').innerText = dataset.trend;

      const svgWidth = 900;
      const svgHeight = 200; // Chart drawing area height
      const paddingY = 30;

      const minVal = Math.min(...dataset.data) * 0.95;
      const maxVal = Math.max(...dataset.data) * 1.03;

      currentPoints = dataset.data.map((val, idx) => {
        const x = (idx / (dataset.data.length - 1)) * svgWidth;
        const y = svgHeight - paddingY - ((val - minVal) / (maxVal - minVal)) * (svgHeight - 2 * paddingY);
        return { x, y, val, label: dataset.labels[idx], date: dataset.dates[idx] };
      });

      // Line Path
      const curvePath = getBezierPath(currentPoints);
      document.getElementById('chart-line-path').setAttribute('d', curvePath);

      // Area Fill Path
      const bgPath = `${curvePath} L ${svgWidth} ${svgHeight} L 0 ${svgHeight} Z`;
      document.getElementById('chart-bg-path').setAttribute('d', bgPath);

      // Render X-Axis Labels
      const xAxisGroup = document.getElementById('x-axis-group');
      xAxisGroup.innerHTML = '';
      currentPoints.forEach((pt) => {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pt.x);
        text.setAttribute('y', svgHeight + 24);
        text.setAttribute('class', 'x-axis-label');
        text.textContent = pt.label;
        xAxisGroup.appendChild(text);
      });
    }

    function updateChart(tf, btn) {
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderChart(tf);
    }

    // Hover Interaction Setup
    const wrapper = document.getElementById('chart-wrapper');
    const hoverPoint = document.getElementById('hover-point');
    const hoverLine = document.getElementById('hover-line');
    const tooltip = document.getElementById('tooltip');

    wrapper.addEventListener('mousemove', (e) => {
      const rect = wrapper.getBoundingClientRect();
      const mouseX = ((e.clientX - rect.left) / rect.width) * 900;

      if (!currentPoints.length) return;

      // Find closest data point
      let closest = currentPoints[0];
      let minDist = Math.abs(mouseX - currentPoints[0].x);

      for (let i = 1; i < currentPoints.length; i++) {
        const dist = Math.abs(mouseX - currentPoints[i].x);
        if (dist < minDist) {
          minDist = dist;
          closest = currentPoints[i];
        }
      }

      // Update Hover Elements
      hoverPoint.setAttribute('cx', closest.x);
      hoverPoint.setAttribute('cy', closest.y);
      hoverPoint.style.opacity = '1';

      hoverLine.setAttribute('x1', closest.x);
      hoverLine.setAttribute('y1', closest.y);
      hoverLine.setAttribute('x2', closest.x);
      hoverLine.setAttribute('y2', 200);
      hoverLine.style.opacity = '1';

      // Tooltip position
      const pxPercentage = (closest.x / 900) * 100;
      const pyPercentage = (closest.y / 240) * 100;
      
      tooltip.style.left = `${pxPercentage}%`;
      tooltip.style.top = `${pyPercentage}%`;
      tooltip.style.opacity = '1';

      document.getElementById('tt-date').innerText = closest.date;
      document.getElementById('tt-val').innerText = `${currentCurrency}${closest.val.toLocaleString()}`;
      document.getElementById('tt-change').innerText = `+${currentCurrency}75 vs avg`;
    });

    wrapper.addEventListener('mouseleave', () => {
      hoverPoint.style.opacity = '0';
      hoverLine.style.opacity = '0';
      tooltip.style.opacity = '0';
    });

    // Initialization
    calculateFinancials();
    renderChart('14D');
  </script>
</body>
</html>
