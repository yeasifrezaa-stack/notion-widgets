<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Swirly Graph Dashboard</title>
    
    <!-- FIXED: Using Orbitron, a valid futuristic Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: transparent;
            --panel-bg: rgba(18, 18, 24, 0.35);
            --primary-color: #f59e0b;
            --border-glass: rgba(245, 158, 11, 0.2);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --primary-glow: 0 0 25px rgba(245, 158, 11, 0.45);
            --dropdown-bg: rgba(18, 18, 24, 0.95);
        }

        *, *::before, *::after, input, button, select {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif !important;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: transparent;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevents double scrollbars in Notion */
        }

        /* Subtle Ambient Background Orbs */
        .bg-glow-orb {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: var(--primary-color);
            filter: blur(150px);
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
            transition: background 0.4s ease;
        }

        .dashboard-container {
            position: relative;
            z-index: 1;
            width: 95%;
            height: 95%;
            max-width: 1350px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: border-color 0.4s ease;
            overflow-y: auto;
        }

        /* Top Header & Controls Row */
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 12px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .main-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            transition: color 0.4s ease;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .color-picker-wrapper input[type="color"] {
            appearance: none;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--text-main);
            border-radius: 50%;
        }

        .add-btn, .reset-btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .add-btn {
            background: rgba(245, 158, 11, 0.15);
            color: var(--primary-color);
            border: 1.5px solid var(--primary-color);
        }

        .add-btn:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: var(--primary-glow);
        }

        .reset-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1.5px solid rgba(239, 68, 68, 0.4);
        }

        .reset-btn:hover {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        /* Top Horizontal Metrics Strip */
        .top-metrics-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
        }

        .metric-box {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.015);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .metric-box:hover {
            border-color: var(--primary-color);
            box-shadow: var(--primary-glow);
        }

        .metric-ring-wrapper {
            position: relative;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .metric-ring-wrapper svg {
            width: 50px;
            height: 50px;
            transform: rotate(-90deg);
        }

        .metric-ring-wrapper circle {
            fill: none;
            stroke-width: 5;
        }

        .ring-bg { stroke: rgba(255, 255, 255, 0.08); }
        .ring-val { 
            stroke: var(--primary-color); 
            stroke-dasharray: 132; 
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease, stroke 0.4s ease;
        }

        .metric-info {
            display: flex;
            flex-direction: column;
        }

        .metric-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.1;
            transition: color 0.4s ease;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* Panoramic Horizontal Graph Area */
        .swirly-graph-section {
            position: relative;
            width: 100%;
            height: 250px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 16px 20px 30px 50px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .axis-y {
            position: absolute;
            left: 10px;
            top: 16px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
            width: 32px;
        }

        .axis-x {
            position: absolute;
            left: 55px;
            right: 20px;
            bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .grid-lines {
            position: absolute;
            left: 50px;
            right: 20px;
            top: 16px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .grid-line {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.03);
        }

        .swirly-svg {
            position: absolute;
            left: 50px;
            top: 16px;
            width: calc(100% - 70px);
            height: calc(100% - 46px);
            overflow: visible;
        }

        .curve-duration {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px var(--primary-color));
            transition: d 0.6s ease, stroke 0.4s ease;
        }

        .curve-type {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.8;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.4));
            transition: d 0.6s ease;
        }

        .graph-node {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--primary-color);
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 0 10px var(--primary-color);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .graph-node:hover {
            transform: translate(-50%, -50%) scale(1.4);
            background: #fff;
        }

        /* Hover Popup */
        .hover-card-popup {
            position: absolute;
            background: rgba(20, 20, 28, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--primary-color);
            box-shadow: var(--primary-glow);
            padding: 6px 10px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 25;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .hover-card-popup.active { opacity: 1; }
        .popup-title { font-size: 0.75rem; font-weight: 700; color: var(--primary-color); }
        .popup-detail { font-size: 0.7rem; color: var(--text-main); }

        /* Horizontal Editor Cards Grid */
        .editors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            padding-right: 4px;
        }

        .editor-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .editor-card:hover {
            border-color: var(--border-glass);
            background: rgba(255, 255, 255, 0.035);
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .session-name-input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed var(--border-glass);
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 500;
            width: 100%;
            outline: none;
            padding-bottom: 2px;
        }

        .delete-card-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 5px;
            width: 22px;
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .delete-card-btn:hover { background: #ef4444; color: #fff; }

        .card-inputs-row {
            display: flex;
            gap: 6px;
        }

        .custom-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            outline: none;
            width: 100%;
            transition: border-color 0.3s;
        }

        .custom-input:focus {
            border-color: var(--primary-color);
        }

        .interactive-select {
            appearance: none;
            background-color: var(--dropdown-bg);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
            width: 100%;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23F59E0B%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 8px top 50%;
            background-size: 7px auto;
        }

        .interactive-select:hover, .interactive-select:focus {
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="bg-glow-orb"></div>

    <div class="dashboard-container" id="dashboardContainer">
        
        <!-- Header Controls Row -->
        <div class="header-controls">
            <h1 class="main-title">Study Sessions</h1>
            <div class="header-actions">
                <div class="color-picker-wrapper">
                    <span>Theme</span>
                    <input type="color" id="themeColorPicker" value="#f59e0b" onchange="updateThemeColor(this.value)">
                </div>
                <button class="add-btn" onclick="addSession()">Add +</button>
                <button class="reset-btn" onclick="resetDashboard()">Reset 🔄</button>
            </div>
        </div>

        <!-- Top Horizontal Metrics Strip -->
        <div class="top-metrics-panel">
            <div class="metric-box">
                <div class="metric-ring-wrapper">
                    <svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" class="ring-bg"></circle><circle cx="25" cy="25" r="21" class="ring-val" id="ringMin" style="stroke-dashoffset: 35;"></circle></svg>
                </div>
                <div class="metric-info">
                    <span class="metric-number" id="totalMinsVal">0m</span>
                    <span class="metric-label">Total Duration</span>
                </div>
            </div>

            <div class="metric-box">
                <div class="metric-ring-wrapper">
                    <svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" class="ring-bg"></circle><circle cx="25" cy="25" r="21" class="ring-val" id="ringSessions" style="stroke-dashoffset: 20;"></circle></svg>
                </div>
                <div class="metric-info">
                    <span class="metric-number" id="totalSessionsVal">0</span>
                    <span class="metric-label">Total Sessions</span>
                </div>
            </div>

            <div class="metric-box">
                <div class="metric-ring-wrapper">
                    <svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" class="ring-bg"></circle><circle cx="25" cy="25" r="21" class="ring-val" id="ringAvg" style="stroke-dashoffset: 50;"></circle></svg>
                </div>
                <div class="metric-info">
                    <span class="metric-number" id="avgMinsVal">0m</span>
                    <span class="metric-label">Avg / Session</span>
                </div>
            </div>
        </div>

        <!-- Panoramic Horizontal Swirly Graph Area -->
        <div class="swirly-graph-section" id="graphSection">
            <div class="axis-y">
                <span>120m</span>
                <span>80m</span>
                <span>40m</span>
                <span>0m</span>
            </div>

            <div class="grid-lines">
                <div class="grid-line"></div>
                <div class="grid-line"></div>
                <div class="grid-line"></div>
                <div class="grid-line"></div>
            </div>

            <svg class="swirly-svg" id="swirlySvg">
                <path class="curve-type" id="pathType" d="" />
                <path class="curve-duration" id="pathDuration" d="" />
            </svg>

            <div id="nodesContainer"></div>

            <div class="axis-x" id="xAxisLabels"></div>

            <div class="hover-card-popup" id="hoverPopup">
                <span class="popup-title" id="popupTitle">Session Name</span>
                <span class="popup-detail" id="popupDetail">Duration: 75m</span>
            </div>
        </div>

        <!-- Horizontal Editor Cards Grid -->
        <div class="editors-grid" id="editorsGrid"></div>

    </div>

    <script>
        const initialData = [
            { name: "Mechanics practice", date: "July 17", duration: 75, type: "Practice", subject: "Physics" },
            { name: "Light revision", date: "July 18", duration: 45, type: "Review", subject: "Computer Sci" },
            { name: "Essay practice", date: "July 15", duration: 60, type: "Practice", subject: "English (ESL)" },
            { name: "Rest day", date: "July 19", duration: 15, type: "Review", subject: "Mathematics" },
            { name: "Algebra deep dive", date: "July 13", duration: 90, type: "Deep Focus", subject: "Mathematics" },
            { name: "Organic chemistry", date: "July 16", duration: 100, type: "Review", subject: "Chemistry" },
            { name: "Genetics + Ecology", date: "July 14", duration: 120, type: "Deep Focus", subject: "Biology" }
        ];

        let studyData = JSON.parse(JSON.stringify(initialData));
        const typeWeightMap = { "Practice": 75, "Review": 45, "Deep Focus": 110 };

        function updateThemeColor(hex) {
            document.documentElement.style.setProperty('--primary-color', hex);
            document.documentElement.style.setProperty('--border-glass', hexToRgba(hex, 0.2));
            document.documentElement.style.setProperty('--primary-glow', `0 0 25px ${hexToRgba(hex, 0.45)}`);
        }

        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16) || 245;
            let g = parseInt(hex.slice(3, 5), 16) || 158;
            let b = parseInt(hex.slice(5, 7), 16) || 11;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function resetDashboard() {
            studyData = [];
            updateThemeColor("#f59e0b");
            document.getElementById('themeColorPicker').value = "#f59e0b";
            renderDashboard();
        }

        function renderDashboard() {
            renderGraph();
            renderEditors();
            updateMetrics();
        }

        function renderGraph() {
            const svgWidth = document.getElementById('graphSection').clientWidth - 70;
            const svgHeight = 180; 
            
            const n = studyData.length;
            if (n === 0) {
                document.getElementById('pathDuration').setAttribute('d', '');
                document.getElementById('pathType').setAttribute('d', '');
                document.getElementById('nodesContainer').innerHTML = '';
                document.getElementById('xAxisLabels').innerHTML = '';
                return;
            }

            const stepX = svgWidth / Math.max(1, n - 1);

            let pointsDuration = [];
            let pointsType = [];

            studyData.forEach((item, i) => {
                let x = i * stepX;
                let yDur = svgHeight - (Math.min(item.duration, 130) / 130) * svgHeight;
                let weight = typeWeightMap[item.type] || 60;
                let yType = svgHeight - (weight / 130) * svgHeight;

                pointsDuration.push({ x, y: yDur });
                pointsType.push({ x, y: yType });
            });

            document.getElementById('pathDuration').setAttribute('d', createSmoothPath(pointsDuration));
            document.getElementById('pathType').setAttribute('d', createSmoothPath(pointsType));

            const nodesContainer = document.getElementById('nodesContainer');
            const xAxisContainer = document.getElementById('xAxisLabels');
            nodesContainer.innerHTML = '';
            xAxisContainer.innerHTML = '';

            studyData.forEach((item, i) => {
                let pt = pointsDuration[i];

                let node = document.createElement('div');
                node.className = 'graph-node';
                node.style.left = (pt.x + 50) + 'px';
                node.style.top = (pt.y + 16) + 'px';

                node.onmouseenter = () => showPopup(item, pt.x + 50, pt.y + 16);
                node.onmouseleave = hidePopup;
                nodesContainer.appendChild(node);

                let span = document.createElement('span');
                span.innerText = item.date;
                xAxisContainer.appendChild(span);
            });
        }

        function createSmoothPath(points) {
            if (points.length === 0) return "";
            if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;

            let path = `M ${points[0].x} ${points[0].y}`;
            for (let i = 0; i < points.length - 1; i++) {
                let p0 = points[i === 0 ? 0 : i - 1];
                let p1 = points[i];
                let p2 = points[i + 1];
                let p3 = points[i + 2] || p2;

                let cp1x = p1.x + (p2.x - p0.x) / 6;
                let cp1y = p1.y + (p2.y - p0.y) / 6;
                let cp2x = p2.x - (p3.x - p1.x) / 6;
                let cp2y = p2.y - (p3.y - p1.y) / 6;

                path += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
            }
            return path;
        }

        function renderEditors() {
            const grid = document.getElementById('editorsGrid');
            grid.innerHTML = '';

            if (studyData.length === 0) {
                grid.innerHTML = '<div style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 15px;">Graph is wiped clean! Add a session to start fresh ✨</div>';
                return;
            }

            studyData.forEach((item, index) => {
                let card = document.createElement('div');
                card.className = 'editor-card';

                card.innerHTML = `
                    <div class="card-top-row">
                        <input type="text" class="session-name-input" value="${item.name}" oninput="updateItem(${index}, 'name', this.value)">
                        <button class="delete-card-btn" onclick="deleteItem(${index})">✕</button>
                    </div>
                    <div class="card-inputs-row">
                        <input type="text" class="custom-input" value="${item.date}" oninput="updateItem(${index}, 'date', this.value)">
                        <input type="number" class="custom-input" value="${item.duration}" oninput="updateItem(${index}, 'duration', Number(this.value))">
                    </div>
                    <div class="card-inputs-row">
                        <input type="text" class="custom-input" value="${item.subject}" oninput="updateItem(${index}, 'subject', this.value)">
                        <select class="interactive-select" onchange="updateItem(${index}, 'type', this.value)">
                            <option value="Practice" ${item.type==='Practice'?'selected':''}>Practice</option>
                            <option value="Review" ${item.type==='Review'?'selected':''}>Review</option>
                            <option value="Deep Focus" ${item.type==='Deep Focus'?'selected':''}>Deep Focus</option>
                        </select>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateMetrics() {
            let totalMins = studyData.reduce((sum, d) => sum + d.duration, 0);
            let count = studyData.length;
            let avg = count > 0 ? Math.round(totalMins / count) : 0;

            document.getElementById('totalMinsVal').innerText = totalMins + 'm';
            document.getElementById('totalSessionsVal').innerText = count;
            document.getElementById('avgMinsVal').innerText = avg + 'm';
        }

        function updateItem(index, field, val) {
            studyData[index][field] = val;
            renderGraph();
            updateMetrics();
        }

        function addSession() {
            studyData.push({ name: "New Study Session", date: "July 20", duration: 60, type: "Practice", subject: "Physics" });
            renderDashboard();
        }

        function deleteItem(index) {
            studyData.splice(index, 1);
            renderDashboard();
        }

        function showPopup(item, x, y) {
            const popup = document.getElementById('hoverPopup');
            document.getElementById('popupTitle').innerText = item.name + ' (' + item.subject + ')';
            document.getElementById('popupDetail').innerText = `Duration: ${item.duration}m | Type: ${item.type}`;
            popup.style.left = (x + 10) + 'px';
            popup.style.top = (y - 20) + 'px';
            popup.classList.add('active');
        }

        function hidePopup() {
            document.getElementById('hoverPopup').classList.remove('active');
        }

        window.onload = renderDashboard;
        window.onresize = renderGraph;
    </script>
</body>
</html>
