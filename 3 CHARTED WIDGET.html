<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Gold Finance Dashboard</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap');

    :root {
      --notion-bg: #191919; 
      
      --gold-primary: #d4af37;
      --gold-light: #fdf5c9;
      --gold-dark: #7a5f13;
      --gold-glow: rgba(212, 175, 55, 0.5);
      --gold-border: rgba(212, 175, 55, 0.4);
      
      --danger-color: #ff3366;
      --perfect-color: #ffcc00;
      --lavish-color: #00e676;

      --card-bg: radial-gradient(circle at top left, rgba(40, 32, 22, 0.9), rgba(15, 15, 15, 0.98));
      --card-blur: blur(18px);
      --text-muted: #a89f91;

      /* Sharp Fonts */
      --font-display: 'Cinzel', serif;
      --font-numbers: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--notion-bg);
      font-family: var(--font-numbers);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .widget-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: var(--card-blur);
      border: 1px solid var(--gold-border);
      border-radius: 16px; /* Sharper corners */
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(212, 175, 55, 0.05);
      position: relative;
      transition: all 0.4s ease;
    }

    .card:hover {
      border-color: var(--gold-primary);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.15);
    }

    .card-label {
      font-family: var(--font-display);
      color: var(--gold-primary);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Inputs */
    .input-wrapper { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    
    .currency-symbol {
      color: var(--gold-light);
      font-size: 1.6rem;
      font-weight: 700;
    }

    .edit-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px; /* Sharper */
      color: var(--gold-light);
      font-family: var(--font-numbers);
      font-size: 1.6rem;
      font-weight: 700;
      width: 100%;
      padding: 4px 10px;
      outline: none;
      transition: all 0.3s ease;
    }

    .edit-input:focus {
      border-color: var(--gold-light);
      box-shadow: 0 0 15px var(--gold-glow);
      background: rgba(212, 175, 55, 0.1);
    }

    .mini-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 4px;
      color: var(--gold-light);
      font-family: var(--font-numbers);
      font-size: 1rem;
      font-weight: 600;
      width: 90px;
      padding: 2px 8px;
      text-align: right;
      outline: none;
      transition: all 0.3s ease;
    }

    .sub-input-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 1rem; color: var(--text-muted); margin-top: 8px; font-weight: 500;
    }

    /* Budget Track */
    .progress-track {
      width: 100%; height: 6px; background: rgba(255, 255, 255, 0.05);
      margin: 16px 0; position: relative; border-radius: 2px;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-primary), var(--gold-light));
      box-shadow: 0 0 15px var(--gold-primary);
      transition: width 0.8s cubic-bezier(0.2, 1, 0.3, 1);
      border-radius: 2px;
    }

    /* Add Growth Section */
    .add-growth-container {
      display: flex; gap: 8px; margin-top: 10px;
    }
    .add-btn {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      font-family: var(--font-display);
      cursor: pointer;
      padding: 0 12px;
      font-weight: bold;
      transition: all 0.3s ease;
      border-radius: 4px;
    }
    .add-btn:hover { background: var(--gold-primary); color: #000; box-shadow: 0 0 15px var(--gold-glow); }

    /* Reactive SVG Graph */
    .sparkline-container { position: relative; width: 100%; margin-top: 15px; height: 80px; }
    .sparkline-svg { width: 100%; height: 100%; overflow: visible; }
    .graph-path { fill: none; stroke: var(--gold-primary); stroke-width: 2.5; filter: drop-shadow(0px 5px 8px var(--gold-glow)); transition: d 0.5s ease; }
    .graph-fill { fill: url(#goldGradient); transition: d 0.5s ease; opacity: 0.6; }
    .graph-node {
      fill: var(--notion-bg); stroke: var(--gold-light); stroke-width: 2; r: 4.5;
      transition: all 0.3s ease; cursor: crosshair;
    }
    .graph-node:hover { r: 7; fill: var(--gold-primary); filter: drop-shadow(0 0 10px var(--gold-light)); }
    
    /* Graph Tooltip */
    .graph-tooltip {
      position: absolute; background: rgba(0,0,0,0.8); border: 1px solid var(--gold-primary);
      color: var(--gold-light); padding: 4px 8px; font-size: 0.85rem; font-weight: bold;
      border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10;
    }

    /* History Log */
    .history-log {
      max-height: 70px; overflow-y: auto; margin-top: 15px; padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem;
    }
    .history-log::-webkit-scrollbar { width: 4px; }
    .history-log::-webkit-scrollbar-thumb { background: var(--gold-dark); }
    .history-item {
      display: flex; justify-content: space-between; padding: 4px 0; color: var(--text-muted);
      animation: fadeIn 0.4s ease forwards;
    }
    .history-val { color: var(--lavish-color); font-weight: bold; }

    /* Accounts & Custom Animated Dropdowns */
    .accounts-card { display: flex; flex-direction: column; gap: 16px; }
    .account-row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 5; }
    
    .custom-dropdown { position: relative; width: 160px; font-family: var(--font-display); }
    .dropdown-selected {
      background: rgba(0, 0, 0, 0.5); border: 1px solid var(--gold-border); padding: 8px 12px;
      border-radius: 4px; font-size: 0.85rem; font-weight: 700; color: var(--gold-light);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      transition: all 0.3s;
    }
    .dropdown-selected:hover { border-color: var(--gold-primary); box-shadow: 0 0 10px var(--gold-glow); }
    .dropdown-options {
      position: absolute; top: 110%; left: 0; width: 100%; background: #121212;
      border: 1px solid var(--gold-primary); border-radius: 4px; overflow: hidden;
      max-height: 0; opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 100;
    }
    .custom-dropdown.open .dropdown-options { max-height: 200px; opacity: 1; }
    .dropdown-option {
      padding: 10px 12px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; transition: 0.2s;
    }
    .dropdown-option:hover { background: rgba(212, 175, 55, 0.15); color: var(--gold-light); }

    /* Alert System */
    .alert-banner {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px; padding: 14px 18px; margin-top: 8px; transition: all 0.4s ease;
    }
    .alert-status-badge {
      display: flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 700;
      font-family: var(--font-display); padding: 6px 14px; border-radius: 4px; transition: all 0.4s;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 1.5s infinite; }

    .alert-danger { color: var(--danger-color); border: 1px solid var(--danger-color); box-shadow: 0 0 15px rgba(255,51,102,0.3); }
    .alert-danger .status-dot { background: var(--danger-color); box-shadow: 0 0 8px var(--danger-color); }
    .alert-perfect { color: var(--perfect-color); border: 1px solid var(--perfect-color); box-shadow: 0 0 15px rgba(255,204,0,0.3); }
    .alert-perfect .status-dot { background: var(--perfect-color); box-shadow: 0 0 8px var(--perfect-color); }
    .alert-lavish { color: var(--lavish-color); border: 1px solid var(--lavish-color); box-shadow: 0 0 15px rgba(0,230,118,0.3); }
    .alert-lavish .status-dot { background: var(--lavish-color); box-shadow: 0 0 8px var(--lavish-color); }

    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="widget-container">
    
    <div class="top-grid">
      
      <!-- Budget Card -->
      <div class="card">
        <div class="card-label">Monthly Budget</div>
        
        <div class="input-wrapper">
          <span class="currency-symbol">$</span>
          <input type="number" id="in-budget" class="edit-input" value="7500" oninput="calcBudget()">
        </div>

        <div class="sub-input-row">
          <span>Spent: $</span>
          <input type="number" id="in-spent" class="mini-input" value="4236" oninput="calcBudget()">
        </div>

        <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>

        <div class="sub-input-row">
          <span>Remaining:</span>
          <span id="out-remaining" style="color: var(--gold-light); font-weight:700;">$3,264</span>
        </div>
      </div>

      <!-- Reactive Investments Card -->
      <div class="card">
        <div class="card-label">Investments</div>
        
        <div class="input-wrapper">
          <span class="currency-symbol">$</span>
          <input type="number" id="in-investments" class="edit-input" value="22470" readonly>
        </div>

        <div class="add-growth-container">
          <input type="number" id="new-growth" class="mini-input" style="width:100%" placeholder="+ New Growth">
          <button class="add-btn" onclick="addGrowth()">ADD</button>
        </div>

        <div class="sparkline-container" id="graph-container">
          <div class="graph-tooltip" id="tooltip"></div>
          <svg class="sparkline-svg" id="sparkline-svg">
            <defs>
              <linearGradient id="goldGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#d4af37" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#d4af37" stop-opacity="0.0"/>
              </linearGradient>
            </defs>
            <path id="graph-fill" class="graph-fill" d=""></path>
            <path id="graph-line" class="graph-path" d=""></path>
            <g id="graph-nodes"></g>
          </svg>
        </div>

        <div class="history-log" id="history-log">
          <!-- History injected via JS -->
        </div>
      </div>

    </div>

    <!-- Accounts Card -->
    <div class="card accounts-card">
      <div class="card-label">Accounts</div>

      <!-- Checking Row -->
      <div class="account-row" style="z-index: 10;">
        <div class="custom-dropdown" onclick="toggleDropdown(this)">
          <div class="dropdown-selected"><span class="val">🏛️ Checking</span> <span>▼</span></div>
          <div class="dropdown-options">
            <div class="dropdown-option" onclick="selectOpt(event, this)">🏛️ Checking</div>
            <div class="dropdown-option" onclick="selectOpt(event, this)">💼 Business Acc</div>
            <div class="dropdown-option" onclick="selectOpt(event, this)">🏦 Vault</div>
          </div>
        </div>
        <div class="input-wrapper" style="margin:0;">
          <span class="currency-symbol" style="font-size:1.2rem;">$</span>
          <input type="number" id="in-checking" class="edit-input" style="width: 120px; font-size:1.2rem; text-align:right;" value="1325.50" oninput="calcAlert()">
        </div>
      </div>

      <!-- Credit Row -->
      <div class="account-row" style="z-index: 5;">
        <div class="custom-dropdown" onclick="toggleDropdown(this)">
          <div class="dropdown-selected"><span class="val">💳 Credit Card</span> <span>▼</span></div>
          <div class="dropdown-options">
            <div class="dropdown-option" onclick="selectOpt(event, this)">💳 Credit Card</div>
            <div class="dropdown-option" onclick="selectOpt(event, this)">🪙 Gold Card</div>
            <div class="dropdown-option" onclick="selectOpt(event, this)">💎 Platinum</div>
          </div>
        </div>
        <div class="input-wrapper" style="margin:0;">
          <span class="currency-symbol" style="font-size:1.2rem;">$</span>
          <input type="number" class="edit-input" style="width: 120px; font-size:1.2rem; text-align:right;" value="-840.20">
        </div>
      </div>

      <div class="alert-banner">
        <span style="font-family: var(--font-display); color: var(--text-muted); font-size:0.9rem;">Status:</span>
        <div id="checking-alert" class="alert-status-badge alert-lavish">
          <div class="status-dot"></div><span id="alert-text">LAVISH</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    // --- 1. Budget Logic ---
    function calcBudget() {
      const b = parseFloat(document.getElementById('in-budget').value) || 0;
      const s = parseFloat(document.getElementById('in-spent').value) || 0;
      const r = b - s;
      document.getElementById('out-remaining').innerText = '$' + r.toLocaleString();
      document.getElementById('out-remaining').style.color = r < 0 ? 'var(--danger-color)' : 'var(--gold-light)';
      
      let pct = b > 0 ? (s / b) * 100 : 0;
      document.getElementById('progress-bar').style.width = Math.min(Math.max(pct, 0), 100) + '%';
    }

    // --- 2. Checking Alert Logic ---
    function calcAlert() {
      const val = parseFloat(document.getElementById('in-checking').value) || 0;
      const badge = document.getElementById('checking-alert');
      const text = document.getElementById('alert-text');
      if (val < 100) { badge.className = 'alert-status-badge alert-danger'; text.innerText = 'DANGER'; }
      else if (val < 1000) { badge.className = 'alert-status-badge alert-perfect'; text.innerText = 'PERFECT'; }
      else { badge.className = 'alert-status-badge alert-lavish'; text.innerText = 'LAVISH'; }
    }

    // --- 3. Custom Dropdown Logic ---
    function toggleDropdown(el) { el.classList.toggle('open'); }
    function selectOpt(e, opt) {
      e.stopPropagation();
      const parent = opt.closest('.custom-dropdown');
      parent.querySelector('.val').innerText = opt.innerText;
      parent.classList.remove('open');
    }
    document.addEventListener('click', e => {
      document.querySelectorAll('.custom-dropdown.open').forEach(drop => {
        if(!drop.contains(e.target)) drop.classList.remove('open');
      });
    });

    // --- 4. Dynamic Reactive Graph Logic ---
    let growthData = [100, 450, 300, 800, 500]; // Initial Growth History
    let totalInvested = 22470;

    function renderGraph() {
      const svg = document.getElementById('sparkline-svg');
      const w = svg.clientWidth; const h = svg.clientHeight;
      const maxVal = Math.max(...growthData, 100);
      const minVal = Math.min(...growthData, 0);
      const range = maxVal - minVal || 1;
      
      let pathD = ""; let fillD = "";
      const nodesGroup = document.getElementById('graph-nodes');
      nodesGroup.innerHTML = ''; // clear old nodes

      growthData.forEach((val, i) => {
        const x = (i / (growthData.length - 1)) * w;
        const y = h - ((val - minVal) / range) * (h - 10) - 5; // padding
        
        pathD += (i === 0 ? `M ${x},${y}` : ` L ${x},${y}`);
        fillD = i === 0 ? `M ${x},${h} L ${x},${y}` : fillD + ` L ${x},${y}`;

        // Create interactive nodes
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", x); circle.setAttribute("cy", y);
        circle.setAttribute("class", "graph-node");
        
        // Tooltip logic
        circle.addEventListener('mouseenter', (e) => showTooltip(e, val));
        circle.addEventListener('mouseleave', hideTooltip);
        nodesGroup.appendChild(circle);
      });

      fillD += ` L ${w},${h} Z`;
      document.getElementById('graph-line').setAttribute("d", pathD);
      document.getElementById('graph-fill').setAttribute("d", fillD);
      renderHistory();
    }

    function showTooltip(e, val) {
      const tooltip = document.getElementById('tooltip');
      const rect = e.target.getBoundingClientRect();
      const containerRect = document.getElementById('graph-container').getBoundingClientRect();
      tooltip.innerText = `+$${val}`;
      tooltip.style.opacity = '1';
      tooltip.style.left = (rect.left - containerRect.left - 10) + 'px';
      tooltip.style.top = (rect.top - containerRect.top - 30) + 'px';
    }
    function hideTooltip() { document.getElementById('tooltip').style.opacity = '0'; }

    function renderHistory() {
      const log = document.getElementById('history-log');
      log.innerHTML = '';
      [...growthData].reverse().forEach((val, i) => {
        log.innerHTML += `<div class="history-item"><span>Entry #${growthData.length - i}</span><span class="history-val">+$${val}</span></div>`;
      });
    }

    function addGrowth() {
      const input = document.getElementById('new-growth');
      const val = parseFloat(input.value);
      if(!isNaN(val) && val > 0) {
        growthData.push(val);
        totalInvested += val;
        document.getElementById('in-investments').value = totalInvested;
        input.value = '';
        renderGraph();
      }
    }

    // Initialize
    window.addEventListener('resize', renderGraph);
    calcBudget(); calcAlert(); renderGraph();
  </script>

</body>
</html>
