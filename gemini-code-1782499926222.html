<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Pipeline Premium Glow</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Exact background from Screenshot 2026-06-27 001112_2.png */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #1c1c1c; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
        }

        .widget-container {
            background-color: #1c1c1c;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
            border-radius: 16px;
            /* FANCY GLOWY EDGE EFFECT */
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                0 0 40px rgba(0, 0, 0, 0.5), 
                0 0 15px rgba(212, 163, 82, 0.08),
                inset 0 0 20px rgba(255, 255, 255, 0.02);
            transition: all 0.4s ease;
        }

        .widget-container:hover {
            box-shadow: 
                0 0 50px rgba(0, 0, 0, 0.6), 
                0 0 25px rgba(212, 163, 82, 0.15);
            border-color: rgba(212, 163, 82, 0.2);
        }

        .title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #eeeeee;
            margin-bottom: 32px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .main-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            padding: 0 10px;
        }

        .chart-wrapper {
            position: relative;
            width: 116px;
            height: 116px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
            box-shadow: 0 0 20px rgba(212, 163, 82, 0.15);
        }

        .chart-inner {
            width: 84px;
            height: 84px;
            background-color: #1c1c1c; 
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            animation: breathe 4s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .total-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 2px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .total-label {
            font-size: 9px;
            font-weight: 700;
            color: #888888;
            letter-spacing: 1px;
        }

        .legend-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 135px;
        }

        .legend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .legend-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .legend-label {
            font-size: 10px;
            font-weight: 600;
            color: #bbbbbb;
            transition: color 0.2s;
        }

        .legend-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            cursor: text;
            outline: none;
            border-bottom: 1px dashed transparent;
            padding-bottom: 1px;
            transition: all 0.2s;
        }

        .legend-value:hover, .legend-value:focus {
            border-bottom: 1px dashed #D4A352;
            color: #D4A352;
            text-shadow: 0 0 10px rgba(212, 163, 82, 0.6);
        }

        .quote-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .icon {
            color: #D4A352; 
            filter: drop-shadow(0 0 5px rgba(212, 163, 82, 0.5));
        }

        .quote-text {
            font-size: 12px;
            line-height: 1.6;
            color: #999999;
        }
        
        .highlight {
            color: #D4A352;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="title">CONTENT PIPELINE</div>
        <div class="main-content">
            <div class="chart-wrapper" id="donutChart">
                <div class="chart-inner">
                    <div class="total-number" id="totalCount">12</div>
                    <div class="total-label">TOTAL</div>
                </div>
            </div>
            <div class="legend-container" id="legendContainer"></div>
        </div>
        <div class="quote-card">
            <div class="icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"></path></svg>
            </div>
            <div class="quote-text">
                Amateurs wait for inspiration.<br>
                <span class="highlight">Masters build systems.</span>
            </div>
        </div>
    </div>

    <script>
        let pipelineData = [
            { id: 'ideas', label: 'IDEAS', value: 4, color: '#D4A352' },
            { id: 'progress', label: 'IN PROGRESS', value: 3, color: '#A67C00' },
            { id: 'review', label: 'REVIEW', value: 2, color: '#777777' },
            { id: 'scheduled', label: 'SCHEDULED', value: 2, color: '#444444' },
            { id: 'published', label: 'PUBLISHED', value: 1, color: '#ffffff' }
        ];

        const donutChart = document.getElementById('donutChart');
        const totalCountEl = document.getElementById('totalCount');
        const legendContainer = document.getElementById('legendContainer');

        function render() {
            const total = pipelineData.reduce((sum, item) => sum + item.value, 0);
            totalCountEl.innerText = total;

            let gradientString = '';
            let currentPct = 0;
            pipelineData.forEach((item, index) => {
                if(item.value > 0) {
                    const pct = (item.value / total) * 100;
                    gradientString += `${item.color} ${currentPct}% ${currentPct + pct}%${index < pipelineData.length - 1 ? ', ' : ''}`;
                    currentPct += pct;
                }
            });
            
            donutChart.style.background = `conic-gradient(${gradientString})`;

            legendContainer.innerHTML = '';
            pipelineData.forEach((item, index) => {
                legendContainer.innerHTML += `
                    <div class="legend-item" style="color: ${item.color}">
                        <div class="legend-left">
                            <div class="dot" style="background-color: ${item.color};"></div>
                            <div class="legend-label">${item.label}</div>
                        </div>
                        <div class="legend-value" contenteditable="true" spellcheck="false" onblur="updateValue(${index}, this)">${item.value}</div>
                    </div>
                `;
            });
        }

        function updateValue(index, element) {
            let parsedVal = parseInt(element.innerText.replace(/[^0-9]/g, '')) || 0;
            pipelineData[index].value = parsedVal;
            render();
        }

        render();
    </script>
</body>
</html>
