<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subjects — Golden Glass Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sail&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#191919;
    --glass-fill: rgba(10,9,7,0.55);
    --border-soft: rgba(212,161,92,0.18);
    --border-strong: rgba(243,200,119,0.5);
    --gold-dim:#7a5f37;
    --gold:#d4a15c;
    --gold-bright:#f3c877;
    --gold-glow: rgba(243,200,119,0.45);
    --text:#f1e8d8;
    --text-muted:#a89b86;
    --text-faint:#6d6455;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Sail', cursive;
    --ease: cubic-bezier(.22,1,.36,1);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    background: var(--bg-page);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 18px;
    font-family: var(--font-display);
    color: var(--text);
  }

  .sr-only{
    position:absolute !important;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  .board{
    position:relative;
    width:100%;
    max-width:920px;
    border-radius: var(--radius-lg);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.005)),
      var(--glass-fill);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border:1px solid var(--border-soft);
    box-shadow:
      0 30px 70px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.05);
    padding:28px 26px 22px;
    overflow:hidden;
  }

  .ambient-glow{
    position:absolute;
    width:420px; height:420px;
    top:-180px; right:-160px;
    background: radial-gradient(circle, var(--gold-glow), transparent 70%);
    filter: blur(10px);
    opacity:.55;
    animation: breathe 9s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{ opacity:.35; transform:scale(1); }
    50%{ opacity:.6; transform:scale(1.08); }
  }

  .board-header{
    position:relative;
    z-index:1;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }

  .title-wrap h1{
    margin:0;
    font-size:2rem;
    font-weight:400;
    letter-spacing:.02em;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter: drop-shadow(0 0 14px rgba(243,200,119,0.25));
  }
  .title-wrap .subtitle{
    margin:4px 0 0;
    font-size:.95rem;
    color: var(--text-muted);
    letter-spacing:.01em;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .icon-btn{
    width:32px; height:32px;
    border-radius:10px;
    border:1px solid var(--border-soft);
    background: rgba(255,255,255,0.02);
    color: var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    transition: all .3s var(--ease);
  }
  .icon-btn:hover{
    color: var(--gold-bright);
    border-color: var(--border-strong);
    box-shadow: 0 0 12px rgba(243,200,119,0.2);
  }
  .new-pill{
    font-family: var(--font-display);
    font-size:.95rem;
    padding:6px 16px;
    border-radius:999px;
    border:1px solid var(--border-strong);
    background: linear-gradient(180deg, rgba(243,200,119,0.16), rgba(212,161,92,0.06));
    color: var(--gold-bright);
    letter-spacing:.02em;
    cursor:pointer;
    transition: all .3s var(--ease);
  }
  .new-pill:hover{ box-shadow:0 0 14px rgba(243,200,119,.3); transform:translateY(-1px); }

  button, input, select{ font-family: var(--font-display); }
  button:focus-visible,
  .grade-select:focus-visible,
  .subject-input:focus-visible{
    outline:none;
    border-color: var(--border-strong);
    box-shadow: 0 0 0 3px rgba(243,200,119,0.2);
  }

  .table{ position:relative; z-index:1; }

  .row-cols{
    display:grid;
    grid-template-columns: 1.7fr 1fr 0.95fr 1.6fr 0.85fr 0.6fr;
    gap:12px;
    align-items:center;
  }

  .row-head{
    padding: 0 18px 10px;
    font-size:.8rem;
    letter-spacing:.03em;
    color: var(--text-faint);
  }
  .row-head .cell{ text-align:left; }
  .row-head .cell-tick{ text-align:center; }

  .row{
    padding:14px 18px;
    margin-bottom:10px;
    border-radius: var(--radius-md);
    border:1px solid var(--border-soft);
    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
  }
  .row:hover{
    transform: translateY(-3px);
    border-color: var(--border-strong);
    box-shadow: 0 14px 32px rgba(0,0,0,0.45), 0 0 22px rgba(243,200,119,0.12);
  }
  .row.flash{ animation: rowFlash .6s var(--ease); }
  @keyframes rowFlash{
    0%{ box-shadow:0 6px 18px rgba(0,0,0,0.35); border-color:var(--border-soft); }
    35%{ box-shadow:0 0 26px 2px var(--gold-glow); border-color:var(--border-strong); }
    100%{ box-shadow:0 6px 18px rgba(0,0,0,0.35); border-color:var(--border-soft); }
  }
  .row.new-row{ animation: rowAppear .5s var(--ease); }
  @keyframes rowAppear{
    from{ opacity:0; transform:translateY(-8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .subject-badge{
    width:28px; height:28px;
    border-radius:9px;
    display:inline-flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, var(--gold-bright), var(--gold-dim));
    color:#241b0f;
    font-size:.9rem;
    margin-right:10px;
    flex-shrink:0;
  }
  .cell-subject{ display:flex; align-items:center; }
  .subject-name{ font-size:1.08rem; letter-spacing:.01em; }

  .conf-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:5px 11px;
    border-radius:999px;
    border:1px solid var(--border-soft);
    font-size:.88rem;
    transition: all .3s var(--ease);
  }
  .dots{ display:inline-flex; gap:3px; }
  .dots i{
    width:5px; height:5px; border-radius:50%;
    background: rgba(255,255,255,0.08);
    display:inline-block;
  }

  .conf-pill.tier-high{
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    border-color: var(--border-strong);
    color:#241b0f;
    box-shadow: 0 0 14px var(--gold-glow);
  }
  .conf-pill.tier-high .dots i{ background:#2a2013; }

  .conf-pill.tier-medium{
    background: rgba(212,161,92,0.1);
    border-color: rgba(212,161,92,0.4);
    color: var(--gold-bright);
  }
  .conf-pill.tier-medium .dots i:nth-child(1),
  .conf-pill.tier-medium .dots i:nth-child(2){ background: var(--gold-bright); }

  .conf-pill.tier-low{
    background: rgba(122,95,55,0.08);
    border-color: rgba(122,95,55,0.35);
    color: var(--text-muted);
  }
  .conf-pill.tier-low .dots i:nth-child(1){ background: var(--gold-dim); }

  .select-wrap{ position:relative; display:inline-flex; align-items:center; width:100%; }
  .grade-select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    font-size:1rem;
    color: var(--gold-bright);
    background: rgba(255,255,255,0.02);
    border:1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding:6px 28px 6px 12px;
    cursor:pointer;
    transition: all .3s var(--ease);
  }
  .grade-select:hover{ border-color: var(--border-strong); }
  .grade-select option{ background:#1c1a16; color:var(--text); font-family: sans-serif; }
  .select-wrap .chev{
    position:absolute; right:9px; pointer-events:none;
    color: var(--text-faint);
  }

  .cell-completion{ display:flex; align-items:center; gap:10px; }
  .bar-track{
    flex:1;
    height:6px;
    border-radius:999px;
    background: rgba(255,255,255,0.06);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright));
    box-shadow: 0 0 10px var(--gold-glow);
    transition: width .6s var(--ease);
  }
  .bar-num{
    font-size:.9rem;
    color: var(--text-muted);
    min-width:34px;
    text-align:right;
  }

  .target-pill{
    display:inline-block;
    font-size:.9rem;
    padding:5px 11px;
    border-radius:999px;
    border:1px solid var(--border-soft);
    color: var(--gold-bright);
    background: rgba(243,200,119,0.04);
  }

  .cell-tick{ display:flex; justify-content:center; }
  .tick-box{
    width:30px; height:30px;
    border-radius:9px;
    border:1.5px solid rgba(212,161,92,0.25);
    background: rgba(255,255,255,0.02);
    display:flex; align-items:center; justify-content:center;
    transition: all .4s var(--ease);
  }
  .tick-box .tick-icon{
    width:16px; height:16px;
    color:#1c150c;
    opacity:0;
    transform: scale(.4) rotate(-12deg);
    transition: all .35s var(--ease);
  }
  .tick-box.met{
    border-color: var(--gold-bright);
    background: linear-gradient(145deg, var(--gold-bright), var(--gold));
    box-shadow: 0 0 16px 1px var(--gold-glow);
  }
  .tick-box.met .tick-icon{ opacity:1; transform: scale(1) rotate(0deg); }
  .tick-box.pulse{ animation: tickPulse .7s var(--ease); }
  @keyframes tickPulse{
    0%{ box-shadow:0 0 0 0 var(--gold-glow); }
    45%{ box-shadow:0 0 0 9px rgba(243,200,119,0); }
    100%{ box-shadow:0 0 16px 1px var(--gold-glow); }
  }

  /* Add-subject expanding row */
  .add-row-shell{
    display:grid;
    grid-template-rows:0fr;
    transition: grid-template-rows .4s var(--ease);
  }
  .add-row-shell.open{ grid-template-rows:1fr; }
  .add-row-inner{ overflow:hidden; min-height:0; }
  .add-row{
    padding:14px 18px;
    border-radius: var(--radius-md);
    border:1px dashed var(--border-soft);
    background: rgba(255,255,255,0.015);
    margin-top:2px;
  }
  .add-row-actions{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 18px 4px;
  }
  .add-error{
    flex:1;
    font-size:.85rem;
    color:#e0a37a;
    min-height:1.2em;
  }
  .subject-input{
    width:100%;
    font-size:1.05rem;
    color: var(--text);
    background: rgba(255,255,255,0.02);
    border:1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding:7px 12px;
    transition: all .3s var(--ease);
  }
  .subject-input::placeholder{ color: var(--text-faint); font-family: var(--font-display); }
  .subject-input[aria-invalid="true"]{ border-color:#c97a5c; }

  .btn-ghost{
    font-size:.95rem;
    padding:7px 16px;
    border-radius:999px;
    border:1px solid var(--border-soft);
    background:transparent;
    color: var(--text-muted);
    cursor:pointer;
    transition: all .3s var(--ease);
  }
  .btn-ghost:hover{ color: var(--text); border-color: var(--border-strong); }

  .btn-primary{
    font-size:.95rem;
    padding:7px 18px;
    border-radius:999px;
    border:1px solid var(--border-strong);
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#241b0f;
    cursor:pointer;
    transition: all .3s var(--ease);
  }
  .btn-primary:hover{ box-shadow:0 0 16px rgba(243,200,119,.35); transform:translateY(-1px); }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:680px){
    .board{ padding:22px 16px 18px; }
    .row-head{ display:none; }
    .row-cols{ grid-template-columns:1fr; gap:10px; }
    .row .cell, .add-row .cell{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .row .cell[data-label]::before,
    .add-row .cell[data-label]::before{
      content:attr(data-label);
      font-size:.72rem;
      letter-spacing:.02em;
      color: var(--text-faint);
      flex:0 0 auto;
    }
    .cell-subject{ border-bottom:1px dashed var(--border-soft); padding-bottom:8px; margin-bottom:2px; }
    .cell-subject::before{ display:none; }
    .cell-completion .bar-track{ max-width:120px; }
    .add-row-actions{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

  <div class="board">
    <div class="ambient-glow" aria-hidden="true"></div>

    <header class="board-header">
      <div class="title-wrap">
        <h1>Subjects</h1>
        <p class="subtitle"><span id="subject-count">6</span> subjects · change a grade to update confidence &amp; completion</p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" aria-hidden="true" tabindex="-1" title="Search">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn" aria-hidden="true" tabindex="-1" title="Sort">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5-5 5 5"/><path d="M7 14l5 5 5-5"/></svg>
        </button>
        <button type="button" id="open-add" class="new-pill" aria-haspopup="true" aria-expanded="false" aria-controls="add-row-shell">+ New</button>
      </div>
    </header>

    <div class="table" role="table" aria-label="Subjects progress table">

      <div class="row-head row-cols" role="row">
        <div class="cell cell-subject" role="columnheader">Subject</div>
        <div class="cell cell-confidence" role="columnheader">Confidence</div>
        <div class="cell cell-grade" role="columnheader">Current grade</div>
        <div class="cell cell-completion" role="columnheader">Syllabus</div>
        <div class="cell cell-target" role="columnheader">Target</div>
        <div class="cell cell-tick" role="columnheader">Met</div>
      </div>

      <div id="rows-container" role="rowgroup"></div>

      <div class="add-row-shell" id="add-row-shell" inert>
        <div class="add-row-inner">
          <form id="add-form" class="add-row row-cols" novalidate>
            <div class="cell cell-subject" data-label="Subject">
              <label class="sr-only" for="new-subject-name">New subject name</label>
              <input type="text" id="new-subject-name" class="subject-input" placeholder="e.g. Geography" maxlength="40" aria-describedby="add-error">
            </div>
            <div class="cell cell-confidence" data-label="Confidence">
              <span class="conf-pill"><span class="dots"><i></i><i></i><i></i></span><span class="conf-label">—</span></span>
            </div>
            <div class="cell cell-grade" data-label="Current grade">
              <label class="sr-only" for="new-current-grade">Current grade for new subject</label>
              <div class="select-wrap">
                <select id="new-current-grade" class="grade-select"></select>
                <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </div>
            </div>
            <div class="cell cell-completion" data-label="Syllabus">
              <div class="bar-track"><div class="bar-fill"></div></div><span class="bar-num">—</span>
            </div>
            <div class="cell cell-target" data-label="Target">
              <label class="sr-only" for="new-target-grade">Target grade for new subject</label>
              <div class="select-wrap">
                <select id="new-target-grade" class="grade-select"></select>
                <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </div>
            </div>
            <div class="cell cell-tick" data-label="Met">
              <div class="tick-box" aria-hidden="true">
                <svg class="tick-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
              </div>
            </div>
          </form>
          <div class="add-row-actions">
            <span id="add-error" class="add-error" role="alert"></span>
            <button type="button" id="cancel-add" class="btn-ghost">Cancel</button>
            <button type="submit" form="add-form" class="btn-primary">Add subject</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="status-live" class="sr-only" aria-live="polite" role="status"></div>

  <template id="row-template">
    <div class="row row-cols" role="row">
      <div class="cell cell-subject" role="cell" data-label="Subject">
        <span class="subject-badge"></span><span class="subject-name"></span>
      </div>
      <div class="cell cell-confidence" role="cell" data-label="Confidence">
        <span class="conf-pill"><span class="dots"><i></i><i></i><i></i></span><span class="conf-label"></span></span>
      </div>
      <div class="cell cell-grade" role="cell" data-label="Current grade">
        <div class="select-wrap">
          <select class="grade-select"></select>
          <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="cell cell-completion" role="cell" data-label="Syllabus">
        <div class="bar-track"><div class="bar-fill"></div></div><span class="bar-num"></span>
      </div>
      <div class="cell cell-target" role="cell" data-label="Target"><span class="target-pill"></span></div>
      <div class="cell cell-tick" role="cell" data-label="Met">
        <div class="tick-box">
          <svg class="tick-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </div>
      </div>
    </div>
  </template>

<script>
  var GRADE_SCALE = ['F','D','C-','C','C+','B-','B','B+','A-','A','A*'];
  var DISPLAY_ORDER = GRADE_SCALE.slice().reverse();

  var SUBJECTS = [
    { name:'Biology', current:'A', target:'A*', offset:-10 },
    { name:'Physics', current:'C+', target:'A', offset:15 },
    { name:'English as a Second Language', current:'A-', target:'A', offset:5 },
    { name:'Computer Science', current:'A', target:'A*', offset:-15 },
    { name:'Mathematics', current:'B+', target:'A*', offset:0 },
    { name:'Chemistry', current:'B', target:'A', offset:0 }
  ];

  function idx(g){ return GRADE_SCALE.indexOf(g); }
  function tierOf(i){ return i >= 8 ? 'high' : (i >= 5 ? 'medium' : 'low'); }
  function tierLabel(t){ return t === 'high' ? 'High' : (t === 'medium' ? 'Medium' : 'Low'); }
  function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

  function populateGradeSelect(select, currentValue){
    select.innerHTML = '';
    DISPLAY_ORDER.forEach(function(g){
      var opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      if (g === currentValue) opt.selected = true;
      select.appendChild(opt);
    });
  }

  var statusLive = document.getElementById('status-live');
  function announce(text){ statusLive.textContent = text; }

  var rowTemplate = document.getElementById('row-template');
  var rowsContainer = document.getElementById('rows-container');
  var subjectCountEl = document.getElementById('subject-count');

  function createRowElement(subject){
    var row = rowTemplate.content.firstElementChild.cloneNode(true);

    var badge = row.querySelector('.subject-badge');
    var nameEl = row.querySelector('.subject-name');
    badge.textContent = subject.name.trim().charAt(0).toUpperCase() || '?';
    nameEl.textContent = subject.name;

    var select = row.querySelector('.grade-select');
    select.setAttribute('aria-label', 'Current grade for ' + subject.name);
    populateGradeSelect(select, subject.current);

    var targetPill = row.querySelector('.target-pill');
    targetPill.textContent = subject.target === 'A*' ? '\u2726 A*' : subject.target;

    var tickBox = row.querySelector('.tick-box');
    tickBox.setAttribute('role', 'img');

    function paint(initial){
      var i = idx(select.value);
      var tier = tierOf(i);

      var pill = row.querySelector('.conf-pill');
      pill.className = 'conf-pill tier-' + tier;
      pill.querySelector('.conf-label').textContent = tierLabel(tier);

      var completion = clamp(Math.round((i / 10) * 100 + subject.offset), 0, 100);
      row.querySelector('.bar-fill').style.width = completion + '%';
      row.querySelector('.bar-num').textContent = completion + '%';

      var matched = i >= idx(subject.target);
      var wasMatched = tickBox.classList.contains('met');
      tickBox.classList.toggle('met', matched);
      tickBox.setAttribute('aria-label', matched ? 'Target grade achieved' : 'Target grade not yet achieved');

      if (!initial){
        row.classList.remove('flash');
        void row.offsetWidth;
        row.classList.add('flash');

        if (matched && !wasMatched){
          tickBox.classList.remove('pulse');
          void tickBox.offsetWidth;
          tickBox.classList.add('pulse');
        }

        announce(subject.name + ' confidence ' + tierLabel(tier) + ', syllabus completion ' + completion + ' percent' + (matched ? ', target achieved.' : '.'));
      }
    }

    select.addEventListener('change', function(){
      subject.current = select.value;
      paint(false);
    });

    paint(true);
    return row;
  }

  function renderAll(){
    rowsContainer.innerHTML = '';
    SUBJECTS.forEach(function(s){ rowsContainer.appendChild(createRowElement(s)); });
    subjectCountEl.textContent = SUBJECTS.length;
  }
  renderAll();

  /* ---- Add-subject flow ---- */
  var openBtn = document.getElementById('open-add');
  var shell = document.getElementById('add-row-shell');
  var form = document.getElementById('add-form');
  var nameInput = document.getElementById('new-subject-name');
  var currentSelect = document.getElementById('new-current-grade');
  var targetSelect = document.getElementById('new-target-grade');
  var cancelBtn = document.getElementById('cancel-add');
  var errorEl = document.getElementById('add-error');

  populateGradeSelect(currentSelect, 'C');
  populateGradeSelect(targetSelect, 'A');

  function updateAddPreview(){
    var i = idx(currentSelect.value);
    var tier = tierOf(i);

    var pill = form.querySelector('.conf-pill');
    pill.className = 'conf-pill tier-' + tier;
    form.querySelector('.conf-label').textContent = tierLabel(tier);

    var completion = clamp(Math.round((i / 10) * 100), 0, 100);
    form.querySelector('.bar-fill').style.width = completion + '%';
    form.querySelector('.bar-num').textContent = completion + '%';

    var matched = i >= idx(targetSelect.value);
    form.querySelector('.tick-box').classList.toggle('met', matched);
  }
  currentSelect.addEventListener('change', updateAddPreview);
  targetSelect.addEventListener('change', updateAddPreview);
  updateAddPreview();

  function openAdd(){
    shell.classList.add('open');
    shell.removeAttribute('inert');
    openBtn.setAttribute('aria-expanded', 'true');
    nameInput.focus();
  }
  function closeAdd(){
    shell.classList.remove('open');
    shell.setAttribute('inert', '');
    openBtn.setAttribute('aria-expanded', 'false');
    form.reset();
    nameInput.setAttribute('aria-invalid', 'false');
    errorEl.textContent = '';
    updateAddPreview();
    openBtn.focus();
  }

  openBtn.addEventListener('click', function(){
    if (shell.classList.contains('open')) { closeAdd(); } else { openAdd(); }
  });
  cancelBtn.addEventListener('click', closeAdd);

  shell.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeAdd(); }
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = nameInput.value.trim();
    if (!name){
      errorEl.textContent = 'Please enter a subject name.';
      nameInput.setAttribute('aria-invalid', 'true');
      nameInput.focus();
      return;
    }

    var subject = { name: name, current: currentSelect.value, target: targetSelect.value, offset: 0 };
    SUBJECTS.push(subject);

    var row = createRowElement(subject);
    row.classList.add('new-row');
    rowsContainer.appendChild(row);
    subjectCountEl.textContent = SUBJECTS.length;
    announce('Added new subject: ' + name + '.');

    nameInput.value = '';
    errorEl.textContent = '';
    nameInput.setAttribute('aria-invalid', 'false');
    nameInput.focus();
  });
</script>
</body>
</html>
