<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Custom Graph Dashboard</title>
    
    <!-- Sail Font & DM Sans Fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sail&family=DM+Sans:wght@700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Core Dark Palette */
            --notion-dark: #191919;
            --panel-bg: rgba(22, 22, 26, 0.88);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            
            /* Dynamic Accent Theme */
            --theme-hex: #f59e0b;
            --theme-rgb: 245, 158, 11;
            
            --theme-glow: 0 0 35px rgba(var(--theme-rgb), 0.35);
            --white-glow: 0 0 20px rgba(255, 255, 255, 0.3);
            --dropdown-bg: rgba(20, 20, 26, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sail', cursive, sans-serif !important;
        }

        body {
            background-color: var(--notion-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px;
            overflow-x: hidden;
        }

        /* Floating Panel Animation */
        @keyframes idleFloat {
            0% { transform: translateY(0px); box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1); }
            50% { transform: translateY(-6px); box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(var(--theme-rgb),0.35), var(--theme-glow); }
            100% { transform: translateY(0px); box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1); }
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-glass);
            border-top: 3px solid var(--theme-hex);
            border-radius: 28px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            animation: idleFloat 7s ease-in-out infinite;
            transition: border-color 0.4s ease;
        }

        /* Header Controls */
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 20px;
        }

        .header-left, .header-right {
            display: flex;
            gap: 20px;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 1.15rem;
            color: var(--theme-hex);
            letter-spacing: 0.05em;
            transition: color 0.4s ease;
        }

        .custom-input {
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid var(--border-glass);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1.25rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            border-color: var(--theme-hex);
            box-shadow: 0 0 15px rgba(var(--theme-rgb), 0.35);
        }

        .color-picker {
            width: 48px;
            height: 48px;
            padding: 0;
            border: 2px solid var(--border-glass);
            border-radius: 12px;
            cursor: pointer;
            background: transparent;
            transition: border-color 0.3s;
        }
        .color-picker:hover { border-color: var(--theme-hex); }

        /* Add Task Button */
        .add-btn {
            background: rgba(var(--theme-rgb), 0.2);
            color: var(--theme-hex);
            border: 2px solid var(--theme-hex);
            padding: 0 24px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            height: 48px;
            display: flex;
            align-items: center;
        }

        .add-btn:hover {
            background: var(--theme-hex);
            color: #000;
            box-shadow: 0 0 25px rgba(var(--theme-rgb), 0.5);
            transform: translateY(-3px) scale(1.03);
        }

        /* Horizontal Graph Container */
        .graph-area {
            position: relative;
            width: 100%;
            height: 380px;
            display: flex;
            align-items: flex-end;
            justify-content: space-evenly;
            gap: 12px;
            padding: 50px 15px 20px 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            border-left: 2px solid rgba(255, 255, 255, 0.2);
        }

        .y-axis-label {
            position: absolute;
            left: -10px;
            top: -28px;
            font-size: 1.35rem;
            color: var(--text-muted);
        }

        .x-axis-label {
            position: absolute;
            right: 0;
            bottom: -36px;
            font-size: 1.35rem;
            color: var(--text-muted);
        }

        /* Data Group Column with Entrance Animation */
        .data-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            position: relative;
            flex: 1 1 0;
            max-width: 85px;
            gap: 8px;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Smooth Spawn / Enter Animation for New Tasks */
        .data-group.entering {
            opacity: 0;
            transform: scale(0.3) translateY(40px);
            max-width: 0px;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .due-date-tag {
            position: absolute;
            top: -42px;
            font-size: 1.15rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 10px;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.25);
            white-space: nowrap;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .bars-container {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            height: 100%;
            width: 100%;
            justify-content: center;
        }

        /* The Vertical Bars - Ultra Smooth Height Transition! */
        .bar {
            width: 100%;
            max-width: 26px; 
            border-radius: 8px 8px 0 0;
            /* Smooth springy height curve without collapsing hard! */
            transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s ease, filter 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            cursor: pointer;
            height: 0%;
        }

        /* Dynamic Priority Bar */
        .bar-priority {
            background: linear-gradient(180deg, var(--theme-hex) 0%, rgba(var(--theme-rgb), 0.15) 100%);
            border: 1px solid rgba(var(--theme-rgb), 0.7);
            border-bottom: none;
        }

        /* Status Bar (Shiny White) */
        .bar-status {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.08) 100%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-bottom: none;
        }

        .bar:hover {
            transform: scaleY(1.03) scaleX(1.1);
            filter: brightness(1.25);
            box-shadow: var(--white-glow);
            z-index: 5;
        }
        .bar-priority:hover { box-shadow: var(--theme-glow); }

        /* X-Axis Bottom Labels - Larger & Visible */
        .x-labels {
            position: absolute;
            bottom: -52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 100%;
            text-align: center;
        }
        
        .x-priority { 
            font-size: 1.25rem; 
            color: var(--theme-hex); 
            transition: color 0.4s;
            line-height: 1.1;
        }
        .x-type { 
            font-size: 1.15rem; 
            color: var(--text-main); 
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90px;
        }

        /* Interactive Task Editor Grid */
        .editor-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            background: rgba(0, 0, 0, 0.35);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border-glass);
            margin-top: 10px;
        }

        .editor-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .editor-card:hover { 
            border-color: rgba(var(--theme-rgb), 0.5); 
            transform: translateY(-2px);
        }

        .editor-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        /* Topic Name Editor Input */
        .task-name-edit {
            background: transparent;
            border: none;
            color: var(--theme-hex);
            font-size: 1.35rem;
            width: 100%;
            outline: none;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.25);
            padding-bottom: 4px;
            transition: all 0.3s;
        }

        .task-name-edit:focus { border-bottom-color: var(--theme-hex); }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 10px;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .delete-btn:hover { background: #ef4444; color: white; transform: scale(1.1); }

        /* BOLD & AESTHETIC DROPDOWNS */
        .interactive-select {
            appearance: none;
            width: 100%;
            background-color: var(--dropdown-bg);
            color: var(--text-main);
            border: 2px solid rgba(255, 255, 255, 0.18);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 1.2rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            
            /* Styled Arrow */
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px top 50%;
            background-size: 12px auto;
        }

        .interactive-select:hover, .interactive-select:focus {
            border-color: var(--theme-hex);
            background-color: rgba(var(--theme-rgb), 0.12);
            box-shadow: 0 0 15px rgba(var(--theme-rgb), 0.25);
            transform: translateY(-2px);
        }

        /* LIMIT WARNING MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--theme-hex);
            box-shadow: 0 0 50px rgba(var(--theme-rgb), 0.4);
            padding: 35px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-title {
            font-size: 1.8rem;
            color: var(--theme-hex);
            margin-bottom: 10px;
        }

        .modal-text {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .modal-close-btn {
            background: var(--theme-hex);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .modal-close-btn:hover { box-shadow: 0 0 20px rgba(var(--theme-rgb), 0.5); transform: translateY(-2px); }

    </style>
</head>
<body>

    <div class="dashboard-wrapper" role="region" aria-label="Dynamic Task Graph Dashboard">
        
        <!-- Controls Header -->
        <div class="controls-header">
            <div class="header-left">
                <div class="input-group">
                    <label class="input-label" for="yAxisName">Y-Axis Name</label>
                    <input type="text" id="yAxisName" class="custom-input" value="Impact & Progress" oninput="updateLabels()">
                </div>
                
                <div class="input-group">
                    <label class="input-label" for="xAxisName">X-Axis Name</label>
                    <input type="text" id="xAxisName" class="custom-input" value="Task Categories" oninput="updateLabels()">
                </div>
            </div>

            <div class="header-right">
                <div class="input-group">
                    <label class="input-label" for="themeColorPicker">Widget Theme</label>
                    <input type="color" id="themeColorPicker" class="color-picker" value="#f59e0b" oninput="updateThemeColor()">
                </div>
                
                <button class="add-btn" onclick="addTask()">Add Task +</button>
            </div>
        </div>

        <!-- Graph Display Area -->
        <div class="graph-area" id="graphArea" aria-live="polite">
            <span class="y-axis-label" id="yLabelDisplay">Impact & Progress</span>
            <span class="x-axis-label" id="xLabelDisplay">Task Categories</span>
            <!-- Rendered Graph Columns -->
        </div>

        <!-- Task Editor Cards Grid -->
        <div class="editor-section" id="editorArea">
            <!-- Rendered Editor Cards -->
        </div>

    </div>

    <!-- Modal Warning for Max Limit -->
    <div class="modal-overlay" id="limitModal">
        <div class="modal-content">
            <h2 class="modal-title">Limit Reached! 🛑</h2>
            <p class="modal-text">You have reached the limit of 8 tasks to keep spacing perfect. Please delete an existing task to add a new one.</p>
            <button class="modal-close-btn" onclick="closeModal()">Got it!</button>
        </div>
    </div>

    <script>
        // Dates options generated dynamically for dropdown
        const datesList = [
            "Jul 1", "Jul 2", "Jul 3", "Jul 4", "Jul 5", "Jul 6", "Jul 7", "Jul 8", "Jul 9", "Jul 10",
            "Jul 11", "Jul 12", "Jul 13", "Jul 14", "Jul 15", "Jul 16", "Jul 17", "Jul 18", "Jul 19", "Jul 20",
            "Jul 21", "Jul 22", "Jul 23", "Jul 24", "Jul 25", "Jul 26", "Jul 27", "Jul 28", "Jul 29", "Jul 30", "Jul 31"
        ];

        // Default Initial Tasks Dataset
        let tasks = [
            { id: 1, name: "Genetics Rev", dueDate: "Jul 26", priority: "High", status: "Not Started" },
            { id: 2, name: "Notion Store", dueDate: "Jul 28", priority: "Low", status: "Not Started" },
            { id: 3, name: "Algebra Paper", dueDate: "Jul 25", priority: "High", status: "In Progress" },
            { id: 4, name: "Essay Practice", dueDate: "Jul 23", priority: "Medium", status: "Done" },
            { id: 5, name: "Chem Sheet", dueDate: "Jul 27", priority: "Medium", status: "Not Started" }
        ];

        // Priority and Status height values
        const priorityHeights = { "High": "95%", "Medium": "60%", "Low": "25%" };
        const statusHeights = { "Done": "95%", "In Progress": "55%", "Not Started": "15%" };

        function initGraph() {
            renderGraphFull();
            renderEditors();
        }

        // 1. Full Graph Renderer
        function renderGraphFull() {
            const graphArea = document.getElementById('graphArea');
            const bars = graphArea.querySelectorAll('.data-group');
            bars.forEach(b => b.remove());

            tasks.forEach((task, index) => {
                const group = createGraphColumn(task, index);
                graphArea.appendChild(group);

                // Initial load bar height transition trigger
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        const barP = document.getElementById(`bar-p-${index}`);
                        const barS = document.getElementById(`bar-s-${index}`);
                        if(barP) barP.style.height = priorityHeights[task.priority] || "10%";
                        if(barS) barS.style.height = statusHeights[task.status] || "10%";
                    }, 50 * index);
                });
            });
        }

        // Helper: Create single DOM element for graph column
        function createGraphColumn(task, index) {
            const group = document.createElement('div');
            group.className = 'data-group';
            group.id = `bar-group-${index}`;
            
            group.innerHTML = `
                <div class="due-date-tag" id="date-tag-${index}">📅 ${task.dueDate}</div>
                <div class="bars-container">
                    <div class="bar bar-priority" id="bar-p-${index}" title="Priority: ${task.priority}"></div>
                    <div class="bar bar-status" id="bar-s-${index}" title="Status: ${task.status}"></div>
                </div>
                <div class="x-labels">
                    <span class="x-priority" id="label-p-${index}">${task.priority}</span>
                    <span class="x-type" id="topic-display-${index}">${task.name}</span>
                </div>
            `;
            return group;
        }

        // 2. Editor Cards Renderer
        function renderEditors() {
            const editorArea = document.getElementById('editorArea');
            editorArea.innerHTML = '';

            tasks.forEach((task, index) => {
                const card = document.createElement('div');
                card.className = 'editor-card';
                card.id = `editor-card-${index}`;
                
                // Build Date dropdown options
                let dateOptionsHTML = datesList.map(d => `<option value="${d}" ${task.dueDate === d ? 'selected' : ''}>📅 Date: ${d}</option>`).join('');

                card.innerHTML = `
                    <div class="editor-card-header">
                        <input type="text" class="task-name-edit" value="${task.name}" oninput="updateTaskName(${index}, this.value)" placeholder="Topic Name">
                        <button class="delete-btn" onclick="deleteTask(${index})" title="Delete Task">✕</button>
                    </div>
                    
                    <select class="interactive-select" onchange="updateTaskDate(${index}, this.value)">
                        ${dateOptionsHTML}
                    </select>

                    <select class="interactive-select" onchange="updateTaskDropdown(${index}, 'priority', this.value)">
                        <option value="High" ${task.priority === 'High' ? 'selected' : ''}>🔥 Priority: High</option>
                        <option value="Medium" ${task.priority === 'Medium' ? 'selected' : ''}>⚡ Priority: Medium</option>
                        <option value="Low" ${task.priority === 'Low' ? 'selected' : ''}>🧊 Priority: Low</option>
                    </select>
                    
                    <select class="interactive-select" onchange="updateTaskDropdown(${index}, 'status', this.value)">
                        <option value="Done" ${task.status === 'Done' ? 'selected' : ''}>✅ Status: Done</option>
                        <option value="In Progress" ${task.status === 'In Progress' ? 'selected' : ''}>⏳ Status: In Progress</option>
                        <option value="Not Started" ${task.status === 'Not Started' ? 'selected' : ''}>❌ Status: Not Started</option>
                    </select>
                `;
                editorArea.appendChild(card);
            });
        }

        // 3. Smooth Dropdown Updates (Without Collapsing!)
        function updateTaskDropdown(index, field, value) {
            tasks[index][field] = value;
            
            const barP = document.getElementById(`bar-p-${index}`);
            const barS = document.getElementById(`bar-s-${index}`);
            const labelP = document.getElementById(`label-p-${index}`);

            if (field === 'priority' && barP) {
                barP.style.height = priorityHeights[value];
                if(labelP) labelP.innerText = value;
            } else if (field === 'status' && barS) {
                barS.style.height = statusHeights[value];
            }
        }

        // 4. Update Date Dropdown Live
        function updateTaskDate(index, newDate) {
            tasks[index].dueDate = newDate;
            const tag = document.getElementById(`date-tag-${index}`);
            if (tag) tag.innerText = `📅 ${newDate}`;
        }

        // 5. Update Topic Name Live
        function updateTaskName(index, newName) {
            tasks[index].name = newName;
            const topicDisplay = document.getElementById(`topic-display-${index}`);
            if (topicDisplay) {
                topicDisplay.innerText = newName || "Task";
            }
        }

        // 6. Smooth Add & Delete Tasks with Entrance Animations
        function addTask() {
            if (tasks.length >= 8) {
                document.getElementById('limitModal').classList.add('active');
                return;
            }

            const newIndex = tasks.length;
            const newTask = { 
                id: Date.now(), 
                name: `Topic ${newIndex + 1}`, 
                dueDate: "Jul 24", 
                priority: "Low", 
                status: "Not Started" 
            };
            tasks.push(newTask);

            // Append element with animation class
            const graphArea = document.getElementById('graphArea');
            const newCol = createGraphColumn(newTask, newIndex);
            newCol.classList.add('entering');
            graphArea.appendChild(newCol);

            // Re-render editor cards
            renderEditors();

            // Trigger smooth expand animation
            requestAnimationFrame(() => {
                setTimeout(() => {
                    newCol.classList.remove('entering');
                    const barP = document.getElementById(`bar-p-${newIndex}`);
                    const barS = document.getElementById(`bar-s-${newIndex}`);
                    if(barP) barP.style.height = priorityHeights[newTask.priority];
                    if(barS) barS.style.height = statusHeights[newTask.status];
                }, 50);
            });
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            initGraph(); // Re-index and smoothly balance layout
        }

        function closeModal() { document.getElementById('limitModal').classList.remove('active'); }

        // 7. Dynamic Axis Label Sync
        function updateLabels() {
            document.getElementById('yLabelDisplay').innerText = document.getElementById('yAxisName').value;
            document.getElementById('xLabelDisplay').innerText = document.getElementById('xAxisName').value;
        }

        // 8. Dynamic Theme Color Handler
        function hexToRgb(hex) {
            let bigint = parseInt(hex.replace('#', ''), 16);
            let r = (bigint >> 16) & 255;
            let g = (bigint >> 8) & 255;
            let b = bigint & 255;
            return `${r}, ${g}, ${b}`;
        }

        function updateThemeColor() {
            const hex = document.getElementById('themeColorPicker').value;
            const rgb = hexToRgb(hex);
            
            document.documentElement.style.setProperty('--theme-hex', hex);
            document.documentElement.style.setProperty('--theme-rgb', rgb);
        }

        // Run on load
        window.onload = initGraph;
    </script>
